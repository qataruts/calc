<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>«اِحْسِبْ» على مقاسات الآيباد</title>
<style>html,body{margin:0;height:100%}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="/"></iframe>
<script type="module">
  /* صفحةُ الجهاز: التطبيقُ يملأ المنظور بمقاس الآيباد الذي فُتحت به النافذة،
     فيُقاس **الفائضُ الأفقيّ** حيث يقع فعلاً — لا في إطارٍ ذي مقاسٍ آخر.
     و«بلا فائض أفقي» عهدٌ مطلق (`METHOD.md §١٠.٧`): طفلُ الرابعة لا يسحب ليجد زرّاً. */
  const frame = document.getElementById('app');

  /* **وتُقاس شاشاتُ التمارين لا الخريطةُ وحدَها** (الجلسة ٣): الكمياتُ المرسومة أوسعُ
     ما في التطبيق (لوحُ العدّ يفرد الشكلَ ليبلغ العنصرُ هدفَ اللمس)، فهي أولى ما
     يفيض على آيباد mini. ويُبلَّغ **أسوأُ** ما قِيس لا آخرُه. */
  const SCREENS = [
    '/',                                  // الخريطة
    '/?preview=1&v=2#/count/ten',         // لوحُ العدّ — أوسعُ كمّيةٍ في الرحلة
    '/?preview=1&v=3#/more/five',         // كميّتان متجاورتان
    '/?preview=1&v=4#/equal/five',        // لوحا التسوية مرصوصان (م٥: لمسٌ لا أزرار)
    // **والجلسةُ ٤ تزيد أوسعَ ما رُسم بعدُ**: خطُّ الأعداد يفرد إحدى عشرةَ خانةً
    // على عرض البطاقة، وصفُّ الترتيب أربعَ بطاقاتِ رمز.
    '/?preview=1&v=5#/line/ten',          // خطُّ الأعداد — أوسعُ شكلٍ في الرحلة
    '/?preview=1&v=6#/order/ten',         // بطاقاتُ الترتيب وصفُّها
    '/?preview=1&v=7#/numeral/ten',       // بطاقةُ الرمز وبطاقاتُ الكمّ
    // **والجلسةُ ٥ تزيد لوحَ الجسر**: كلٌّ فوق وخانتان تحته وخمسُ بطاقاتِ أجزاءٍ
    // أسفلَهما — أطولُ ما رُسم في الرحلة، وأولى ما يفيض على أضيق آيباد.
    '/?preview=1&v=8#/bond/seven',        // لوحُ الجسر ببطاقاته
    '/?preview=1&v=9#/bond/ten',          // إطارُ «أصدقاء العشرة» وبطاقاتُه
    // **والجلسةُ ٦ تزيد لوحَ العملية**: جملةٌ رمزيةٌ في سطرٍ واحد وتحتها كمّيتُها
    // وتحتهما بطاقاتُ الجواب — وأعرضُها صفُّ الفرق (إطارا عشرةٍ أحدهما تحت الآخر).
    '/?preview=1&v=10#/add/machine',      // المجموعتان تلتقيان
    '/?preview=1&v=11#/add/ten',          // الجملةُ وإطارُ العشرة تحتها
    '/?preview=1&v=12#/diff/ten',         // صفّا الفرق المتحاذيان
    /* **والجلسةُ ٧ تزيد أوسعَ ما رُسم في الرحلة كلِّها**: الإطاران (عشرون خانةً في
       سطرٍ واحد) في البناء وفي العبور، وشريطُ النمط (تسعُ خاناتٍ) ومشهدُ القياس
       (أشياءُ بمقاديرَ على خطٍّ واحد) — وصفوفُ محطة التعارف عشرةٌ في شبكة. */
    '/?preview=1&v=13#/teen/twenty',      // الإطاران — أعرضُ كمّيةٍ في الرحلة
    '/?preview=1&v=14#/bridge/twenty',    // إطارٌ ومُضافُه، ثم الإطاران حصيلةً
    '/?preview=1&v=15#/pattern/abc',      // شريطُ النمط — سبعُ خاناتٍ وبطاقاتُه
    '/?preview=1&v=16#/measure/time',     // مشهدُ القياس — ثلاثةُ مقادير
    '/?preview=1&v=17#/intro/latin',      // صفوفُ التعارف العشرة
  ];

  let worst = { overflow: -1e9 };
  for (const src of SCREENS) {
    frame.src = src;
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    await new Promise((r) => setTimeout(r, 1200));
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    const row = {
      overflow: doc.documentElement.scrollWidth - win.innerWidth,
      width: win.innerWidth,
      height: win.innerHeight,
      at: src,
    };
    if (row.overflow > worst.overflow) worst = row;
  }

  await fetch('/result', { method: 'POST', body: JSON.stringify({ from: 'ihsib', rows: [worst] }) });
</script>
</body>
</html>
