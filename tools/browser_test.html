    `وتمارينُها مبنيّةٌ من مهاراته المسجَّلة (${opsDots} تمريناً، وأوّلُها معروضٌ ببطاقاته)`);

  for (let i = 0; i < 60 && !mdoc.querySelector('.celebrate'); i++) {
    (answerOf(mdoc) || mdoc.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 460));
  }
  const opsVerdict = mdoc.querySelector('.celebrate');
  ok(!!opsVerdict && !/رسوب|فشل|خطأ/.test(shownIn(opsVerdict)),
    `وتُجتاز إلى حكمها بلا لفظ رسوب (${opsVerdict
      && !opsVerdict.classList.contains('celebrate--again') ? 'فُتِحَت' : 'لَيْسَ بَعْدُ'})`);

  // ————— ج) «رَمْزُ + وَالجَمْعُ ضِمْنَ ٥» (٦·٢): الجملةُ وكمّيتُها معاً —————
  const adoc = await open('#/add/five');
  (await onward(adoc))?.click();
  await until(adoc, (d) => d.querySelector('.q-sentence'), 12000);
  const terms = [...adoc.querySelectorAll('.q-sentence .q-term .figure')]
    .map((f) => Number(f.dataset.drawn));
  const plus = adoc.querySelector('.q-sentence .q-sign')?.textContent || '';
  const factBox = adoc.querySelector('.q-fact');
  const factFig = adoc.querySelector('.q-fact .figure');
  const factShown = factBox && !factBox.hidden
    && adoc.defaultView.getComputedStyle(factBox).display !== 'none';
  ok(terms.length === 2 && plus === '+' && !!adoc.querySelector('.q-ask'),
    `وجملةُ ٦·٢ رمزان وعلامةٌ وخانةُ سؤال (${terms.join(` ${plus} `)} ؟)`);
  ok(factShown && factFig
    && Number(factFig.dataset.drawn) === terms[0] + terms[1]
    && Number(factFig.dataset.split) === terms[0],
  `و**الكمّيةُ والرمزُ معاً في أوّل لقاء**: تحت الجملة كمّيةٌ رُسِم منها `
    + `${factFig ? factFig.dataset.split : '؟'} ثم بقيّتُها، ومجموعُها `
    + `${factFig ? factFig.dataset.drawn : '؟'} — وهو مجموعُ رمزَيها`);

  // والإصابةُ تُتمّ الجملةَ في خانتها
  answerOf(adoc)?.click();
  await new Promise((r) => setTimeout(r, 400));
  const filledAsk = adoc.querySelector('.q-ask.is-full');
  ok(!!filledAsk && arDigits(filledAsk.textContent) === terms[0] + terms[1],
    `وبالإصابة تتمّ الجملةُ في خانتها (${filledAsk ? filledAsk.textContent : '؟'})`);

  // **ثم بالرمز وحدَه والكمّيةُ عوناً عند النقر** (`METHOD.md §٣`)
  let peek = null;
  for (let i = 0; i < 16 && !peek; i++) {
    const btn = adoc.querySelector('.q-peek');
    if (btn && !btn.hidden) { peek = btn; break; }
    (answerOf(adoc) || adoc.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 500));
  }
  const soloFact = adoc.querySelector('.q-fact');
  const soloHidden = soloFact && soloFact.hidden
    && adoc.defaultView.getComputedStyle(soloFact).display === 'none';
  peek?.click();
  await new Promise((r) => setTimeout(r, 250));
  ok(!!peek && soloHidden && soloFact && !soloFact.hidden,
    'وفي «وحدك» الرمزُ وحدَه — **والكمّيةُ عونٌ عند النقر**، بلا حدٍّ ولا احتساب');

  // ————— د) «رَمْزُ − وَالطَّرْحُ ضِمْنَ ٥» (٦·٣): الإزالةُ مرئية —————
  const tdoc = await open('#/sub/five');
  (await onward(tdoc))?.click();
  const takeFig = await until(tdoc, (d) => d.querySelector('.q-fact .figure'), 12000);
  const leftGone = takeFig ? takeFig.querySelectorAll('[data-mark].is-gone').length : 0;
  const stillHere = takeFig ? Number(takeFig.dataset.split) : -1;
  const takeBoard = tdoc.querySelector('.q-solve');
  const minus = tdoc.querySelector('.q-sentence .q-sign')?.textContent || '';
  ok(minus === '−' && leftGone > 0 && takeFig
    && stillHere + leftGone === Number(takeFig.dataset.drawn)
    && Number(takeBoard.dataset.answer) === stillHere,
  `و«رَمْزُ −» إزالةٌ مرئية: ${leftGone} مشطوبٌ من ${takeFig ? takeFig.dataset.drawn : '؟'}، `
    + `**والجوابُ ما لم يُشطَب** (${stillHere}) مقروءاً من الرسم`);

  // ————— هـ) «كَمِ الفَرْقُ بَيْنَهُمَا؟» (٦·٦): صفّان متحاذيان —————
  const fdoc6 = await open('#/diff/ten');
  /* **ونمذجتُها تُرَصّ كما تُرَصّ «وحدك»** (قيدُ إصلاح مراجعة الجلسة ٦): التلميحُ يقول
     «الصَّفَّ الأَعْلَى» — فإن عُرِضت الكمّيتان جنباً إلى جنب فلا صفَّ أعلى في الصورة،
     والكلامُ لا يطابق العين. **والفحصُ يقيس الرصَّ لا يقرأ النصّ**: أعلى الأوّل فوق
     أسفل الثاني، ويسارُهما واحد. */
  const bare = (t) => String(t).replace(/[ً-ْٰ]/g, '');
  await until(fdoc6, (d) => (d.querySelectorAll('.q-stage .figure').length === 2 ? true : null), 14000);
  const modelPair = [...fdoc6.querySelectorAll('.q-stage .figure')];
  const modelStacked = modelPair.length === 2
    && Math.abs(rectOf(modelPair[0]).left - rectOf(modelPair[1]).left) < 2
    && rectOf(modelPair[0]).bottom <= rectOf(modelPair[1]).top + 1;
  const modelHint = bare(shownIn(fdoc6.querySelector('.station-body .hint')));
  ok(modelStacked && modelHint.includes('الصف الأعلى'),
    `ونمذجةُ الفرق **صفٌّ تحت صفّ** كما في «وحدك» (${modelPair.length} صفّاً`
    + `${modelPair.length === 2 ? `، فرقُ اليسار ${Math.round(Math.abs(rectOf(modelPair[0]).left
      - rectOf(modelPair[1]).left))}px` : ''}) — والكلامُ يطابق العين`);
  (await onward(fdoc6))?.click();
  await until(fdoc6, (d) => d.querySelector('.q-fact-body.q-rows .figure'), 14000);
  const diffRows = [...fdoc6.querySelectorAll('.q-fact-body.q-rows .figure')];
  const diffBoard = fdoc6.querySelector('.q-solve');
  const rowsAligned = diffRows.length === 2
    && Math.abs(rectOf(diffRows[0]).left - rectOf(diffRows[1]).left) < 2
    && rectOf(diffRows[0]).bottom <= rectOf(diffRows[1]).top + 1;
  ok(rowsAligned && Number(diffBoard.dataset.answer)
    === Number(diffRows[0].dataset.drawn) - Number(diffRows[1].dataset.drawn),
  `و«كَمِ الفَرْقُ» صفّان متحاذيان (${diffRows.map((f) => f.dataset.drawn).join(' و')})، `
    + `**والفرقُ من المرسوم** (${diffBoard ? diffBoard.dataset.answer : '؟'})`);

  /* ————— ١١هـ) المرحلة ٧: العشرةُ وما بعدها ١١–٢٠ (الجلسة ٧) —————

     أربعةُ عهودٍ لا يُثبتها إلا متصفّح:
       • **ما فوق العشرة يُبنى ولا يُعَدّ فرادى** (`METHOD.md §٢.٢` المعتمد): النمذجةُ
         **تُعلّم الحزمةَ كلَّها في لحظةٍ واحدة** ثم تَعُدّ الآحادَ فوقها — فلا مشيَ على
         أربعةَ عشرَ عنصراً واحداً واحداً.
       • **والبناءُ حزمةٌ وآحاد**: خانتان تُملآن، وإحدى البطاقات إطارٌ ممتلئ.
       • **والعبورُ صعوداً خطوتان**: كم يُكمِل العشرة، ثم كم صارت كلُّها.
       • **والعبورُ نازلاً يفرغ من حيث امتلأ**: أوّلُ ما يغادر آخرُ ما مُلئ. */

  // ————— أ) «١١–١٥ عَشَرَةٌ وَآحَاد»: الحزمةُ تُسمّى ثم تُعَدّ الآحادُ فوقها —————
  const teenDoc = await open('#/teen/fifteen');
  const teenModel = await until(teenDoc, (d) => d.querySelector('.q-stage .figure[data-split]'), 14000);
  ok(teenModel && Number(teenModel.dataset.drawn) > 10
    && teenModel.querySelectorAll('[data-part="a"]').length === 10,
  `محطةُ «١١–١٥» تُنمذِج **عشرةً وآحاداً**: ${teenModel
    ? teenModel.querySelectorAll('[data-part="a"]').length : '؟'} في الحزمة `
    + `و${teenModel ? teenModel.querySelectorAll('[data-part="b"]').length : '؟'} فوقها `
    + `من ${teenModel ? teenModel.dataset.drawn : '؟'} مرسومة`);

  /* **والحزمةُ تُعلَّم دفعةً واحدة**: يُنتظَر أوّلُ تعليمٍ في النمذجة، فيجب أن يكون
     **عشرةَ عناصرَ معاً** لا عنصراً واحداً — وهو الفرقُ بين «تُبنى» و«تُعَدّ فرادى». */
  const litAtOnce = await until(teenDoc,
    (d) => d.querySelectorAll('.q-stage [data-mark].is-counted').length || null, 16000);
  ok(litAtOnce >= 10,
    `و**الحزمةُ تُعلَّم دفعةً واحدة** (${litAtOnce || 0} عنصراً في أوّل تعليم) — `
    + 'فما فوق العشرة يُبنى ولا يُعَدّ فرادى');

  (await onward(teenDoc))?.click();
  const teenBoard = await until(teenDoc, (d) => d.querySelector('.q-bond, .q-solve--teen'), 14000);
  if (teenBoard && teenBoard.classList.contains('q-bond')) {
    const bundle = cardsOf(teenDoc).find((c) => Number(c.querySelector('.figure')?.dataset.drawn) === 10);
    ok(Number(teenBoard.dataset.slots) === 2 && !!bundle,
      `ولوحُ البناء **خانتان** وفي بطاقاته حزمةُ عشرةٍ ممتلئة `
      + `(المطلوب ${teenBoard.dataset.need})`);
  } else {
    ok(!!teenBoard, 'ولوحُها يُرسَم (بناءً أو قراءةً بحسب دور الوجه)');
  }
  const teenDone = await play(teenDoc, 90);
  ok(!!teenDone && teenDoc.querySelectorAll('.big-stars .on').length > 0,
    `ومحطةُ «١١–١٥» تُجتاز كاملةً لمساً حتى الاحتفال `
    + `(${teenDoc.querySelectorAll('.big-stars .on').length} نجمة)`);

  // ————— ب) «اِصْنَعْ عَشَرَةً أَوَّلًا» (٧·٥): سؤالان في جولةٍ واحدة —————
  const bridge = await open('#/bridge/twenty');
  (await onward(bridge))?.click();
  const brBoard = await until(bridge, (d) => d.querySelector('.q-solve--bridge'), 16000);
  const brFrames = brBoard ? [...brBoard.querySelectorAll('.q-fact-body .figure')] : [];
  const brGap = brFrames[0]
    ? brFrames[0].querySelectorAll('[data-cell]').length - Number(brFrames[0].dataset.drawn) : -1;
  const brSplit = brFrames[1] ? Number(brFrames[1].dataset.split) : -1;
  ok(brBoard && Number(brBoard.dataset.answer) === brGap && brGap === brSplit,
    `و«اِصْنَعْ عَشَرَةً أَوَّلًا» تسأل أوّلاً **ما يُكمِل العشرة** — `
    + `${brGap} خانةً فارغة، وهي شقُّ المُضاف نفسُه (${brSplit}) مقروءين من الرسم`);

  /* ————— بلاغُ الميدان ٧ (المالك، ١٦ أغسطس): «كم بقي» تشرح نفسَها —————

     بتدقيقه: «كم بقي للعشرة ثم ٩+٣ مربكة. كم بقي لوحدها اوكي، لكن لما ٩ + ٣؟» —
     فالسؤالُ سليمٌ بذاته، والإرباكُ من **جملةٍ تتصدّر سؤالاً ليست جوابَه**، ومن
     **عبورٍ لا يُرى**. وثلاثةُ أحكامٍ تقيس ما رآه الميدان:

       • لا جملةَ فوق السؤال الأول، وتظهر مع «كَمْ صَارَتْ مَعًا؟» الذي خانتُها جوابُه.
       • وإطارُ العشرة **يمتلئ قبل** مشهد الإطارين — عبورٌ وقع لا قفزة.
       • وفي «وحدك» الشقُّ الملوّن **لا يسبق الجواب** (يُطلَب بالنقر، عهدُ المرحلة ٦).

     **ويُقاس الرسمُ لا الوعد** (`SEED.md §٩`: `hidden` يعلو عليه كلُّ `display` من
     أصلنا فيكذب صامتاً)، فتُسأل الجملةُ عن صناديقها المرسومة. */
  const brDrawn = (el) => !!el && el.getClientRects().length > 0;
  ok(brBoard && !brDrawn(brBoard.querySelector('.q-sentence')),
    'ولا جملةَ جمعٍ فوق السؤال الأول — **الإطاران وحدَهما مشهدُه** (بلاغ الميدان ٧)');

  /* **وشاهدُ الترتيب مِرقَبٌ لا عيّنة** (سنّةُ `seenOnce`): نافذةُ العبور مئاتُ
     المللي، فالعيّنةُ قد تقع خارجها والمِرقَبُ يشهد بما وقع متى وقع. **وموضعُ ما
     عبر يُقاس مع ترتيبه**: النقطةُ تحلّ **في خانتها** لا في فراغٍ بجوارها. */
  const brOrder = [];
  let brLanded = null;
  const brWatch = new MutationObserver(() => {
    const f = bridge.querySelector('.q-meet .figure[data-display="ten-frame"][data-filled]');
    if (f && Number(f.dataset.filled) >= brGap && !brOrder.includes('عبور')) {
      brOrder.push('عبور');
      const cells = [...f.querySelectorAll('[data-cell]')].slice(Number(f.dataset.drawn));
      const flies = [...bridge.querySelectorAll('.q-fly')];
      const home = (fly, cell) => {
        const a = fly.getBoundingClientRect();
        const b = cell.getBoundingClientRect();
        const x = a.left + a.width / 2;
        const y = a.top + a.height / 2;
        return x > b.left - 4 && x < b.right + 4 && y > b.top - 4 && y < b.bottom + 4;
      };
      brLanded = flies.length === cells.length && cells.every((c, i) => home(flies[i], c));
    }
    if (bridge.querySelector('.figure[data-display="two-frames"]') && !brOrder.includes('إطاران')) {
      brOrder.push('إطاران');
    }
  });
  brWatch.observe(bridge.documentElement, { subtree: true, childList: true, attributes: true });

  answerOf(bridge)?.click();
  const brTotal = await until(bridge,
    (d) => d.querySelector('.q-fact-body .figure[data-display="two-frames"]'), 16000);
  brWatch.disconnect();
  ok(brOrder[0] === 'عبور' && brOrder.includes('إطاران'),
    `و**العبورُ يُرى**: ${brGap} نقطةً تعبر فيمتلئ إطارُ العشرة **قبل** أن يصير المشهدُ `
    + `إطارين (ما وقع: ${brOrder.join(' ← ') || 'لا شيء'})`);
  ok(brLanded === true,
    'و**النقطةُ العابرة تحلّ في خانتها** لا في فراغٍ بجوارها — مقيساً بالرسم بعد التنسيق'
    + (brLanded === null ? ' — **لم يُرصَد عبورٌ أصلاً**' : ''));
  ok(brTotal && Number(bridge.querySelector('.q-solve--bridge').dataset.answer)
    === Number(brTotal.dataset.drawn)
    && brTotal.querySelectorAll('[data-part="a"]').length === 10,
  `ثم **تصير الحصيلةُ حزمةً وآحاداً في الإطارين** (${brTotal ? brTotal.dataset.drawn : '؟'}) `
    + '— والسؤالُ الثاني جوابُه ما رُسِم فيهما');
  ok(brDrawn(bridge.querySelector('.q-sentence')),
    '**وتتصدّر جملةُ الجمع سؤالَها هي**: تظهر مع «كَمْ صَارَتْ مَعًا؟» الذي خانتُها جوابُه');

  /* **وفي «وحدك» لا يسبق العونُ الجواب**: تُساق المحطةُ حتى تبدأ الخطوةُ المقيسة —
     والخطوةُ تُقرأ من شريطها (`step--now`) لا من الشاشة التي نقيسها. */
  const brPhase = (d) => [...d.querySelectorAll('.step')]
    .findIndex((s) => s.classList.contains('step--now'));
  for (let i = 0; i < 50 && brPhase(bridge) < 2; i++) {
    (answerOf(bridge) || bridge.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 480));
  }
  const soloFigs = [...bridge.querySelectorAll('.q-meet .figure')];
  const soloPeek = bridge.querySelector('.q-peek');
  ok(brPhase(bridge) === 2 && soloFigs.length === 2
    && soloFigs[1].dataset.split === undefined && brDrawn(soloPeek),
  'وفي «وحدك» **الشقُّ الملوّن لا يسبق الجواب**: حزمةُ المُضاف بلا شقّ، والعونُ زرٌّ يُنقَر');
  /* **وزرُّ العون يُقاس حيث نحن واقفون** (جردُ الصنف ومسطرةُ اللمس): مشيُ الجرد يقف
     على «جرِّب معي» فلا يبلغ هذا الزرَّ أصلاً — وهو زرُّ شاشة طفل، فيه ما يُرى
     (أيقونةُ العين) ويبلغ عتبةَ اللمس المعلَنة. */
  const peekBox = soloPeek ? soloPeek.getBoundingClientRect() : { width: 0, height: 0 };
  ok(!!soloPeek?.querySelector('.ui-icon svg')
    && Math.min(peekBox.width, peekBox.height) >= TOUCH_MIN - 0.5,
  `وزرُّ العون فيه ما يُرى (أيقونة) ويبلغ عتبةَ اللمس `
    + `(${Math.round(peekBox.width)}×${Math.round(peekBox.height)} من ${TOUCH_MIN}بك)`);
  const soloGap = soloFigs.length === 2
    ? soloFigs[0].querySelectorAll('[data-cell]').length - Number(soloFigs[0].dataset.drawn) : -1;
  soloPeek?.click();
  const soloLit = await until(bridge,
    (d) => [...d.querySelectorAll('.q-meet .figure')][1]?.dataset.split, 4000);
  ok(Number(soloLit) === soloGap && soloGap > 0,
    `وبالنقر يُكشَف الشقُّ فيُرى ما يُكمِل العشرة (${soloLit ?? '؟'} من ${soloGap}) — `
    + 'عونٌ بلا حدٍّ ولا احتساب، والخاناتُ الفارغة تبقى هي السؤال');

  const brDone = await play(bridge, 130);   // جولتُها سؤالان وبينهما عبورٌ يُرى
  ok(!!brDone, 'ومحطةُ العبور تُجتاز كاملةً لمساً حتى الاحتفال');

  // ————— ج) «اِطْرَحْ ضِمْنَ ٢٠» (٧·٦): يفرغ من حيث امتلأ، وينزل عبر العشرة —————
  const down = await open('#/sub/twenty');
  (await onward(down))?.click();
  await until(down, (d) => d.querySelector('.q-solve--sub .q-fact-fig .figure'), 16000);
  const downFig = down.querySelector('.q-solve--sub .q-fact-fig .figure');
  const goneMarks = downFig ? [...downFig.querySelectorAll('[data-part="b"]')] : [];
  const downRight = answerOf(down);
  cardsOf(down).find((c) => c !== downRight)?.click();
  const firstLit = await until(down,
    (d) => d.querySelector('.q-solve--sub [data-mark].is-counted'), 16000);
  ok(goneMarks.length > 0 && firstLit === goneMarks[goneMarks.length - 1],
    'و**الطرحُ يفرغ من حيث امتلأ**: أوّلُ ما يغادر آخرُ ما مُلئ '
    + `(${goneMarks.length} مغادراً، والمُضاء أوّلاً هو ${firstLit === goneMarks[goneMarks.length - 1]
      ? 'الأخير' : 'ليس الأخير'})`);

  /* **ومهلةُ السَّوق هنا أوسع**: العدُّ النازل من فوق العشرين يمشي على عشرين عنصراً
     ومعه وقفةُ العشرة — ثوانٍ بحسابها لا تعلّقاً، والسائقُ محبوسٌ فيها. */
  const seenWholes = [];
  for (let i = 0; i < 130 && !down.querySelector('.celebrate'); i++) {
    const fig = down.querySelector('.q-solve--sub .q-fact-fig .figure');
    if (fig) seenWholes.push(Number(fig.dataset.drawn));
    (answerOf(down) || down.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 480));
  }
  ok(!!down.querySelector('.celebrate') && Math.max(...seenWholes, 0) > 10,
    `و«اِطْرَحْ ضِمْنَ ٢٠» تُجتاز لمساً، **وتطرح فوق العشرة فعلاً** `
    + `(أكبرُ كلٍّ رأته: ${Math.max(...seenWholes, 0)})`);

  /* ————— ١١ز) التكثيفُ المستهدف: المزدوجات والعدُّ القفزيّ (الجلسة ك) —————

     ثلاثةُ عهودٍ تُقاس على الشاشة الحيّة، ولا يراها فحصُ نصّ:
       أ) **المزدوجُ كمّيتان متطابقتان مرآةً** — تطابقاً في **المرسوم** لا في النيّة،
          وجوابُه مجموعُ ما رُسِم فيهما، وجملتُه رقمٌ واحدٌ مرّتين وبينهما «+».
       ب) **العدُّ القفزيُّ قفزاتٌ مُضاءة على الخطّ** — تباعدُها واحد، والجوابُ ما بعد
          آخرها بقفزةٍ مقروءاً من الخطّ نفسِه.
       ج) **النمطُ العدديُّ شريطُ أرقامٍ مشرقية** بزيادةٍ ثابتة، وجوابُه من الشريط. */

  // ————— أ) «المُزْدَوَجَات»: مرآةٌ تُرى، والجوابُ مجموعُ ما رُسِم —————
  const dbl = await open('#/double/ten');
  (await onward(dbl))?.click();
  const dblBoard = await until(dbl, (d) => d.querySelector('.q-solve--double'), 16000);
  const halves = dblBoard ? [...dblBoard.querySelectorAll('.q-fact-part .figure')] : [];
  const drawnHalves = halves.map((f) => Number(f.dataset.drawn));
  ok(halves.length === 2 && drawnHalves[0] === drawnHalves[1] && drawnHalves[0] >= 2
    && halves[0].dataset.display === halves[1].dataset.display,
  `محطةُ «المُزْدَوَجَات» تعرض **كمّيتين متطابقتين** (${drawnHalves.join(' و')} `
    + `في «${halves[0]?.dataset.display}») — تطابقاً في المرسوم لا في النيّة`);
  ok(!!dblBoard?.querySelector('.q-mirror'),
    'وبينهما **خطُّ المرآة** — فيُرى التطابقُ ولا يُقال (والإطارُ لا يُقلَب فيتبدّل ملؤه)');
  ok(Number(dblBoard?.dataset.answer) === drawnHalves[0] + drawnHalves[1],
    `و**الجوابُ مجموعُ ما رُسِم فيهما** (${dblBoard?.dataset.answer} من `
    + `${drawnHalves.join(' + ')}) لا العددُ الذي طُلب`);
  const dblTerms = dblBoard
    ? [...dblBoard.querySelectorAll('.q-sentence .q-term .figure')].map((f) => f.dataset.drawn)
    : [];
  const dblSign = shownIn(dblBoard?.querySelector('.q-sentence .q-sign')).trim();
  ok(dblTerms.length === 2 && dblTerms[0] === dblTerms[1] && dblSign === '+',
    `وجملتُها **رقمٌ واحدٌ مرّتين** بعلامة جبهتها (${dblTerms.join(` ${dblSign} `)})`);
  const dblDone = await play(dbl, 90);
  ok(!!dblDone, 'ومحطةُ المزدوجات تُجتاز كاملةً لمساً حتى الاحتفال');

  // ————— ب) «اِعْدُدْ قَفْزًا»: قفزاتٌ مُضاءةٌ على الخطّ، والتالي منها —————
  const jmp = await open('#/skip/twenty');
  (await onward(jmp))?.click();
  const jmpBoard = await until(jmp, (d) => d.querySelector('.q-solve--skip'), 20000);
  const litTicks = jmpBoard
    ? [...jmpBoard.querySelectorAll('[data-tick].is-open')].map((t) => Number(t.dataset.value))
    : [];
  const gaps = litTicks.slice(1).map((v, i) => v - litTicks[i]);
  const jmpStep = Number(jmpBoard?.dataset.step);
  ok(litTicks.length >= 2 && new Set(gaps).size === 1 && gaps[0] === jmpStep
    && litTicks[0] === 0,
  `ومحطةُ «اِعْدُدْ قَفْزًا» تُضيء مواقعَ القفزة من الصفر بتباعدٍ واحد `
    + `(${litTicks.join(' · ')} — قفزةُ ${jmpStep})`);
  ok(Number(jmpBoard?.dataset.answer) === litTicks[litTicks.length - 1] + jmpStep,
    `و**الجوابُ ما بعد آخرها بقفزةٍ مقروءاً من الخطّ** (${jmpBoard?.dataset.answer})`);
  const jmpSlots = [...jmp.querySelectorAll('.fig-slot')].map((s) => Number(s.dataset.value));
  ok(jmpSlots.length >= 2 && jmpSlots.includes(Number(jmpBoard?.dataset.answer))
    && jmpSlots.every((v) => Math.abs(v - Number(jmpBoard?.dataset.answer)) <= jmpSlots.length),
  `وخياراتُها **مواضعُ متجاورة** على الخطّ لا الخطُّ كلُّه (${jmpSlots.join(' · ')})`);
  const jmpDone = await play(jmp, 90);
  ok(!!jmpDone, 'ومحطةُ العدّ القفزيّ تُجتاز كاملةً لمساً حتى الاحتفال');

  /* ————— ١١و) المرحلة ٨: الأنماطُ والقياسُ الوصفيّ ومحطةُ التعارف —————

     ثلاثةُ عهودٍ: **النمطُ إيقاعٌ يُرى وجوابُه من الشريط المرسوم**، و**القياسُ مقاديرُ
     تقف على خطٍّ واحد فيُقارَن الطولُ لا الموضع**، و**محطةُ التعارف عرضٌ بلا قياس**
     وهي **وحدَها** التي فيها رقمٌ مغربيّ في التطبيق كلِّه (ق١). */

  // ————— أ) «أَكْمِلِ النَّمَط»: الجوابُ ما يبعد دورةً كاملة —————
  const pdoc = await open('#/pattern/abab');
  (await onward(pdoc))?.click();
  const stripFig = await until(pdoc, (d) => d.querySelector('.q-solve--pattern .figure'), 16000);
  const cells = stripFig ? [...stripFig.querySelectorAll('[data-cell]')] : [];
  const items = cells.map((c) => c.dataset.item || null);
  const blankAt = items.indexOf(null);
  const period = 2;                          // (أ ب أ ب) — دورتُها اثنتان
  ok(cells.length === Number(stripFig?.dataset.drawn) && items.filter((x) => !x).length === 1
    && blankAt === cells.length - 1
    && stripFig.parentElement.parentElement.dataset.answer === items[blankAt - period],
  `شريطُ (أ ب أ ب) ${cells.length} خانةً وآخرُها سؤال، **وجوابُه ما يبعد دورةً كاملة** `
    + 'مقروءاً من الشريط المرسوم لا من نيّة المولّد');

  const patRight = answerOf(pdoc);
  const patCards = cardsOf(pdoc).map((c) => c.querySelector('img.emoji')?.dataset.emoji || '؟');
  ok(!!patRight,
    `وفي البطاقات ما رسم ذلك الرمز (يُقرأ من صورتها) — المطلوب «${pdoc
      .querySelector('.q-solve--pattern')?.dataset.answer}»، وفي ${patCards.length} بطاقة: `
    + patCards.join(' '));
  patRight?.click();
  const filled = await until(pdoc,
    (d) => d.querySelector('.q-solve--pattern [data-cell].is-full'), 12000);
  ok(!!filled, 'وبالإصابة **تتمّ خانةُ السؤال بما رُسِم على البطاقة** فيُرى النمطُ تامّاً');
  const patDone = await play(pdoc, 90);
  ok(!!patDone, 'ومحطةُ النمط تُجتاز كاملةً لمساً حتى الاحتفال');

  /* ————— أ٢) «النَّمَطُ العَدَدِيّ» (الجلسة ك): شريطُ أرقامٍ بزيادةٍ ثابتة —————

     **ولا رقمَ لاتينيّ في خانةٍ** (ق١): الشريطُ يكتب المشرقيةَ كبطاقة الرمز، ويُقرأ
     من الـDOM لا من نيّة المولّد. **وجوابُه ما بعد آخر خانةٍ بقفزتها** هي. */
  const ndoc8 = await open('#/pattern/num');
  (await onward(ndoc8))?.click();
  const numBoard = await until(ndoc8, (d) => d.querySelector('.q-solve--pattern'), 20000);
  const numCells = numBoard ? [...numBoard.querySelectorAll('[data-cell]')] : [];
  const numShown = numCells.map((c) => c.dataset.item || null);
  const eastern = (t) => /^[٠-٩]+$/.test(String(t));
  const numValues = numShown.filter(Boolean).map((t) => Number(
    String(t).replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))));
  const numGaps = numValues.slice(1).map((v, i) => v - numValues[i]);
  ok(numCells.length >= 3 && numShown.filter((x) => !x).length === 1
    && numShown.filter(Boolean).every(eastern) && new Set(numGaps).size === 1,
  `ومحطةُ «النَّمَطُ العَدَدِيّ» شريطُ أرقامٍ **مشرقيةٍ بزيادةٍ ثابتة** `
    + `(${numShown.map((t) => t || '؟').join(' · ')} — قفزةُ ${numGaps[0]})`);
  ok(Number(numBoard?.dataset.answer) === numValues[numValues.length - 1] + numGaps[0]
    && Number(numBoard?.dataset.step) === numGaps[0],
  `و**جوابُه من الشريط المرسوم**: ما بعد آخر خانةٍ بقفزتها (${numBoard?.dataset.answer})`);
  const numRight = answerOf(ndoc8);
  numRight?.click();
  const numFull = await until(ndoc8,
    (d) => d.querySelector('.q-solve--pattern [data-cell].is-full'), 12000);
  ok(!!numFull && eastern(shownIn(numFull).trim()),
    `وبالإصابة تتمّ الخانةُ **برقمٍ مشرقيّ رُسم على البطاقة** («${numFull
      ? shownIn(numFull).trim() : '؟'}»)`);
  const numDone = await play(ndoc8, 90);
  ok(!!numDone, 'ومحطةُ النمط العدديّ تُجتاز كاملةً لمساً حتى الاحتفال');

  // ————— ب) «أَطْوَلُ وَأَقْصَر»: مقاديرُ على خطٍّ واحد —————
  const mdoc8 = await open('#/measure/size');
  (await onward(mdoc8))?.click();
  const sceneFig = await until(mdoc8, (d) => d.querySelector('.q-solve--measure .figure'), 16000);
  const things = sceneFig ? [...sceneFig.querySelectorAll('[data-item]')] : [];
  const boxes = things.map(rectOf);
  const grounded = boxes.length > 1
    && boxes.every((b) => Math.abs(b.bottom - boxes[0].bottom) < 2);
  const sizes = things.map((t) => Number(t.dataset.size));
  ok(things.length >= 2 && new Set(sizes).size === sizes.length && grounded,
    `ومشهدُ القياس ${things.length} أشياءَ بمقاديرَ مختلفة (${sizes.join(' و')}) `
    + '**تقف على خطٍّ واحد** — فالفرقُ طولٌ يُرى لا موضعٌ يخدع');
  const wantSize = mdoc8.querySelector('.q-solve--measure').dataset.answer;
  const askText = bare(askOf(mdoc8));
  const extreme = askText.includes('أقصر') || askText.includes('أخف')
    ? Math.min(...sizes) : Math.max(...sizes);
  ok(Number(wantSize) === extreme,
    `و**المطلوبُ من المقدار المرسوم**: «${askOf(mdoc8)}» ⇒ ${wantSize} `
    + `(والمنتظَر ${extreme})`);

  /* ————— ب٢) مشاهدُ الأشياء الحقيقية: **الحكمُ في الشيء لا في الحجم** (٨ب) —————

     **وجدولُ الحقيقة مكتوبٌ هنا بيدٍ عمداً**: هذا الحارسُ عينٌ ثانيةٌ مستقلّة عن
     بيانات المنهج — لو انقلبت رتبةٌ في `curriculum.js` (فصار البالونُ أثقلَ من
     السيارة) لَمرّت على `check_range` (بنيتُها سليمة) ورآها الطفل. فتُكتب الحقيقةُ
     هنا **من عالم الطفل لا من ملفّنا**: كلُّ صفٍّ من الأخفّ إلى الأثقل، أو من الأول
     إلى الآخر. **ومشهدٌ لا صفَّ له هنا يُحمِر باسمه** — محتوىً يراه طفلٌ بوابتُه عين. */
  const SCENE_TRUTH = [
    ['🎈', '🚗'],            // بالونٌ أخفُّ من سيارة — الزوجُ الفاصلُ بين الثِّقَل والحجم
    ['🪶', '🐘'],            // ريشةٌ أخفُّ من فيل
    ['🍓', '🍉'],            // فراولةٌ أخفُّ من بطيخة
    ['🥚', '🐣', '🐔'],      // بيضةٌ قبل كتكوتٍ قبل دجاجة
    ['🌅', '☀️', '🌙'],      // شروقٌ قبل نهارٍ قبل ليل
    ['🌰', '🌱', '🌳'],      // بذرةٌ قبل برعمٍ قبل شجرة
  ];
  const plain = (g) => (g || '').replace(/️/g, '');
  const truthRow = (glyphs) => SCENE_TRUTH.find((row) => row.length === glyphs.length
    && row.map(plain).slice().sort().join('') === glyphs.map(plain).slice().sort().join(''));

  /* يسوق المحطةَ إلى أول جولةٍ مشهدُها أشياءُ مختلفة (بلا `data-size`)، ويقيسها.
     **والجردُ من داخل الشكل وحدَه** (`.figure`): أزرارُ اللمس تسكن فوقه في صندوقه
     وتحمل ما يحمله (`data-item`) — فجردٌ على الصندوق يعدّ كلَّ شيءٍ مرّتين. */
  const realScene = async (d, steps = 24) => {
    for (let i = 0; i < steps && !d.querySelector('.celebrate'); i++) {
      const things = [...d.querySelectorAll('.q-solve--measure .figure [data-item]')];
      if (things.length && things.every((t) => !t.dataset.size)) return things;
      (answerOf(d) || d.querySelector('.station-body .next'))?.click();
      await new Promise((r) => setTimeout(r, 480));
    }
    return null;
  };

  const heavy = await realScene(mdoc8);
  const heavyGlyphs = (heavy || []).map((t) => t.dataset.item);
  const heavyBoxes = (heavy || []).map(rectOf);
  const sameSize = heavyBoxes.length > 1
    && heavyBoxes.every((b) => Math.abs(b.width - heavyBoxes[0].width) < 2)
    && heavyBoxes.every((b) => Math.abs(b.bottom - heavyBoxes[0].bottom) < 2);
  ok(heavyGlyphs.length >= 2 && new Set(heavyGlyphs).size === heavyGlyphs.length && sameSize,
    `ومشهدُ الثِّقَل **أشياءُ مختلفة بمقدارٍ واحد** (${heavyGlyphs.join(' و')}) `
    + 'واقفةٌ على خطٍّ واحد — **فلا حكمَ في الحجم**');
  const heavyRow = truthRow(heavyGlyphs);
  const heavyAsk = bare(askOf(mdoc8));
  const heavyWant = mdoc8.querySelector('.q-solve--measure')?.dataset.answer;
  ok(!!heavyRow && plain(heavyWant) === plain(heavyAsk.includes('أخف')
    ? heavyRow[0] : heavyRow[heavyRow.length - 1]),
  `و**المطلوبُ رتبةُ الشيء المرسوم لا حجمُه**: «${askOf(mdoc8)}» ⇒ ${heavyWant} `
    + (heavyRow ? `(وحقيقةُ عالم الطفل: ${heavyRow.join(' ← ')})`
      : '— **ومشهدٌ لا صفَّ له في جدول الحقيقة**'));
  const meaDone = await play(mdoc8, 90);
  ok(!!meaDone, 'ومحطةُ «أطولُ وأقصر · أثقلُ وأخفّ» تُجتاز كاملةً لمساً حتى الاحتفال');

  /* ————— ب٣) «قَبْلُ وَبَعْد» (٨·٤): تسلسلُ مشهدٍ يُرتَّب من الأول إلى الآخر —————
     **وتُساق بتبديل العنوان في المستند نفسِه** لا بفتح مستندٍ جديد: `open()` يغادر
     ما قبله، **وسجلُّ ليتنر لا يعبر من مستندٍ إلى مستند** في وضع المعاينة — فبوابةُ
     الختام ولوحةُ وليّ الأمر بعدها تُسَاقان من الذي لعب. (وهي القاعدةُ نفسُها التي
     تسوق بها البوابةُ أدناه — وقد أمسك الحارسُ خرقَها حين فُتح مستندٌ جديد هنا.) */
  const seqdoc = mdoc8;
  seqdoc.defaultView.location.hash = '#/measure/time';
  await new Promise((r) => setTimeout(r, 1300));
  (await onward(seqdoc))?.click();
  const steps8 = await realScene(seqdoc);
  const stepGlyphs = (steps8 || []).map((t) => t.dataset.item);
  const timeRow = truthRow(stepGlyphs);
  ok(stepGlyphs.length === 3 && !!timeRow,
    `ومشهدُ «قَبْلُ وَبَعْد» ثلاثةُ مشاهدَ من يوم الطفل أو نموِّه (${stepGlyphs.join(' ')})`
    + (timeRow ? '' : ' — **لا صفَّ له في جدول الحقيقة**'));
  const timeWant = seqdoc.querySelector('.q-solve--measure')?.dataset.answer;
  ok(!!timeRow && plain(timeWant) === plain(timeRow[0]),
    `و**أوّلُ ما يُلمَس أوّلُ التسلسل**: المطلوب ${timeWant} `
    + (timeRow ? `(والأول ${timeRow[0]})` : ''));
  const timeDone = await play(seqdoc, 90);
  ok(!!timeDone, 'ومحطةُ «قَبْلُ وَبَعْد» تُجتاز كاملةً لمساً حتى الاحتفال');

  /* ————— ١١ز) 🚪 بوابة ٣ «ختامُ التأسيس»: من أضعف الرحلة كلِّها —————
     **وتُساق من داخل مستند القياس نفسِه** كأختيها: وضعُ المعاينة لا يكتب على القرص،
     فسجلُّ ليتنر لا يعبر من مستندٍ إلى مستند — ويُساق من الذي لعب محطةً كاملة.

     **وبقاءُ المستند نفسِه شرطٌ يُقاس لا يُفترَض**: مستندٌ أُعيد تحميلُه في أثناء
     السَّوقة يمحو السجلَّ (وضعُ المعاينة في الذاكرة لا على القرص)، فتُقاس البوابةُ
     ولوحةُ الوالد على سجلٍّ فارغ. وكان ذلك يقع **عطباً بلا اسم** (`defaultView` صار
     `null`) — فصار سطراً أحمرَ يسمّي نفسَه. */
  const gdoc8 = frame.contentDocument;
  ok(gdoc8 === mdoc8 && !!mdoc8.defaultView,
    'ومستندُ محطتَي القياس هو نفسُه بعدهما — فسجلُّ ليتنر الذي بُني فيهما باقٍ للبوابة');
  gdoc8.defaultView.location.hash = '#/gate/final';
  await new Promise((r) => setTimeout(r, 1300));
  const finalDots = gdoc8.querySelectorAll('.dots .dot').length;
  ok(!!gdoc8.querySelector('.gate-head') && finalDots > 0 && finalDots <= 10,
    `بوابةُ «خِتَامُ التَّأْسِيس» تُرسَم بجلسةٍ من سجلّ ما لعبه الطفل (${finalDots} تمريناً)`);
  for (let i = 0; i < 60 && !gdoc8.querySelector('.celebrate'); i++) {
    (answerOf(gdoc8) || gdoc8.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 460));
  }
  const finalVerdict = gdoc8.querySelector('.celebrate');
  ok(!!finalVerdict && !/رسوب|فشل|خطأ/.test(shownIn(finalVerdict)),
    `وتُجتاز إلى حكمها بلا لفظ رسوب (${finalVerdict
      && !finalVerdict.classList.contains('celebrate--again') ? 'فُتِحَت' : 'لَيْسَ بَعْدُ'})`);

  /* ————— ١١ح) لوحةُ وليّ الأمر **بسجلٍّ حيّ**: مفهومٌ بعملية لا درجة (الجلسة ٨) —————

     الفحصُ الأول (§٨ أعلاه) رآها **فارغة** — سجلٌّ نظيف فلا مفهومَ يُترجَم. وهنا
     تُفتَح من **المستند الذي لعب** محطاتٍ وبوابة، فتُقرأ أقسامُها السبعة وعباراتُها
     كما يقرؤها الوالد: جملٌ فعلية («يقدّر حتى ٥ فوراً») لا نسبٌ ولا نجوم.
     (والحسابُ نفسُه — العبارةُ من ليتنر والمدى محسوب — يقيسه `test_parent.mjs`
     بسجلٍّ مصنوع؛ وهذا يثبت أنّ ما حُسب **وصل إلى الشاشة**.) */

  gdoc8.defaultView.location.hash = '#/parent';
  await new Promise((r) => setTimeout(r, 600));
  const [pa, pb] = (gdoc8.querySelector('.gate .giant')?.textContent || '').split('×');
  const parentInput = gdoc8.querySelector('.gate input');
  if (parentInput) {
    parentInput.value = String(arDigits(pa) * arDigits(pb));
    gdoc8.querySelector('.gate-go')?.click();
    await new Promise((r) => setTimeout(r, 500));
  }
  // **وعددُ الأقسام محسوبٌ من المنهج لا مكتوبٌ هنا** (الجلسة ش: صارت ثمانية بالأشكال)
  const conceptSections = (await import('/js/curriculum.js')).CONCEPT_SECTIONS;
  const groups = [...gdoc8.querySelectorAll('.concept-group h4')].map((el) => el.textContent);
  const conceptLines = [...gdoc8.querySelectorAll('.concept')]
    .map((el) => el.querySelector('.concept-line')?.textContent?.trim() || '');
  ok(groups.length === conceptSections.length && conceptLines.length > 0,
    `ولوحةُ وليّ الأمر تعرض أقسامَ الحساب كلَّها (${groups.join(' · ')}) `
    + `و${conceptLines.length} مفهوماً مقيساً ممّا لعبه في هذا الجهاز`);
  const notPhrases = conceptLines.filter((t) => !/^ي/.test(t) || /[|0-9٪]/.test(t));
  ok(conceptLines.length > 0 && notPhrases.length === 0,
    `وكلُّها **جملةٌ فعلية لا درجة** (${conceptLines.slice(0, 2).join(' · ')})`
    + (notPhrases.length ? ` — مخالفة: ${notPhrases.join('، ')}` : ''));

  // ————— ج) «تَعَارُفٌ: أَرْقَامٌ أُخْرَى» (٨·٥): عرضٌ بلا قياس، ورقمٌ مغربيّ فيها وحدَها —————
  const idoc = await open('#/intro/latin');
  const rows = [...idoc.querySelectorAll('.intro-row')];
  const west = rows.map((r) => shownIn(r.querySelector('.intro-west')).trim());
  ok(rows.length >= 10 && west.every((t) => /^[0-9]+$/.test(t)),
    `محطةُ التعارف تعرض ${rows.length} صفّاً: مشرقيُّنا ورسمُه الآخر (${west.join('')})`);
  const introLatin = [...new Set((shownIn(idoc.querySelector('main.screen-card')).match(/\d/g) || []))];
  ok(introLatin.length > 0,
    `و**هي وحدَها** التي فيها رقمٌ مغربيّ في التطبيق كلِّه (${introLatin.length} رقماً) — `
    + 'استثناءٌ مكتوبٌ في المنهج (ق١)، وسائرُ الشاشات صفرُ رقمٍ لاتينيّ');
  idoc.querySelector('.station-body .next')?.click();
  await new Promise((r) => setTimeout(r, 700));
  ok(idoc.querySelectorAll('.big-stars .on').length === 3,
    'وتُختَم **بنجومٍ كاملة بلا محاولةٍ واحدة** — إتمامُها مشاهدةٌ لا إتقان');

  /* ————— ١١ح) الخريطةُ تعرض الرحلةَ كلَّها — والعددُ يُقابَل بالمنهج لا يُكتب بيد —————
     `test_journey.mjs` يطبع عددَ العقد من ثلاثة مصادر في node، وهذا يقابله **بما
     رُسِم على الخريطة فعلاً**: تُفرَد أقسامُها كلُّها وتُعَدّ عقدُها. */
  const mapDoc = await open('#/');
  const wanted = await (async () => {
    const m = await import('/js/curriculum.js');
    return m.sections().reduce((n, s) => n + (s.nodes || []).length, 0);
  })();
  for (const head of [...mapDoc.querySelectorAll('.station-head--fold')]) {
    if (head.getAttribute('aria-expanded') !== 'true') head.click();
  }
  await new Promise((r) => setTimeout(r, 900));
  const drawnNodes = mapDoc.querySelectorAll('.node').length;
  ok(drawnNodes === wanted,
    `والخريطةُ ترسم الرحلةَ كلَّها: **${drawnNodes} عقدة** في `
    + `${mapDoc.querySelectorAll('.station').length} قسماً — وهو ما يحسبه المنهج (${wanted})`);

  /* ————— ١١ط) ميداليةُ الختام تحمل معلمَ مرحلتها — **في كل مرحلةٍ من الثماني** —————

     قيدُ الجلسة هـ (حكمُ المدير — `REVIEW_IDENTITY.md §٤`): «الميداليةُ تحمل معلمَ
     المرحلة بياناً لا يداً». و`test_journey` يثبت **الوصلة** في node (كلُّ محطةٍ تردّ
     معلمَ مرحلتها)، وهذا يثبت **الرسم**: يُفتَح ختامُ محطةٍ من كل مرحلةٍ فيُقابَل ما
     رُسِم في القرص بمعلم تلك المرحلة نفسِه (مقروءاً من `landmark` في `ui.js`).

     **ويُقاس اللونُ أيضاً**: المعلمُ كان مرسوماً بلون المرحلة، وقرصُ الميدالية بلونها
     نفسِه — فيختفي عليه. فيُقابَل حبرُ الرسم بخلفية القرص: لونان مختلفان أو لا معلم
     يُرى. ويُساق الختامُ بزرّ «إنهاء المحطة الآن» (`?dev=1`) لا بلعب ثمانِ محطاتٍ كاملة. */

  const stageMarks = await (async () => {
    const c = await import('/js/curriculum.js');
    const u = await import('/js/ui.js');
    return c.sections().filter((s) => s.kind !== 'gate').map((s) => ({
      title: s.title,
      mark: s.mark,
      node: (s.nodes || [])[0],
      // رسمُ المعلم كما يعرفه التطبيق نفسُه — لا نسخةٌ في صفحة الفحص
      svg: u.landmark(s.mark)?.querySelector('svg')?.innerHTML.replace(/\s+/g, ' ').trim() || '',
    }));
  })();

  const medals = [];
  for (const stage of stageMarks) {
    if (!stage.node) continue;
    const sdoc8 = await open(`#/${stage.node.type}/${encodeURIComponent(stage.node.part)}`, '&dev=1');
    const endBtn = [...sdoc8.querySelectorAll('.dev-row .btn')]
      .find((b) => b.textContent.includes('إنهاء المحطة'))
      || (await until(sdoc8, (d) => d.querySelector('.station-body .next')));
    endBtn?.click();
    const disc = await until(sdoc8, (d) => d.querySelector('.celebrate-face'), 12000);
    const shown = disc?.querySelector('.station-mark svg');
    const win8 = sdoc8.defaultView;
    medals.push({
      title: stage.title,
      mark: stage.mark,
      same: !!shown && shown.innerHTML.replace(/\s+/g, ' ').trim() === stage.svg,
      seen: !!shown && win8.getComputedStyle(shown).stroke
        !== win8.getComputedStyle(disc).backgroundColor,
      neutral: !!disc?.querySelector('.ui-icon'),
    });
  }

  const blindMedals = medals.filter((m) => !m.same || !m.seen || m.neutral);
  ok(medals.length === stageMarks.length && blindMedals.length === 0,
    `وميداليةُ الختام تحمل معلمَ مرحلتها في المراحل الثماني كلِّها `
    + `(${medals.map((m) => m.mark).join(' · ')}) — حبراً يفارق لونَ القرص فيُرى`
    + (blindMedals.length
      ? ` — مخالفة: ${blindMedals.map((m) => `${m.title}${m.neutral ? ' (أيقونةُ واجهة)'
        : m.same ? ' (لا يُرى على القرص)' : ' (معلمٌ آخر)'}`).join('، ')}` : ''));

  /* ————— ١١ك) المرحلة ٩: الشكلُ يُرسَم، وأضلاعُه تُعَدّ بالإصبع (الجلسة ش) —————

     ثلاثةُ عهودٍ لا يُثبتها إلا متصفّح:

     ١) **عددُ الأضلاع المرسومة هو المُدرَّس** — ويُقابَل بـ**جدول حقيقةٍ مكتوبٍ هنا
        بيدٍ عمداً** لا يُقرأ من المنهج (سنّةُ `SCENE_TRUTH` في الجلسة ٨ب): فلو
        انقلب رقمٌ في `SHAPES` وتبعه الرسمُ لَاتّفق المصيِّرُ وحارسُه على الغلط
        ومرّا خضراوين — ولا يمسكه إلا جدولٌ من خارجهما. **والمقيسُ ما في الـDOM**:
        `data-sides` وعددُ القِطَع المرسومة وطولُها بالبكسل بعد التنسيق.
     ٢) **التناظرُ الفرديّ في عدّ الأضلاع**: لمستان على ضلعٍ واحد لا تُحتسبان مرّتين
        — امتناعٌ في البنية (`disabled`) لا تحقّقٌ بعده.
     ٣) **الخطأُ يُعَدّ أمامه ولا ينقل**: بطاقةٌ خاطئة تُبقي الجولةَ، ويُضاء الشكلُ
        المطلوب وتُعَدّ أضلاعُه — فيرى الصوابَ عدّاً لا تلقيناً. */

  /** جدولُ حقيقةٍ من خارج المنهج: كم ضلعاً لكلِّ شكلٍ في عالم الناس. */
  const SHAPE_TRUTH = { circle: 0, triangle: 3, square: 4, rect: 4 };
  const lenOf = (el) => {
    const r = el.getBoundingClientRect();
    return Math.hypot(r.width, r.height);
  };

  const shdoc = await open('#/render/shape', '&dev=1');
  await until(shdoc, (d) => d.querySelector('[data-shape]'), 12000);
  const drawnShapes = [...shdoc.querySelectorAll('[data-shape]')];
  const wrongSides = drawnShapes.filter((g) => {
    const truth = SHAPE_TRUTH[g.dataset.shape];
    const pieces = g.querySelectorAll('[data-side]').length;
    return truth === undefined || pieces !== truth || Number(g.dataset.sides) !== truth;
  });
  ok(drawnShapes.length > 0 && wrongSides.length === 0,
    `لوحُ الأشكال يرسم ${drawnShapes.length} شكلاً، **وأضلاعُ كلٍّ مرسومةٌ بعددها الحقّ** `
    + `(${Object.entries(SHAPE_TRUTH).map(([k, n]) => `${k}: ${n}`).join(' · ')} — `
    + 'جدولٌ مكتوبٌ في الحارس لا يُقرأ من المنهج)'
    + (wrongSides.length ? ` — **خالف: ${wrongSides.map((g) => `${g.dataset.shape} (${g.dataset.sides})`).slice(0, 4).join('، ')}**` : ''));

  const squares = drawnShapes.filter((g) => g.dataset.shape === 'square');
  const rects = drawnShapes.filter((g) => g.dataset.shape === 'rect');
  const evenSided = squares.every((g) => {
    const lens = [...g.querySelectorAll('[data-side]')].map(lenOf);
    return Math.max(...lens) - Math.min(...lens) <= 2;
  });
  const unevenSided = rects.every((g) => {
    const lens = [...g.querySelectorAll('[data-side]')].map(lenOf);
    return Math.max(...lens) - Math.min(...lens) > 2;
  });
  ok(squares.length > 0 && rects.length > 0 && evenSided && unevenSided,
    `**والمربّعُ أضلاعُه سواءٌ بالبكسل والمستطيلُ ليست** (${squares.length} مربّعاً `
    + `و${rects.length} مستطيلاً مقيسةً بعد التنسيق) — وهي المواجهةُ المقصودة في ٩·٢`);

  // ————— أ) «كَمْ ضِلْعًا؟» — لمسةٌ لكلّ ضلعٍ لا تُحتسَب مرّتين —————
  const shdoc1 = await open('#/shape/sides', '&dev=1');
  await until(shdoc1, (d) => d.querySelector('.station-body .next'), 22000);
  shdoc1.querySelector('.station-body .next')?.click();
  const sidesBoard = await until(shdoc1, (d) => d.querySelector('.q-solve--sides'), 12000);
  const sideTaps = [...shdoc1.querySelectorAll('.q-solve--sides .fig-tap')];
  const boardShape = shdoc1.querySelector('.q-solve--sides [data-shape]');
  ok(!!sidesBoard && sideTaps.length === SHAPE_TRUTH[boardShape?.dataset.shape],
    `لوحُ «كَمْ ضِلْعًا؟» يرسم «${boardShape?.dataset.shape}» وفوق كلِّ ضلعٍ زرُّ لمسه `
    + `(${sideTaps.length} ضلعاً)`);
  ok(Number(sidesBoard?.dataset.answer) === SHAPE_TRUTH[boardShape?.dataset.shape],
    `**وجوابُه من المرسوم**: أعلن ${sidesBoard?.dataset.answer} وأضلاعُه المرسومة `
    + `${SHAPE_TRUTH[boardShape?.dataset.shape]}`);

  sideTaps[0]?.click();
  await new Promise((r) => setTimeout(r, 320));
  sideTaps[0]?.click();
  await new Promise((r) => setTimeout(r, 320));
  const litOnce = shdoc1.querySelectorAll('.q-solve--sides [data-side].is-counted').length;
  ok(sideTaps[0]?.disabled === true && litOnce === 1,
    `**ولمستان على ضلعٍ واحد لا تُحتسبان مرّتين** — الزرُّ يُعطَّل بعد لمسته `
    + `(${litOnce} ضلعاً معلَّماً بعد لمستين)`);

  for (const tap of sideTaps.slice(1)) {
    tap.click();
    await new Promise((r) => setTimeout(r, 320));
  }
  const sideCards = await until(shdoc1, (d) => d.querySelectorAll('.q-choices .qcard').length, 12000);
  const sidesRight = [...shdoc1.querySelectorAll('.q-choices .qcard')]
    .find((c) => drawnOf(c) === Number(sidesBoard.dataset.answer));
  ok(sideCards > 0 && !!sidesRight,
    `وبعد عدّها كلِّها يُسأل سؤالُ العدديّة ببطاقات الرمز (${sideCards} بطاقات، `
    + `وفيها ${sidesBoard.dataset.answer})`);
  const sidesWrong = [...shdoc1.querySelectorAll('.q-choices .qcard')].find((c) => c !== sidesRight);
  const sidesBead = beadNow(shdoc1);
  sidesWrong?.click();
  await new Promise((r) => setTimeout(r, 700));
  ok(!!shdoc1.querySelector('.qcard.bad') && beadNow(shdoc1) === sidesBead,
    '**والخطأُ لا ينقل**: بطاقةٌ خاطئة تُهزّ وتبقى الجولةُ نفسُها');
  /* **والمقيسُ أثرُ العدّ لا بقايا لمس الطفل**: أضلاعُه مضاءةٌ أصلاً من عدّه هو،
     فانتظارُ ضلعٍ مضاءٍ يمرّ بلا عدٍّ وقع. **وعلامةُ المشي وسمُ الشكل نفسِه**
     (`.fig-shape.is-counted`) — لا يضعه إلا `showShape` عند التصحيح والنمذجة. */
  const sidesWalk = await until(shdoc1,
    (d) => d.querySelector('.q-solve--sides .fig-shape.is-counted'), 14000);
  ok(!!sidesWalk, 'وتُعَدّ أضلاعُه أمامه ضلعاً ضلعاً (يرى الصوابَ عدّاً لا تلقيناً)');

  // ————— ب) «أَيْنَ الشَّكْل؟» — الجوابُ بطاقةٌ مرسومة لا كلمة —————
  const shdoc2 = await open('#/shape/pair', '&dev=1');
  await until(shdoc2, (d) => d.querySelector('.station-body .next'), 22000);
  shdoc2.querySelector('.station-body .next')?.click();
  const nameBoard = await until(shdoc2, (d) => d.querySelector('.q-solve--shape'), 12000);
  const nameCards = [...shdoc2.querySelectorAll('.q-choices .qcard')];
  const wantShape = nameBoard?.dataset.answer;
  const goodCard = nameCards.find((c) => c.querySelector('[data-shape]')?.dataset.shape === wantShape);
  ok(nameCards.length >= 2 && nameCards.every((c) => c.querySelector('[data-shape]'))
    && !!goodCard,
  `و«${askOf(shdoc2)}» بطاقاتُها **أشكالٌ مرسومة** لا كلمات (${nameCards.length} بطاقات، `
    + `والمطلوبُ «${wantShape}» فيها)`);
  const beadName = beadNow(shdoc2);
  const sawBad = seenOnce(shdoc2, '.qcard.bad');
  const sawLit = seenOnce(shdoc2, `.qcard [data-shape="${wantShape}"].is-counted`);
  nameCards.find((c) => c !== goodCard)?.click();
  await new Promise((r) => setTimeout(r, 700));
  ok(sawBad.seen && beadNow(shdoc2) === beadName,
    'وبطاقةٌ خاطئة لا تنقل — والجولةُ تبقى حتى يصيب');
  /* والمِرقَبُ يشهد بالإضاءة متى وقعت، ويبقى `until` لجهازٍ بطيءٍ لم يبلغها بعد. */
  const litShape = sawLit.seen || await until(shdoc2,
    (d) => d.querySelector(`.qcard [data-shape="${wantShape}"].is-counted`), 14000);
  sawBad.stop();
  sawLit.stop();
  ok(!!litShape, '**ويُضاء الشكلُ المطلوب ويُسمّى** — فيربط الاسمَ برسمه بعد محاولته');

  // ————— ج) «الأَشْكَالُ حَوْلَنَا» — الشكلُ في شيءٍ مبنيٍّ من أشكالنا —————
  const shdoc3 = await open('#/shape/world', '&dev=1');
  await until(shdoc3, (d) => d.querySelector('.station-body .next'), 22000);
  shdoc3.querySelector('.station-body .next')?.click();
  const thingBoard = await until(shdoc3, (d) => d.querySelector('.q-solve--thing'), 12000);
  const thingSpots = [...shdoc3.querySelectorAll('.q-pickspot--shape')];
  // **والمرسومُ هو `.fig-shape`**: زرُّ اللمس يحمل `data-shape` الذي قرأه من جزئه،
  // فجردٌ بالسمة وحدَها يعدّ الجزءَ وزرَّه معاً — والمقيسُ ما رسمه المصيِّر.
  const thingParts = [...shdoc3.querySelectorAll('.q-solve--thing .fig-shape')];
  const askedShape = thingBoard?.dataset.answer;
  ok(thingParts.length >= 2 && thingSpots.length === thingParts.length
    && thingParts.some((p) => p.dataset.shape === askedShape),
  `وشيءُ العالم «${thingBoard?.dataset.thing}» مبنيٌّ من ${thingParts.length} أشكالٍ `
    + `(${thingParts.map((p) => p.dataset.shape).join('، ')})، وفيه المطلوبُ «${askedShape}» `
    + '— ولكلِّ جزءٍ زرُّ لمسه');
  const beadWorld = beadNow(shdoc3);
  const sawSpotBad = seenOnce(shdoc3, '.q-pickspot.bad');
  thingSpots.find((s) => s.dataset.shape !== askedShape)?.click();
  await new Promise((r) => setTimeout(r, 700));
  ok(sawSpotBad.seen && beadNow(shdoc3) === beadWorld,
    'وجزءٌ خاطئ لا ينقل — ويُضاء المطلوبُ وتُعَدّ أضلاعُه');
  sawSpotBad.stop();

  /* ————— ١١ي) **جردُ الصنف**: لا زرَّ إلزاميٍّ وسيلتُه الوحيدة نصّ (الجلسة م٥) —————

     **بلاغُ الميدان ٤** (`docs/FIELD.md §٤` — أوّلُ امتحان طفلٍ حقيقيّ): أتمّ المجموعةَ
     الأولى وحدَه ثم **وقف عند زرّ «هُمَا سَوَاء»** «فلم يعلم ما يصنع حتى شرحتُ له»،
     ثم «كلام أَضِفْ أَزِلْ غير مفهومة للطفل». وجمهورُنا (٤–٧) **قبل-قارئ**: لم يمرّ
     باقرأ بعد. **فالقاعدةُ تُرقّى**: النصُّ في شاشات الطفل **زينةٌ للوالد لا وسيلةُ
     تشغيل** — ولا فعلَ يلزم الطفلَ وسيلتُه الوحيدة قراءة.

     وهذا حارسُ **الصنف لا الموضع**: لا يعرف زرّاً بعينه، وإنما يجرد كلَّ زرٍّ ظاهرٍ
     على شاشات الطفل فيسأل: **أفيه ما يُرى** (أيقونةٌ أو معلمٌ أو كمّيةٌ مرسومة أو
     رمزُ عالم)؟ فمن لم يكن فيه إلا حروفٌ سقط — إلا أن يكون في قائمة الإعفاء **بسببٍ
     مكتوب**. فزرٌّ جديد يُكتب غداً بنصٍّ وحدَه يحمرّ من تلقائه.

     (والزرُّ الفارغ يمرّ: طبقةُ اللمس فوق كمّيةٍ مرسومة زرٌّ حقيقيّ بلا حرفٍ ولا صورة
      — لا نصَّ فيه أصلاً، فليس ممّا يُقرأ.) */

  const EXEMPT = [
    ['.dev', 'أدواتُ التجربة (`?dev=1`) — للبالغ المقيّم، ولا طريقَ إليها من شاشة طفل'],
    ['.preview-bar', 'شريطُ المعاينة — يخاطب المعلّم أو وليَّ الأمر لا الطفل'],
    ['.gate', 'بوابةُ لوحة وليّ الأمر الحسابية — بابٌ للبالغ بطبعه'],
    ['.install-bar', 'بابُ التثبيت — يخاطب وليَّ الأمر على جهازه'],
    ['.node, .continue, .station-head',
      'عقدُ الخريطة وبطاقةُ المتابعة ورأسُ المحطة: لغتُها **وجهٌ ولونٌ ونجومٌ وموضعٌ '
      + 'على الدرب** لا كلمات — الوجهُ رقمُ موضعها أو نجمةُ بوابتها (محرفٌ واحد لا '
      + 'يُقرأ نصّاً)، وبطاقةُ «تابع من هنا» تتصدّر الخريطةَ وعقدةُ الطفل التالية '
      + 'معلَّمة. فلا فعلَ هنا وسيلتُه قراءة. وما زاد على هذه الثلاثة يُقاس'],
  ];
  /** ما يُرى في الزرّ: أيقونةُ واجهةٍ أو معلمٌ أو كمّيةٌ مرسومة أو رمزُ عالمِ طفل. */
  const SEEN_IN = '.ui-icon svg, .station-mark svg, .figure, img.emoji';
  const bareButtons = (d) => [...d.querySelectorAll('button, a.btn, label.btn')]
    .filter((el) => el.offsetParent !== null)
    .filter((el) => (el.textContent || '').trim().length > 0)
    .filter((el) => !el.querySelector(SEEN_IN))
    .filter((el) => !EXEMPT.some(([sel]) => el.closest(sel)));
  const bareNames = (rows) => rows
    .map((el) => `«${(el.textContent || '').trim().slice(0, 24)}»`).join('، ');

  /* **وعلى المشي نفسِه يُقاس هدفُ اللمس** (معايرةُ الجلسة ١٠ — `METHOD.md §١١`):
     `--device` يجرد الشاشات كلَّها في المقاسات العشرة، لكنّه يراها **على خطوة
     «شاهِدْ»** — والنمذجةُ لا أزرارَ طفلٍ فيها إلا زرّاها. وهذا المشيُ يبلغ **نوبةَ
     الطفل** (بطاقاتُ الجواب · لمساتُ اللوح · ميداليةُ الختام)، فيُقاس فيه ما لا
     يبلغه ذاك. وأزرارُ الكبار تُستثنى **بأسبابها المكتوبة** (وهي أعيانُ إعفاءات
     جرد الصنف: أدواتُ التجربة · المعاينة · التثبيت · بوابةُ لوحة وليّ الأمر). */
  const ADULT = ['.dev', '.preview-bar', '.install-bar', '.gate'];
  const undersized = (d) => [...d.querySelectorAll('button, a.btn, label.btn')]
    .filter((el) => el.offsetParent !== null)
    .filter((el) => !ADULT.some((sel) => el.closest(sel)))
    .map((el) => ({ el, r: el.getBoundingClientRect(), need: needOf(el) }))
    .filter(({ r, need }) => r.width > 0 && r.height > 0
      && Math.min(r.width, r.height) < need - 0.5);
  const tightNames = (rows) => rows.map(({ el, r, need }) =>
    `${(el.className || 'button').split(' ')[0]} ${Math.round(r.width)}×${Math.round(r.height)}`
    + ` (عتبتُه ${need})`).join('، ');
  const undersizedRows = [];

  /* والمشهد: خريطةٌ ثم نمذجةٌ بزرَّيها، ثم الشاشتان اللتان وقف عندهما الطفلُ نفسُه
     («أيُّهما أكثر» بزرّ التساوي، و«اجعلهما سواء» التي كانت خمسةَ نصوص)، ثم ميدالية. */
  const textOnly = [];
  let seenScreens = 0;
  for (const [hash, what] of [
    ['', 'الخريطة'],
    ['#/subitize/two', '«كم ترى؟»'],
    ['#/more/five', '«أيُّهما أكثر؟» — وفيها زرُّ التساوي'],
    ['#/equal/five', '«اجْعَلْهُمَا سَوَاء»'],
    // **وشاشةُ الأشكال معها** (الجلسة ش): بطاقاتُها أشكالٌ مرسومة وأزرارُ أضلاعها
    // شفّافة — فيُقاس فيها الصنفُ وهدفُ اللمس معاً يومَ دخلت الرحلة.
    ['#/shape/sides', '«كَمْ ضِلْعًا؟»'],
    ['#/shape/world', '«الأَشْكَالُ حَوْلَنَا» — وأجزاؤها أهدافُ لمس'],
    // **وشاشاتُ حزمة الإثراء معها** (الجلسة ث): لوحان يعدّلهما الإصبعُ وزرّا حكمٍ
    // بلا حرف، وشريطٌ يُلمَس فيه موضع — فيُقاس فيها الصنفُ وهدفُ اللمس يومَ دخلت.
    ['#/share/two', '«بِالعَدْلِ بَيْنَ اثْنَيْن»'],
    ['#/units/hand', '«قِسْ بِيَدِك» — ووحداتُه أهدافُ لمس'],
    ['#/rank/five', '«الأَوَّلُ وَالثَّانِي وَالثَّالِث»'],
  ]) {
    const cdoc = await open(hash, hash ? '&dev=1' : '');
    await until(cdoc, (d) => d.querySelector('.station-body .next')
      || d.querySelector('main.map'), 22000);
    seenScreens++;
    textOnly.push(...bareButtons(cdoc).map((el) => `${what} (نمذجة): ${bareNames([el])}`));
    for (const row of undersized(cdoc)) undersizedRows.push(`${what} (نمذجة): ${tightNames([row])}`);
    if (!hash) continue;
    // ثم شاشةُ التمرين نفسِها — حيث الأزرارُ التي يلمسها الطفلُ ليجيب
    cdoc.querySelector('.station-body .next')?.click();
    await until(cdoc, (d) => d.querySelector('.q-choices .qcard')
      || d.querySelector('.same-btn') || d.querySelector('.q-equal')
      || d.querySelector('.q-solve--sides') || d.querySelector('.q-solve--thing')
      || d.querySelector('.q-solve--share') || d.querySelector('.q-solve--units')
      || d.querySelector('.q-solve--rank'), 22000);
    seenScreens++;
    textOnly.push(...bareButtons(cdoc).map((el) => `${what} (تمرين): ${bareNames([el])}`));
    for (const row of undersized(cdoc)) undersizedRows.push(`${what} (تمرين): ${tightNames([row])}`);
    // ثم ميداليةُ الختام — زرّا «الخريطة» و«أَعِدْ»
    [...cdoc.querySelectorAll('.dev button')]
      .find((b) => b.textContent.includes('إنهاء المحطة'))?.click();
    await until(cdoc, (d) => d.querySelector('.celebrate'), 12000);
    seenScreens++;
    textOnly.push(...bareButtons(cdoc).map((el) => `${what} (ميدالية): ${bareNames([el])}`));
    for (const row of undersized(cdoc)) undersizedRows.push(`${what} (ميدالية): ${tightNames([row])}`);
  }
  ok(undersizedRows.length === 0,
    `وكلُّ زرِّ طفلٍ على ${seenScreens} شاشةٍ يبلغ عتبةَ اللمس المعلَنة `
    + `(${TOUCH_MIN}بك، وعناصرُ اللوح ${BOARD_MIN} — استثناءُ \`METHOD.md §١١\`)`
    + (undersizedRows.length ? ` — **دون عتبته: ${undersizedRows.join(' | ')}**` : ''));
  ok(textOnly.length === 0 && seenScreens === 25,
    `وكلُّ زرٍّ على ${seenScreens} شاشةِ طفلٍ فيه ما يُرى لا حروفٌ وحدَها `
    + `(${EXEMPT.length} معفىً بسببه: ${EXEMPT.map(([sel, why]) => `${sel} — ${why}`).join(' · ')})`
    + (textOnly.length ? ` — **نصٌّ بلا صورة: ${textOnly.join(' | ')}**` : ''));

  /* **ويُجرَّب سالباً بزرٍّ نصيٍّ مصنوع**: يُدسّ في شاشةٍ حيّة زرٌّ لا صورةَ فيه،
     فإن لم يمسكه الحارسُ فليس حارساً. (ثم يُرفَع، فلا يبقى أثرُ فحصٍ في شاشة.) */
  const planted = await open('#/equal/five');
  await until(planted, (d) => d.querySelector('.station-body .next'), 22000);
  const cleanBefore = bareButtons(planted).length;
  const fake = planted.createElement('button');
  fake.className = 'btn';
  fake.textContent = 'زرٌّ نصيٌّ مصنوع';
  planted.querySelector('.station-body')?.append(fake);
  const caught = bareButtons(planted);
  fake.remove();
  ok(cleanBefore === 0 && caught.length === 1 && bareButtons(planted).length === 0,
    `**وحارسُ الصنف مُجرَّبٌ سالباً**: زرٌّ نصيٌّ دُسّ في شاشةٍ حيّة فأُمسِك `
    + `(${caught.length} قبل رفعه، و${bareButtons(planted).length} بعده)`);

  /* ————— ١١ي‌أ) **حكمُ صنفٍ ثانٍ: جملةٌ رمزية لا تتصدّر سؤالاً ليست جوابَه** —————

     بلاغُ الميدان ٧ وقع في `bridge` وحدَها، **والحكمُ صنفٌ لا موضع** (جردُ المدير،
     ١٦ أغسطس): كلُّ شاشةٍ تعرض جملةً رمزية (`.q-sentence`) فخانتُها وعدٌ — «هذا ما
     تنتظره هذه الجملة» — فيجب أن يوافق **جوابَ السؤال الجاري** (`dataset.answer`،
     وهو مقروءٌ من المرسوم في كل لوح). فإن عُرضت «٩ + ٣ = ؟» فوق سؤالٍ جوابُه ثلاثةٌ
     كان على الشاشة **رمزان متنافران في نظرةٍ واحدة**، وذلك عينُ ما بلّغ عنه المالك.

     **والجردُ على الشاشات لا بالاسم**: أنواعُ عقد الرحلة تُقرأ **من المنهج** (سنّةُ
     `browser_device.html`)، فمحطةٌ تدخل غداً بجملةٍ فوق سؤالٍ ليس جوابَها **تُمسَك
     يومَ تُكتب** بلا سطرٍ يُضاف هنا. **وقيمةُ الجملة تُحسَب من المرسوم وعلاماتِه**
     (بطاقاتُ حدودها وعلاماتُ عملياتها كما تُرى)، لا من نيّة الشاشة. */

  const { sections: journeySections } = await import('/js/curriculum.js');
  const firstOfEachType = () => {
    const seen = new Map();
    for (const section of journeySections()) {
      for (const node of section.nodes || []) if (!seen.has(node.type)) seen.set(node.type, node);
    }
    return [...seen.values()];
  };
  const shownNow = (el) => !!el && el.getClientRects().length > 0;
  const BOARDS_ANY = '.q-solve, .q-bond, .q-equal';
  /* **ولا يُدفَع في هذا الجرد ثمنُ زمنٍ لا يُقاس فيه**: المقيسُ هنا **بنيةٌ على
     الشاشة** (جملةٌ وجوابُ سؤالٍ) لا تعاقبٌ ولا مهلة — والوصولُ إلى جولةٍ تُلعَب
     يمرّ بنمذجةٍ تَعُدّ بمهلها (`BEAT` لكل عنصر)، فتكلّف عشراتِ الثواني في كل نوع.
     فتُقصَّر مُهَلُ نافذة التطبيق في هذا المشي وحدَه — كما يُبدَّل فيها `Audio` أصلاً
     (والتعاقبُ الزمنيّ يُقاس في نطاق الصوت بمهله الحقيقية، لا هنا). */
  const hurry = (win) => {
    const raw = win.setTimeout;
    win.setTimeout = (fn, ms, ...rest) => raw.call(win, fn, Math.min(ms || 0, 25), ...rest);
  };
  const sentenceRows = [];
  let sentenceScreens = 0;
  let typesWalked = 0;
  for (const node of firstOfEachType()) {
    const sdoc = await open(`#/${node.type}/${node.part}`);
    hurry(frame.contentWindow);
    /* **والنمذجةُ تُتَمّ ثم يُنقَر «تَابِعْ»** — فالجملةُ لا تُرى إلا في جولةٍ تُلعَب.
       ويُنتظَر **أوّلُ ما يجيء** (زرٌّ أو لوح): البواباتُ بلا نمذجةٍ أصلاً، فلا
       تُدفَع مهلةُ انتظارٍ لزرٍّ لا يجيء. */
    const go = await until(sdoc,
      (d) => d.querySelector('.station-body .next') || d.querySelector(BOARDS_ANY), 22000);
    if (go?.classList?.contains('next')) {
      go.click();
      await until(sdoc, (d) => d.querySelector(BOARDS_ANY), 12000);
    }
    typesWalked++;
    const line = sdoc.querySelector('.q-sentence');
    if (!shownNow(line)) continue;
    sentenceScreens++;
    const board = line.closest('.q-solve');
    const terms = [...line.querySelectorAll('.q-term .figure')].map((f) => Number(f.dataset.drawn));
    const signs = [...line.querySelectorAll('.q-sign')].map((s) => s.textContent.trim());
    const value = terms.slice(1).reduce(
      (sum, term, i) => (signs[i] === '−' ? sum - term : sum + term), terms[0]);
    const want = Number(board?.dataset.answer);
    const slot = line.querySelector('.q-ask');
    if (!(terms.length >= 2 && slot && Number.isFinite(want) && value === want)) {
      sentenceRows.push(`${node.type}: ${terms.join(` ${signs[0] || '?'} `)} = ${value}`
        + ` والسؤالُ جوابُه ${Number.isFinite(want) ? want : '؟'}`
        + (slot ? '' : ' — ولا خانةَ سؤالٍ في الجملة'));
    }
  }
  ok(sentenceRows.length === 0 && typesWalked >= 20,
    `و**لا جملةَ رمزية تتصدّر سؤالاً ليست جوابَه**: ${sentenceScreens} شاشةً بجملةٍ `
    + `من ${typesWalked} نوعَ عقدةٍ مجرودٍ من المنهج — خانةُ الجملة هي جوابُ سؤالها`
    + (sentenceRows.length ? ` — **المخالف: ${sentenceRows.join(' | ')}**` : ''));

  /* ————— ١١ي‌ب) «اجعلهما سواء» تُجتاز **لمساً مباشراً** (الجلسة م٥) —————

     حكمُ `FIELD.md §٤` الأول بحرفه: نقرُ عنصرٍ يُزيله، ونقرُ فراغِ اللوح يضيف —
     **ولا كلمةَ تشغيلٍ واحدة**. فيُقاس هنا الفعلُ كلُّه على الشاشة الحيّة: أنّ لا
     زرَّ **نصيٍّ** واحداً عليها، وأنّ اللمسَ يُنقص ويزيد **في المرسوم لا في النيّة**. */

  const eqDoc = await open('#/equal/five');
  await until(eqDoc, (d) => d.querySelector('.station-body .next'), 22000);
  eqDoc.querySelector('.station-body .next')?.click();
  await until(eqDoc, (d) => d.querySelector('.q-equal'), 22000);
  const eqSides = () => [...eqDoc.querySelectorAll('.q-equal .q-side')];
  const eqDrawn = (i) => Number(eqSides()[i]?.querySelector('.figure')?.dataset.drawn);
  ok(eqSides().length === 2 && Number.isFinite(eqDrawn(0)) && eqDrawn(0) !== eqDrawn(1),
    `«اجْعَلْهُمَا سَوَاء» تفتح بلوحين مختلفين (${eqDrawn(0)} و${eqDrawn(1)} مرسومين)`);

  /* **ولا زرَّ نصيٍّ واحدٍ عليها**: سقطت خمستُها في م٥، وعاد منها واحدٌ في م٦ **صورةً
     لا حرفاً** — فيُقاس النصُّ في الأزرار لا عددُها (زرٌّ بلا حرفٍ ليس حاجزَ قراءة). */
  const eqCard = eqDoc.querySelector('main.screen-card');
  const eqWords = [...eqDoc.querySelectorAll('.station-body .btn')]
    .filter((b) => (b.textContent || '').trim().length > 0);
  const eqDigits = [...new Set(shownIn(eqCard).match(DIGITS) || [])];
  ok(eqWords.length === 0 && eqDigits.length === 0,
    'ولا زرَّ نصيٍّ واحدٍ عليها ولا رمزَ عدديّ (المرحلة ٢)'
    + (eqWords.length ? ` — أزرارٌ نصيّة: ${eqWords.map((b) => b.textContent.trim()).join('، ')}` : '')
    + (eqDigits.length ? ` — أرقام: ${eqDigits.join('، ')}` : ''));

  /* ————— ١١ي‌ج) **الجوابُ يُعلَن كبساً ولا يقع صدفة** (م٦ — حسمُ بند المراقبة) —————

     **بلفظ المالك من الميدان**: «لا يوجد submit لصارا سواء فالطفل يبقى يزيد حتى
     يكونوا سواء أوتوماتيكياً» — أي أنّ الحكمَ التلقائي (م٥) يكافئ وصولاً بلا قصد.
     فعاد زرُّ الحكم **ميزاناً بلا نصّ**، والمشهدُ هنا يمشي أحكامَه الثلاثة على
     الشاشة الحيّة:

       • **كبسةٌ واللوحان مختلفان**: تُعالَج معالجةَ الخطأ نفسَها (تُعَدّ الكميتان
         أمامه) **ولا تُحتسب نجاحاً** — لا ميزانَ ولا انتقالَ ولا احتفال.
       • **واستواءٌ بلا كبسة لا يُحكَم له**: تُترَك الشاشةُ مستويةً برهةً فلا يقع شيء
         — وهو البابُ الذي يُحمِره ردُّ الحكم التلقائي.
       • **وكبسةٌ عندها تحتفل**: ميزانٌ يُرى ثم تمضي الجولة.

     **ولكلِّ جولةٍ وسيلةُ تسويةٍ وحدَها**: الأولى بالإبعاد (يُلمَس عنصرٌ من الأكثر)
     والثانية بالإتيان (يُلمَس فراغُ الأقلّ) — ويُقاسان **في المرسوم** لمسةً لمسة.
     (ولولا الفصلُ بينهما لَتعلّق القياسُ بقرعة الفارق: فارقُ واحدٍ يُسوّى بلمسةٍ
     واحدة، فلا تُجرَّب الوسيلةُ الأخرى أصلاً.) */
  const eqJudge = () => eqDoc.querySelector('.q-judge .btn--mark');
  const eqBalance = (d) => {
    const b = d.querySelector('.q-equal .q-balance');
    return b && !b.hidden && d.defaultView.getComputedStyle(b).display !== 'none' ? b : null;
  };
  const eqCounted = () => eqDoc.querySelectorAll('.q-equal .is-counted').length;

  const eqSteps = { remove: 0, add: 0 };
  let balanceSeen = 0;
  let eqMoved = 0;
  let eqLevels = [];
  let judgeSized = 0;
  let judgeReach = [];
  // الكبسةُ المبكّرة: ما رآه الطفلُ بعدها — عدٌّ أمامه، وميزانٌ؟ وانتقالٌ؟
  let earlyCounted = 0;
  let earlyPair = [0, 0];
  let earlyBalance = true;
  let earlyMoved = true;
  let idleHeld = 0;
  for (const mode of ['remove', 'add']) {
    await until(eqDoc, (d) => d.querySelector('.q-equal'), 22000);
    /* **والزرُّ يُقاس مقاساً وموضعاً**: زرٌّ تحت الطيّة زرٌّ لا يُكبَس — والطفلُ لا
       يعرف أنّ الصفحة تُمرَّر. فيُجرَد أسفلُه من ارتفاع الشاشة **بلا تمرير**. */
    const btn = await until(eqDoc, () => eqJudge(), 6000);
    const rect = btn ? btn.getBoundingClientRect() : { width: 0, height: 0, bottom: Infinity };
    if (rect.height >= 64 && rect.width >= 64) judgeSized++;
    judgeReach.push(Math.round(rect.bottom));

    /* **الكبسةُ المبكّرة تُجرَّب في الجولة الأولى وحدَها**: اللوحان مختلفان بحكم
       الجولة (البابُ الأول أعلاه)، فتُقاس المعالجةُ ونفيُ النجاح معاً. */
    if (mode === 'remove' && btn) {
      const beadEarly = beadNow(eqDoc);
      earlyPair = [eqDrawn(0), eqDrawn(1)];
      btn.click();
      // يُنتظَر أثرُ العدّ على الشاشة (عنصرٌ يُعلَّم) — لا مهلةٌ تُخمَّن
      earlyCounted = (await until(eqDoc, () => (eqCounted() > 0 ? eqCounted() : null), 12000)) || 0;
      earlyBalance = !!eqBalance(eqDoc);
      earlyMoved = beadNow(eqDoc) !== beadEarly || !!eqDoc.querySelector('.celebrate');
      /* ثم يُنتظَر تمامُ العدّ (يُمحى أثرُه) فتعود الشاشةُ إلى يد الطفل — **ويُقيَّد
         أكثرُ ما عُلِّم**: العدُّ يمشي على الكميتين بلا محوٍ بينهما، فذروتُه مجموعُهما.
         فلا يُقال «عُدَّ» لأنّ عنصراً أضيء، بل يُقابَل المعدودُ بالمرسوم. */
      await until(eqDoc, () => {
        earlyCounted = Math.max(earlyCounted, eqCounted());
        return eqCounted() === 0 ? true : null;
      }, 22000);
    }

    for (let step = 0; step < 8 && eqDrawn(0) !== eqDrawn(1); step++) {
      const big = eqDrawn(0) > eqDrawn(1) ? 0 : 1;
      const at = mode === 'remove' ? big : 1 - big;
      const was = eqDrawn(at);
      const want = mode === 'remove' ? was - 1 : was + 1;
      eqSides()[at]?.querySelector(mode === 'remove' ? '.fig-tap' : '.q-add')?.click();
      await until(eqDoc, () => (eqDrawn(at) === want ? true : null), 4000);
      if (eqDrawn(at) !== want) break;
      eqSteps[mode]++;
    }
    eqLevels.push(eqDrawn(0) === eqDrawn(1) ? eqDrawn(0) : NaN);

    /* **واستوى اللوحان — فلا شيء يقع حتى يُكبَس**: مهلةٌ أطولُ من وقفة الحكم
       التلقائي التي كانت (٩٠٠ مللي) بمرّتين ونصف، فلا يمرّ العطبُ من قِصَرِ قياس. */
    const idleBead = beadNow(eqDoc);
    await new Promise((r) => setTimeout(r, 2300));
    if (beadNow(eqDoc) === idleBead && !eqDoc.querySelector('.celebrate')
      && !eqBalance(eqDoc)) idleHeld++;

    const eqBead = beadNow(eqDoc);
    eqJudge()?.click();
    const balance = await until(eqDoc, (d) => eqBalance(d), 6000);
    if (balance && balance.querySelector('svg')) balanceSeen++;
    if (await until(eqDoc, (d) => (beadNow(d) !== eqBead
      || d.querySelector('.celebrate') ? true : null), 12000)) eqMoved++;
  }
  ok(eqSteps.remove > 0 && eqSteps.add > 0 && eqLevels.every(Number.isFinite),
    `ونقرُ عنصرٍ يُبعد واحداً ونقرُ فراغِ اللوح يأتي بواحد — **مقيسَين في المرسوم** `
    + `(${eqSteps.remove} إبعاداً و${eqSteps.add} إتياناً، واللوحان استويا على `
    + `${eqLevels.join(' ثم ')})`);
  /* **واللوحان متجاوران فلا يفيض عرضُهما** (أمرُ المالك — م٦): المجاورةُ تُنزل الزرَّ
     فوق الطيّة وتُخرج العرضَ إلى حدّه، فيُقاس الحدّان معاً. **وهذا موضعُ قياسه**:
     سَوقةُ `--device` تقف عند النمذجة فلا تبلغ التمرين، فلو لم يُقَس هنا لم يُقَس.
     ومقياسُ الرسم نسبةٌ من العرض بحاشيةٍ ثابتة، فما وسع ٨٣٤ وسع ما دونها. */
  const eqOver = eqDoc.documentElement.scrollWidth - eqDoc.defaultView.innerWidth;
  ok(eqOver <= 0,
    `ولا فائضَ أفقيّ واللوحان متجاوران (${eqOver}px على `
    + `${eqDoc.defaultView.innerWidth}بك)`);
  ok(judgeSized === 2 && judgeReach.every((b) => b <= eqDoc.defaultView.innerHeight),
    `**وزرُّ الحكم ميزانٌ بلا نصّ** يبلغ هدفَ اللمس فأكثر **وتبلغه العينُ بلا تمرير** `
    + `(${judgeSized} من ٢ جولة، وأسفلُه على ${judgeReach.join(' و')} من `
    + `${eqDoc.defaultView.innerHeight}بك)`);
  ok(earlyCounted === earlyPair[0] + earlyPair[1] && earlyCounted > 0
    && !earlyBalance && !earlyMoved,
    `**وكبسةٌ قبل التساوي تُعالَج ولا تُحتسب نجاحاً**: عُدَّت الكميتان أمامه `
    + `(${earlyCounted} عنصراً مُعلَّماً لِـ${earlyPair.join(' و')} مرسومين) ولا ميزانَ ولا انتقال`
    + (earlyBalance ? ' — **ظهر الميزانُ وهما مختلفان**' : '')
    + (earlyMoved ? ' — **ومضت الجولةُ على خطأ**' : ''));
  ok(idleHeld === 2,
    `**ولا حكمَ يقع من تلقائه**: استوى اللوحان فمكثا ٢٫٣ ثانيةً بلا كبسة فلا ميزانَ `
    + `ولا انتقال (${idleHeld} من ٢ جولة)`
    + (idleHeld < 2 ? ' — **وقع الحكمُ صدفةً بلا كبسة**' : ''));
  ok(balanceSeen === 2,
    `**والميزانُ المتوازن يظهر بينهما** بعد الكبسة رسماً على الشاشة `
    + `(${balanceSeen} من ٢ جولة)`);
  ok(eqMoved === 2,
    `**وكبسةٌ عند التساوي تحتفل**: الجولةُ تمضي بإعلان الطفل لا بوقوعه `
    + `(${eqMoved} من ٢)`);

  /* ————— ١١ل) حزمةُ الإثراء: القسمةُ والقياسُ والترتيبيّة (الجلسة ث) —————

     ثلاثُ محطاتٍ دخلت الذيلَ، ولكلٍّ حكمُها على الشاشة الحيّة:

       • **القسمةُ تُصنَع باللمس والجوابُ يُعلَن كبساً** (عهدُ م٦ على مادّةٍ جديدة):
         توزيعٌ عادلٌ يُترَك بلا كبسةٍ **فلا يقع حكم**، وكبسةٌ قبل العدل **تُعالَج ولا
         تُحتسب**، وكبسةٌ عنده تحتفل. **ولا رمزَ عمليةٍ ولا علامة** في المعروض.
       • **والباقي يُرى ويُسمّى ولا يُعَدّ خطأً**: في «ما ينقسم وما لا ينقسم» يبقى
         في الكومة واحدٌ **والجولةُ تمضي** — وهو أدقُّ ما في المرحلة.
       • **والوحداتُ متلاصقةٌ بالبكسل بعد التنسيق**: حارسُ المصيِّر يقيس الخطةَ
         أعداداً، **وهذا يقيس المرسومَ على الشاشة** — فتنسيقٌ يفتح بينها فجوةً
         (حاشيةٌ أو حدٌّ) يُمسَك هنا وحدَه. **وعرضُها واحد**: لا مسطرتان في سؤال.
       • **ولا تجاوزَ للشريط**: نقرٌ فوق طوله لا يزيد وحدةً — امتناعٌ في البنية.
       • **والترتيبيّةُ بلا رقمٍ واحد، وأوّلُها من اليمين**: جهةُ ملء الإطار نفسُها. */

  const drawnIn = (el) => Number(el?.querySelector('.figure')?.dataset.drawn);

  // ————— القسمة: توزيعٌ باللمس وحكمٌ يُكبَس —————
  const shDoc = await open('#/share/rest', '&dev=1');
  await until(shDoc, (d) => d.querySelector('.station-body .next'), 22000);
  shDoc.querySelector('.station-body .next')?.click();
  await until(shDoc, (d) => d.querySelector('.q-solve--share'), 22000);
  const shBoard = () => shDoc.querySelector('.q-solve--share');
  const shBowls = () => [...shDoc.querySelectorAll('.q-bowls .q-side')];
  const shPile = () => shDoc.querySelector('.q-pile');
  const shJudge = () => shDoc.querySelector('.q-judge .btn--mark');
  const shHeld = (i) => shBowls()[i]?.querySelectorAll('[data-mark]').length ?? -1;
  const shSigns = shownIn(shDoc.querySelector('.station-body'));

  const shWant = Number(shBoard().dataset.answer);
  const shLeft = Number(shBoard().dataset.left);
  // **كبسةٌ قبل العدل**: الأوعيةُ فارغةٌ بعدُ — أتُعالَج ولا تُحتسب؟
  const shBeadBefore = beadNow(shDoc);
  shJudge()?.click();
  const shEarlyCounted = (await until(shDoc,
    () => (shDoc.querySelectorAll('.q-solve--share .is-counted').length || null), 12000)) || 0;
  const shEarlyMoved = beadNow(shDoc) !== shBeadBefore || !!shDoc.querySelector('.celebrate');
  await until(shDoc,
    () => (shDoc.querySelectorAll('.q-solve--share .is-counted').length === 0 ? true : null), 22000);

  // ثم يُوزَّع بالعدل لمسةً لمسة — والعددُ في كل وعاءٍ **مقروءٌ من المرسوم**
  let shTaps = 0;
  for (let guard = 0; guard < 30; guard++) {
    const at = shBowls().findIndex((_, i) => shHeld(i) < shWant);
    if (at < 0) break;
    const was = shHeld(at);
    shBowls()[at].querySelector('.q-add')?.click();
    await until(shDoc, () => (shHeld(at) === was + 1 ? true : null), 4000);
    if (shHeld(at) !== was + 1) break;
    shTaps++;
  }
  const shFair = shBowls().every((_, i) => shHeld(i) === shWant);
  const shRest = drawnIn(shPile());
  // **واستوت الأوعيةُ — فلا شيء يقع حتى يُكبَس**
  const shIdleBead = beadNow(shDoc);
  await new Promise((r) => setTimeout(r, 2300));
  const shIdleHeld = beadNow(shDoc) === shIdleBead && !shDoc.querySelector('.celebrate');
  shJudge()?.click();
  const shMoved = !!(await until(shDoc,
    () => (beadNow(shDoc) !== shIdleBead || shDoc.querySelector('.celebrate') ? true : null), 20000));

  ok(shFair && shTaps === shWant * shBowls().length,
    `**القسمةُ تُصنَع باللمس**: ${shTaps} لمسةً وزّعت ${shWant} لكلِّ وعاءٍ من `
    + `${shBowls().length} — والعددُ في كلٍّ مقروءٌ من المرسوم`
    + (shFair ? '' : ' — **لم تستوِ الأوعية**'));
  ok(shRest === shLeft && shLeft > 0,
    `**والباقي يُرى في الكومة ولا يُخفى**: بقي ${shRest} والمنتظَر ${shLeft} `
    + '(محطةُ «ما ينقسم وما لا ينقسم»)');
  ok(shEarlyCounted > 0 && !shEarlyMoved,
    `**وكبسةٌ قبل العدل تُعالَج ولا تُحتسب نجاحاً**: عُدَّ أمامه (${shEarlyCounted} `
    + 'عنصراً مُعلَّماً) ولا انتقال'
    + (shEarlyMoved ? ' — **مضت الجولةُ على خطأ**' : ''));
  ok(shIdleHeld,
    '**ولا حكمَ يقع من تلقائه**: استوت الأوعيةُ فمكثت ٢٫٣ ثانيةً بلا كبسةٍ فلا انتقال'
    + (shIdleHeld ? '' : ' — **وقع الحكمُ صدفةً بلا كبسة**'));
  ok(shMoved, '**وكبسةٌ عند العدل تمضي بالجولة** — بإعلان الطفل لا بوقوعه');
  ok(!/[+−=×÷]/.test(shSigns),
    'ولا رمزَ عمليةٍ ولا علامةَ مساواةٍ في شاشة القسمة (جبهتُها `ops: []`)'
    + (/[+−=×÷]/.test(shSigns) ? ` — **معروض: ${shSigns.slice(0, 60)}**` : ''));

  // ————— القياس بوحدة: تلاصقٌ بالبكسل، ولا تجاوز —————
  const unDoc = await open('#/units/hand', '&dev=1');
  await until(unDoc, (d) => d.querySelector('.station-body .next'), 22000);
  unDoc.querySelector('.station-body .next')?.click();
  await until(unDoc, (d) => d.querySelector('.q-solve--units'), 22000);
  const unSpan = Number(unDoc.querySelector('.q-solve--units').dataset.answer);
  const unLaid = () => unDoc.querySelectorAll('[data-unit]').length;
  let unTaps = 0;
  for (let guard = 0; guard < 20; guard++) {
    const was = unLaid();
    unDoc.querySelector('.q-add')?.click();
    await until(unDoc, () => (unLaid() !== was ? true : null), 3000);
    if (unLaid() === was) break;
    unTaps++;
  }
  // **ولا تجاوز**: نقرتان زائدتان بعد الاستيفاء لا تزيدان وحدة
  const unFull = unLaid();
  unDoc.querySelector('.q-add')?.click();
  unDoc.querySelector('.q-add')?.click();
  await new Promise((r) => setTimeout(r, 400));
  const unAfter = unLaid();

  /* **والتلاصقُ يُقاس على المرسوم بالبكسل** (لا على الخطة): حافّةُ الوحدة اليسرى هي
     حافّةُ التي تليها اليمنى — وسمكُ الحدّ يجعل الفرقَ كسراً، فالعتبةُ بكسلٌ واحد. */
  const unRects = [...unDoc.querySelectorAll('[data-unit]')]
    .map((u) => u.getBoundingClientRect())
    .sort((a, b) => b.right - a.right);
  let unGap = 0;
  for (let i = 1; i < unRects.length; i++) {
    unGap = Math.max(unGap, Math.abs(unRects[i].right - unRects[i - 1].left));
  }
  const unWidths = unRects.map((r) => r.width);
  const unSpread = unWidths.length ? Math.max(...unWidths) - Math.min(...unWidths) : 0;
  const unBar = unDoc.querySelector('[data-bar]')?.getBoundingClientRect();
  const unFromEdge = unRects.length && unBar ? Math.abs(unRects[0].right - unBar.right) : 99;

  ok(unTaps === unSpan && unFull === unSpan,
    `**القياسُ يُصنَع باليد**: ${unTaps} لمسةً رصّت ${unFull} وحدةً على شريطٍ طولُه `
    + `${unSpan} — معدودةً من المرسوم`);
  ok(unAfter === unSpan,
    `**ولا تجاوزَ للشريط**: نقرتان بعد الاستيفاء أبقتاه ${unAfter} — امتناعٌ في البنية`);
  ok(unGap <= 1.5 && unRects.length > 1,
    `**والوحداتُ متلاصقةٌ بالبكسل بعد التنسيق** (أقصى فرقٍ بين حافّتين `
    + `${unGap.toFixed(2)}بك) — لا فجوةَ ولا تراكب`);
  ok(unSpread <= 1.5,
    `**والوحدةُ واحدةٌ في السؤال**: عروضُها سواءٌ (فرقُ ${unSpread.toFixed(2)}بك) `
    + '— ولا يُقاس شريطٌ بمسطرتين');
  ok(unFromEdge <= 1.5,
    `وأوّلُ وحدةٍ عند طرف الشريط الأيمن (${unFromEdge.toFixed(2)}بك) — جهةُ ملء الإطار`);
  // **والحكمُ كبسة**: تُكبَس المسطرةُ فتُعَدّ الوحداتُ أمامه وتمضي الجولة
  const unBead = beadNow(unDoc);
  unDoc.querySelector('.q-judge .btn--mark')?.click();
  const unMoved = !!(await until(unDoc,
    () => (beadNow(unDoc) !== unBead || unDoc.querySelector('.celebrate') ? true : null), 25000));
  ok(unMoved, '**وقياسٌ يُعلَن كبساً يمضي بالجولة** (مسطرةٌ تُرى ولا تُقرأ)');

  // ————— الترتيبيّة: لا رقمَ، والأوّلُ من اليمين —————
  const rkDoc = await open('#/rank/five', '&dev=1');
  await until(rkDoc, (d) => d.querySelector('.station-body .next'), 22000);
  rkDoc.querySelector('.station-body .next')?.click();
  await until(rkDoc, (d) => d.querySelector('.q-solve--rank'), 22000);
  const rkSeen = shownIn(rkDoc.querySelector('.station-body'));
  const rkTaps = [...rkDoc.querySelectorAll('.fig-tap--cell')]
    .map((b) => b.getBoundingClientRect());
  const rkCells = [...rkDoc.querySelectorAll('.q-solve--rank [data-cell]')]
    .map((c) => c.getBoundingClientRect());
  ok(!DIGITS.test(rkSeen),
    'ولا رقمَ واحداً على شاشة الترتيبيّة — لغتُها أسماءُ الترتيب لا الأعداد'
    + (DIGITS.test(rkSeen) ? ` — **معروض: ${rkSeen.slice(0, 60)}**` : ''));
  ok(rkTaps.length >= 3 && rkTaps.length === rkCells.length
    && rkTaps.every((r, i) => Math.abs(r.right - rkCells[i].right) < 6),
  `**ولكلِّ خانةٍ زرُّ موضعها** (${rkTaps.length} خانةً و${rkTaps.length} زرّاً) — `
  + 'من المصيِّر لا من حسابٍ ثانٍ');
  ok(rkTaps.length > 1 && rkTaps[0].right > rkTaps[rkTaps.length - 1].right,
    '**والأوّلُ من اليمين**: زرُّ الخانة الأولى أقصى اليمين — جهةُ ملء الإطار وبدءِ '
    + 'خطّ الأعداد نفسُها (RTL)');
  const rkRight = answerOf(rkDoc);
  const rkBead = beadNow(rkDoc);
  rkRight?.click();
  ok(!!(await until(rkDoc,
    () => (beadNow(rkDoc) !== rkBead || rkDoc.querySelector('.celebrate') ? true : null), 20000)),
  'ولمسةُ الموضع المُعلَن (مقروءاً من الشريط المرسوم) تمضي بالجولة');

  /* ————— ١١م) **الخطأُ لا يُغلق الجولة**: خطأٌ ثمّ صوابٌ يُقبَل (بلاغ الميدان ٦) —————

     **نصُّ البلاغ بلفظ المالك**: «بعد اختيار الرمز الخطأ، لم يسمح بالعودة واختيار
     الرمز الصحيح» — البطاقةُ الخطأ باقيةٌ محاطةً بالأحمر والشاشةُ صمّاء. والعهدُ في
     `station.js` صريح: **«يُعَدُّ أمامه ثمّ يحاول ثانية»**.

     **ولم يمسكه شيءٌ ممّا كان**: كان الفحصُ يقيس **أثرَ** الخطأ (أضاء عدٌّ؟ أبقيت
     الخرزةُ؟) ولا يقيس **ما بعده** — فمرّت شاشةٌ يُعَدّ فيها ثم تموت. فهذا حارسُ
     **ما رأى الطفل**: في كل شاشةِ اختيار يُنقَر جوابٌ خطأ، ثم يُنتظَر ذهابُ الأحمر
     (وهو علامةُ تمام التصحيح)، **ثم يُنقَر الصواب** — فإن لم تمضِ الجولةُ فالشاشةُ
     مقفولة، ويُسمّى من أقفلها باسمه.

     **وشاشتان تُقاسان مرّتين**: «أين هذا العدد؟» و«أيُّ رمزٍ لها؟» وجها المحطة
     نفسِها، **وبينهما وقع البلاغ** (يُعَدّ في الأولى ما لُمس وفي الثانية ما عُرِض) —
     فتُمشى محطةُ الرموز حتى يقع الخطأُ في **الوجهين معاً**.

     (وألواحُ الإعلان بالكبس — «اجعلهما سواء» والقسمةُ و«قِسْ بيدك» — خطؤها كبسةٌ قبل
      تمام الصنع، وقد قِيست في §١١ي‌ج و§١١ل: تُعالَج ثم **تمضي الجولةُ بكبسةٍ بعدها**.) */

  /** ما يُنقَر جواباً في شاشات الاختيار — بطاقةٌ أو خانةٌ أو موضعٌ مرسوم. */
  const PICKABLE = '.q-choices .qcard, .q-rack .qcard, .q-pair .qcard, .fig-slot,'
    + ' .q-pickspot, .fig-tap--cell, .q-barpick';
  /** لوحُ الأجزاء (المرحلتان ٥ و٧) — يُصنَع ولا يُختار، فخطؤه ملءُ خاناته بما لا يُتمّ. */
  const PARTS_BOARD = '.q-bond:not(.q-bond--frame)';
  const goodCount = (d) => d.querySelectorAll('.good').length;

  /** جوابٌ **غيرُ** الصحيح: أوّلُ ما يُنقَر ممّا ليس هو — والخطأُ خطأٌ أيّاً كان. */
  const wrongOf = (d, right) => [...d.querySelectorAll(PICKABLE)]
    .filter((el) => el !== right && !el.disabled && el.offsetParent !== null)[0] || null;

  /* **وشاشاتُ اللمس تُعَدّ أولاً ثم تُسأل**: «المس وعُدّ» و«كم ضلعاً؟» لا بطاقةَ فيهما
     حتى يمشي الطفلُ على المرسوم — فالحارسُ يمشيه كما يمشيه هو. */
  const reachChoice = async (d) => {
    if (await until(d, (x) => x.querySelector(PICKABLE), 2500)) return true;
    for (let k = 0; k < 25; k++) {
      const tap = [...d.querySelectorAll('.fig-tap')].filter((b) => !b.disabled)[0];
      if (!tap) break;
      tap.click();
      await new Promise((r) => setTimeout(r, 220));
    }
    return Boolean(await until(d, (x) => x.querySelector(PICKABLE), 22000));
  };

  /** ردُّ ما وُضع في خانات اللوح — فيعود كما كان (لا يُترَك أثرُ فحصٍ في شاشة). */
  const emptyBoard = async (d) => {
    for (let k = 0; k < 4; k++) {
      const full = [...d.querySelectorAll(`${PARTS_BOARD} .q-slot`)].filter((s) => !s.disabled)[0];
      if (!full) break;
      full.click();
      await new Promise((r) => setTimeout(r, 200));
    }
  };

  /**
   * يملأ خانات لوح الأجزاء **بما لا يُتمّ الكلّ** — فيقع الحكمُ على خطأ.
   *
   * **والأجزاءُ الأولى أصغرُ ما في الحوض** عمداً: التجاوزُ ممتنعٌ في البنية (بطاقةٌ
   * تزيد على ما بقي تُعطَّل)، فلو وُضع الأكبرُ أولاً لَما بقي للخانة الأخيرة إلا
   * البطاقةُ الصحيحةُ وحدَها **فلا سبيلَ إلى خطأ أصلاً**. (وهو ما أحمر هذا البابَ
   * يومَ كُتب — عيبٌ في الحارس لا في الشاشة.)
   */
  const fillWrong = async (d) => {
    const board = d.querySelector(PARTS_BOARD);
    for (let k = 0; k < 5 && Number(board.dataset.slots) > 0; k++) {
      const need = Number(board.dataset.need);
      const last = Number(board.dataset.slots) <= 1;
      const free = [...d.querySelectorAll('.q-choices .qcard')].filter((c) => !c.disabled);
      const pick = last
        ? free.find((c) => drawnOf(c) !== need)
        : free.reduce((a, b) => (drawnOf(a) <= drawnOf(b) ? a : b), free[0]);
      if (!pick) { await emptyBoard(d); return false; }   // لا سبيلَ إلى خطأ: يُرَدّ اللوح
      pick.click();
      await new Promise((r) => setTimeout(r, 320));
    }
    return true;
  };

  /**
   * جولةٌ واحدة: خطأٌ ← يُنتظَر تمامُ التصحيح ← صوابٌ **يجب أن يُقبَل**.
   * @returns {Promise<string|null>} علّةُ الإخفاق باسمها، أو `null` إن مضت الجولة.
   */
  const errThenRight = async (d, what) => {
    const bead = beadNow(d);
    const goods = goodCount(d);
    const parts = d.querySelector(PARTS_BOARD);
    let cleared = null;
    if (parts) {
      const slots0 = Number(parts.dataset.slots);
      if (!(await fillWrong(d))) return null;   // لا سبيلَ إلى خطأ في هذه الجولة
      // **علامةُ تمام التصحيح**: يُفرَّغ اللوحُ فيعود إلى يد الطفل كما بدأ
      cleared = await until(d,
        (x) => (Number(x.querySelector(PARTS_BOARD)?.dataset.slots) === slots0 ? true : null), 25000);
    } else {
      const right = answerOf(d);
      if (!right) return `${what}: لا جوابَ يُلمَس على الشاشة`;
      const wrong = wrongOf(d, right);
      if (!wrong) return null;                  // لوحٌ يُصنَع لا يُختار — قِيس في موضعه
      wrong.click();
      // **علامةُ تمام التصحيح ذهابُ الأحمر** — وهي آخرُ سطرٍ في مسار الخطأ كلِّه
      cleared = await until(d, (x) => (x.querySelector('.bad') ? null : true), 25000);
    }
    if (!cleared) return `${what}: بقي أثرُ الخطأ ولم تُرَدَّ الشاشةُ — الجولةُ أُغلقت`;
    if (beadNow(d) !== bead || d.querySelector('.celebrate')) {
      return `${what}: مضت الجولةُ على خطأ`;
    }
    // **ثمّ يحاول ثانية**: تُساق الجولةُ صواباً، فإن لم تمضِ فالشاشةُ مقفولة
    for (let k = 0; k < 6; k++) {
      const right = answerOf(d);
      if (!right) break;
      right.click();
      if (await until(d, (x) => (beadNow(x) !== bead || x.querySelector('.celebrate')
        || goodCount(x) > goods ? true : null), 3000)) return null;
    }
    return `${what}: نقرةُ الصواب **لم تُقبَل** بعد الخطأ`;
  };

  /* **والجردُ بنوع الشاشة لا بمحطةٍ بعينها**: لكلِّ مُصيِّرِ جولةٍ في الرحلة شاشتُه —
     فوجهٌ جديد يدخل غداً يدخل هذا الحارسَ بسطرٍ واحد، ويُطبَع عددُ ما قِيس. */
  /* **وشاشةٌ لكلِّ مُصيِّرِ جولة**: عشرُ شاشاتٍ تغطّي مُصيِّرات الاختيار كلَّها في
     الرحلة (وما تكرّر منها مُصيِّرُه واحد) — **وألواحُ الإعلان بالكبس** («اجعلهما
     سواء» والقسمةُ و«قِسْ بيدك») **قِيست في §١١ي‌ج و§١١ل**: كبسةٌ قبل تمام الصنع
     تُعالَج ثمّ تمضي الجولةُ بكبسةٍ بعدها. **والحدُّ مُعلَنٌ لا صامت**: كلُّ جولةٍ
     هنا ثوانٍ بحسابها (نمذجةٌ تُعَدّ ثم تصحيحٌ يُعَدّ)، فالجردُ **بالمُصيِّر لا
     بالمحطة** كي تبقى البطاريةُ في مهلتها. */
  const RETRY_SCREENS = [
    ['#/subitize/two', '«كم ترى؟»'],
    ['#/more/three', '«أيُّهما أكثر؟»'],
    ['#/count/three', '«المس وعُدّ»'],
    ['#/compare/ten', '«أيُّهما أكبر؟»'],
    ['#/line/ten', '«أين يقع؟»'],
    ['#/bond/four', '«اصنع العدد» (لوحُ الأجزاء)'],
    ['#/add/machine', '«آلة الجمع»'],
    ['#/pattern/abab', '«أكمل النمط»'],
    ['#/shape/pair', '«أين هذا الشكل؟»'],
    ['#/units/count', '«كم وحدةً طولُه؟»'],
  ];
  const shut = [];
  let retried = 0;
  for (const [hash, what] of RETRY_SCREENS) {
    const rdoc = await open(hash);
    (await onward(rdoc))?.click();
    if (!(await reachChoice(rdoc))) {
      shut.push(`${what}: لم تبلغ جولةً تُلمَس`);
      continue;
    }
    retried++;
    const why = await errThenRight(rdoc, what);
    if (why) shut.push(why);
  }

  /* **ووجها محطة الرموز كلاهما** — وهو موضعُ البلاغ نفسِه: يُمشى حتى يقع الخطأُ
     في «أيُّ رمزٍ لها؟» و«أين هذا العدد؟» معاً، فلا ينجو وجهٌ بقرعةِ أوّلِ جولة. */
  const bothFaces = new Set();
  const faceShut = [];
  const faceDoc = await open('#/numeral/four-five');
  (await onward(faceDoc))?.click();
  for (let i = 0; i < 8 && bothFaces.size < 2 && !faceDoc.querySelector('.celebrate'); i++) {
    if (!(await reachChoice(faceDoc))) break;
    const face = askOf(faceDoc);
    const why = await errThenRight(faceDoc, `محطةُ الرموز — «${face}»`);
    if (why) faceShut.push(why);
    else bothFaces.add(face);
    await new Promise((r) => setTimeout(r, 300));
  }

  ok(shut.length === 0 && retried === RETRY_SCREENS.length,
