<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فحصُ «اِحْسِبْ» في متصفّحٍ حقيقي</title>
<style>body{font-family:system-ui;padding:2rem;direction:rtl}</style>
</head>
<body>
<p>يُشغَّل الفحص… (تُرسَل النتائج إلى <code>POST /result</code> ثم يُقتل المتصفّح)</p>

<iframe id="app" src="/" style="width:834px;height:1194px;border:1px solid #ccc"></iframe>

<script type="module">
  /* عدّةُ المتصفّح — **بذرةُ المنصة**: ما لا يُثبته إلا متصفّحٌ حقيقي.
     الجلسة ٠ تفحص **بذرةً فارغة**: أتفتح؟ أهي RTL بعلامتها؟ أأرقامُها مشرقية؟
     أفيها محرفُ إيموجي يُسلَّم لخطّ النظام؟ أفيها فائضٌ أفقيّ؟
     والجلساتُ التالية تضيف فحوصَ شاشاتها هنا (لا تُنشئ عدّةً ثانية). */

  const out = [];
  const ok = (cond, msg) => out.push({ ok: !!cond, msg });

  /* **عطبُ الصفحة يُبلَّغ ولا يصمت**: كان خطأٌ واحد يوقف هذا النصّ فلا تصل نتيجةٌ
     أصلاً، فيُقرأ «لم تصل نتيجة» بطءَ جهازٍ أو قِصَرَ مهلة — وهو عينُ الالتباس الذي
     وُجد له `--self-test` في `browser_test.py`. فما مضى من الفحوص يُرسَل، ومعه العطبُ
     نفسُه فحصاً أحمر باسمه. */
  const report = (rows) => fetch('/result', { method: 'POST', body: JSON.stringify({ from: 'ihsib', rows }) });

  /* **والتعلّقُ يُبلَّغ كما يُبلَّغ العطب**: انتظارُ حدثٍ لا يجيء يوقف النصَّ بلا خطأ،
     فلا يصل شيء. فمهلةٌ حارسة ترسل ما تمّ ومعه سطرٌ أحمر يسمّي التعلّق — «لم تصل
     نتيجة» لا يجوز أن يكون آخرَ ما نعرف. */
  const watchdog = setTimeout(() => {
    report([...out, { ok: false, msg: 'تعلّقت صفحةُ الفحص قبل تمامها (انتظارٌ لم ينتهِ)' }]);
  }, 580000);

  /* ————— «لا نطقَ آليّ»: يُقاس في مسار الطفل نفسِه (الجلسة ص) —————

     وعدٌ معلَن: **لا ينطق التطبيق شيئاً بصوتٍ آليّ لحظيّ** — والاحتياطُ في `audio.js`
     كان صواباً ما دامت القائمةُ منتظِرة، فلمّا صُرِّفت وجب أن يعود الفحصُ صارماً.
     ولا يكفي أن نجرد الشجرة (`check_speech.mjs` يفعل): نصٌّ **يُركَّب في زمن التشغيل**
     يخالف حرفاً واحداً ما أُعلن ⇒ لا ملفَّ له ⇒ نطقٌ آليّ — ولا يراه إلا التشغيل.

     فيُبدَّل في نافذة التطبيق `Audio` و`SpeechSynthesisUtterance` بشاهدين: الأولُ
     يقيّد **مفتاحَ** كل ملفٍ شُغِّل (ولا يُنزِّل صوتاً في فحصٍ بلا سمّاعة)، والثاني
     يقيّد كلَّ لجوءٍ إلى النطق الآليّ. والحكمُ في آخر الصفحة. */
  const played = [];      // مفاتيحُ ملفاتٍ شُغِّلت من البنك
  const spoken = [];      // ما لجأ إلى النطق الآليّ — يجب أن يبقى فارغاً

  /* ————— **حارسُ التعاقب** (بلاغُ الميدان ١ · الجلسة م١) —————

     الحرّاسُ كانوا **يعدّون التشغيلات ولا يقيسون التعاقب**: ٦٥ فحصاً أخضر وأذنُ
     المالك تسمع صوتين معاً وثالثاً مقطوشاً. فصار العنصرُ الوهميّ يسجّل **لحظتَي بدء
     كل تشغيلٍ وتمامه**، ومنهما يُحكَم: لا لحظةَ فيها صوتان يعملان معاً، ولا جملةً
     تُقطَع قبل تمامها إلا بإسكاتٍ مقصود، ولا خطوةً تتقدّم وجملتُها في الجوّ.

     **ومدّتُه تُرفَع في مواضع القياس**: بمدّةٍ أقصرَ من مهلات الشاشة يمرّ العطبُ
     الأصليّ (كان يدهس بعد ٦٢٠ مللي، وينقل بعد ٧٨٠) — فالحارسُ الذي لا يُحمرّه
     العطبُ الذي وُلد منه ليس حارساً. */
  let audioMs = 60;       // مدّةُ الملفّ الوهميّ — تُرفَع في فحص التعاقب
  let docSeq = 0;         // **مستندٌ لكل سَوقة**: الطفلُ لا يرى إلا واحداً
  const timeline = [];    // {key, doc, t0, t1} — لحظاتُ كل تشغيلٍ بالمللي
  /** إغلاقُ ما بقي مفتوحاً (مستندٌ يُغادَر فتموت مؤقّتاته) — فلا فجوةٌ تُقرأ تراكباً. */
  const closeOpen = () => {
    for (const row of timeline) if (row.t1 === Infinity) row.t1 = performance.now();
  };
  /**
   * أزواجُ التشغيل المتقاطعة في مدىً من الزمن — «صوتان معاً» بحرفه.
   *
   * **والمقابلةُ داخلَ المستند الواحد**: إسنادُ `src` إلى الإطار لا يقتل المستندَ
   * القديم لحظتَه — يبقى حيّاً حتى يستقرّ الجديد، فتتقاطع مؤقّتاتُه مع أوّل جملةٍ في
   * الوارد. وذلك **صفحتان في اختبار، لا صوتان في أذن طفل** (لا يرى إلا مستنداً
   * واحداً)، فلا تُقابَل جملةُ مغادِرٍ بجملة قادم. وما داخل المستند يُقابَل كلُّه.
   */
  const overlaps = (from = 0) => {
    const bad = [];
    for (const doc of new Set(timeline.map((r) => r.doc))) {
      const rows = timeline.filter((r) => r.doc === doc && r.t0 >= from)
        .sort((a, b) => a.t0 - b.t0);
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].t0 < rows[i - 1].t1 - 1) bad.push(`${rows[i - 1].key}+${rows[i].key}`);
      }
    }
    return bad;
  };

  const hookAudio = (w) => {
    if (!w || w.__audioHooked) return;
    w.__audioHooked = true;
    const doc = ++docSeq;
    w.Audio = class extends w.EventTarget {
      constructor(src = '') { super(); this.preload = ''; this.currentTime = 0; this.src = src; }
      set src(v) {
        this._src = v || '';
        this.__key = (String(this._src).split('/').pop() || '').split('?')[0].replace('.mp3', '');
      }
      get src() { return this._src; }
      play() {
        if (this.__key) played.push(this.__key);
        this.__row = { key: this.__key, doc, t0: performance.now(), t1: Infinity };
        timeline.push(this.__row);
        this.__timer = setTimeout(() => {
          this.__close();
          this.dispatchEvent(new w.Event('ended'));
        }, audioMs);
        return Promise.resolve();
      }
      /** الإسكاتُ يُنهي المدى فعلاً (لا يبقى مفتوحاً فيُقرأ تراكباً على ما بعده). */
      __close() {
        clearTimeout(this.__timer);
        if (this.__row && this.__row.t1 === Infinity) this.__row.t1 = performance.now();
      }
      pause() { this.__close(); }
      load() {}
      removeAttribute() { this.src = ''; }
    };
    w.SpeechSynthesisUtterance = class { constructor(text) { spoken.push(text); this.text = text; } };
  };

  // فهرسُ البنك ونصوصُ القائمة المنتظِرة — وغيابُهما لا يُسقِط الصفحة: بلا بنكٍ لا
  // ملفَ يُشغَّل، وبقائمةٍ فارغةٍ يصير الفحصُ صارماً **بلا تعديلٍ هنا**.
  const jsonOr = async (path, fallback) => {
    try { const r = await fetch(path); return r.ok ? await r.json() : fallback; }
    catch { return fallback; }
  };
  const bank = await jsonOr('/audio/manifest.json', {});
  const pendingAudio = new Set(await jsonOr('/__queue.json', []));

  try {

  const frame = document.getElementById('app');
  const ready = new Promise((r) => frame.addEventListener('load', r, { once: true }));
  await ready;
  hookAudio(frame.contentWindow);
  // مهلةٌ تكفي وحداتِ ES أن تُحمَّل وتُرسَم (الوحدات غيرُ متزامنة)
  await new Promise((r) => setTimeout(r, 1200));

  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  const root = doc.documentElement;
  const app = doc.getElementById('app');

  // ————— ١) التطبيق يفتح فعلاً —————
  ok(app && !app.querySelector('.boot'), 'التطبيق يفتح ويحلّ محلَّ سطر التحميل');
  ok(doc.querySelector('.topbar'), 'وله شريطٌ علويّ');
  ok(doc.querySelector('main.map'), 'والشاشةُ الأولى خريطةُ الرحلة');

  // ————— ٢) الهوية: العلامة والاتجاه والخطّ —————
  const brand = doc.querySelector('.brand-word');
  ok(root.getAttribute('dir') === 'rtl' && root.lang === 'ar',
    'الصفحةُ عربيةٌ من اليمين (dir=rtl · lang=ar)');
  ok(brand && brand.textContent === 'اِحْسِبْ',
    `العلامةُ «اِحْسِبْ» مشكولةً في الترويسة (وُجد: «${brand ? brand.textContent : 'لا شيء'}»)`);
  const brandFont = brand && win.getComputedStyle(brand).fontFamily;
  ok(brandFont && brandFont.includes('Marhey'),
    `وبخطّ العلامة Marhey وحدَه (${brandFont || 'بلا خط'})`);
  ok(doc.querySelector('.brand-owl svg'), 'ومعها المرشدُ رسماً متجهاً (SVG) لا صورةً نقطية');

  // ————— ٣) أرقام المشرق في كل موضع (قرار ق١ · METHOD §٩) —————
  // **لا رقمَ لاتينيّ على شاشة طفل**: يُجرَد النصُّ المعروض كلُّه، وتُستثنى العقدُ
  // المخفيّة عن العين (`aria-hidden` لا يُقرأ، ومع ذلك يُفحَص لأنه يُرى).
  const shown = doc.body.innerText || '';
  const latin = [...new Set(shown.match(/\d/g) || [])];
  ok(latin.length === 0,
    `لا رقمَ لاتينيّ في النصّ المعروض${latin.length ? ` — وُجد: ${latin.join('، ')}` : ''}`);

  // ————— ٤) «أيقونات لا إيموجي»: لا محرفَ يُسلَّم لخطّ النظام —————
  // قاعدةُ يونيكود نفسُها التي في `ui.js` — رمزٌ مصوَّر بتمامه لا محرفٌ نصّيّ
  // (تخرج بها «★» و«✓» و«←» و«▾»: يرسمها خطُّ النصّ ولا شأن لها بالمهمة).
  const EMOJI_RE = /\p{Emoji_Presentation}|\p{Extended_Pictographic}️/u;
  const glyphs = [...shown].filter((ch) => EMOJI_RE.test(ch));
  ok(glyphs.length === 0,
    `ولا محرفَ إيموجي يُسلَّم لخطّ النظام${glyphs.length ? ` — وُجد: ${glyphs.join(' ')}` : ''}`);
  ok(doc.querySelectorAll('.ui-icon svg').length > 0,
    'ورموزُ الواجهة أيقوناتُنا الخطية (SVG مضمّن)');

  // ————— ٥) لا فائض أفقيّ (METHOD §١٠.٧) —————
  const over = doc.documentElement.scrollWidth - win.innerWidth;
  ok(over <= 0, `لا فائضَ أفقيّ في الخريطة (${over}px)`);

  // ————— ٦) هدفُ اللمس ≥ ٦٤ بكسل (METHOD §١١ — جمهورُنا من الرابعة) —————
  const small = [...doc.querySelectorAll('button, a.btn, label.btn')]
    .filter((el) => el.offsetParent !== null)
    .map((el) => ({ el, r: el.getBoundingClientRect() }))
    .filter(({ r }) => r.width > 0 && (r.height < 44 || Math.min(r.width, r.height) < 40));
  ok(small.length === 0,
    `وكلُّ زرٍّ ظاهرٍ يبلغ هدفَ اللمس${small.length
      ? ` — أصغرُها: ${small.map(({ el, r }) => `${el.className.split(' ')[0]} ${Math.round(r.width)}×${Math.round(r.height)}`).slice(0, 3).join('، ')}` : ''}`);

  // ————— ٧) الرحلةُ فارغةٌ اليوم — ويُقال ذلك صريحاً (الجلسة ٠) —————
  // **حارسُ الغياب**: خريطةٌ فارغةٌ صامتة تُقرأ عطباً. فإن كانت الرحلة صفراً وجب
  // أن تقول ذلك؛ وإن صارت لها محطاتٌ (الجلسة ١) وجب أن تختفي الرسالةُ وتظهرَ هي.
  const stations = doc.querySelectorAll('.station').length;
  const empty = doc.querySelector('.note--empty');
  ok(stations > 0 ? !empty : !!empty,
    stations > 0
      ? `الرحلةُ فيها ${stations} محطةً ولا رسالةَ فراغ`
      : 'الرحلةُ فارغةٌ والخريطةُ تقول ذلك صريحاً (لا صمتَ يُقرأ عطباً)');

  // ————— ٨) لوحةُ وليّ الأمر خلف بوابتها الحسابية —————
  win.location.hash = '#/parent';
  await new Promise((r) => setTimeout(r, 500));
  ok(doc.querySelector('.gate .giant'), 'ولوحةُ وليّ الأمر خلف بوابةٍ حسابية');
  ok(!doc.querySelector('.audit'), 'ولا تُعرَض اللوحةُ قبل حلّها');

  /* **وسطرُ الأصوات المخزونة خلفها** (الجلسة ص): تُحَلّ البوابةُ بقراءة ضربها من
     الشاشة نفسِها — فيَظهر ما وراءها. وعلّةُ الفحص أنّ اللوحة صارت تقرأ من مخزن
     عامل الخدمة، وشيفرةٌ تُقرأ ولا تُشغَّل قد تسقط عند أول عرض. */
  const arDigits = (s) => Number([...String(s)].map((c) => {
    const i = '٠١٢٣٤٥٦٧٨٩'.indexOf(c);
    return i < 0 ? c : String(i);
  }).join('').replace(/[^0-9]/g, ''));
  const [ga, gb] = (doc.querySelector('.gate .giant')?.textContent || '').split('×');
  const gateInput = doc.querySelector('.gate input');
  if (gateInput) {
    gateInput.value = String(arDigits(ga) * arDigits(gb));
    doc.querySelector('.gate-go')?.click();
    await new Promise((r) => setTimeout(r, 400));
  }
  const audit = doc.querySelector('.audit');
  ok(!!audit, 'وتُفتح بحلّ ضربها فتظهر اللوحة');
  const dl = doc.querySelector('.dl');
  ok(!!dl, 'وفيها سطرُ خزن الأصوات بشريطه وزرِّه (فلا يفاجئ وليَّ الأمر صمتٌ لا يعرف سببه)');
  ok(!dl || !!dl.querySelector('.dl-bar .dl-fill'), 'والشريطُ مبنيٌّ بمِلئه');

  /* ————— ٩) مصيِّر الكميات **على الشاشة نفسِها** (METHOD §١٠.٢ — الجلسة ٢) —————

     أخو `tools/check_render.mjs`: ذاك يقرأ الهندسةَ أعداداً في node، وهذا يقرأ
     **الرسمَ بعد أن يقع** — بلوح التطبيق وخطوطه واتجاهه ومقاساته المحسوبة. فما
     يفوت الحسابَ (تنسيقٌ يقلب، صورةٌ لا تُحمَّل، شكلٌ ينسحق) يمسكه القياسُ هنا.
     ولوحُ المصيِّر تحت `?dev=1` وحدَه، فلا طريقَ إليه من شاشة طفل. */

  frame.src = '/?dev=1#/render/all';
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  hookAudio(frame.contentWindow);
  await new Promise((r) => setTimeout(r, 1800));

  const gdoc = frame.contentDocument;
  const gwin = frame.contentWindow;
  const figures = [...gdoc.querySelectorAll('.figure')];
  const kinds = new Set(figures.map((f) => f.dataset.display));
  ok(figures.length > 0 && kinds.size > 0,
    `لوحُ المصيِّر يرسم ${figures.length} شكلاً في ${kinds.size} نمطاً (${[...kinds].join('، ')})`);

  const rectOf = (el) => el.getBoundingClientRect();
  const centre = (r) => ({ x: (r.left + r.right) / 2, y: (r.top + r.bottom) / 2 });
  const apart = (a, b) => a.right <= b.left || b.right <= a.left
    || a.bottom <= b.top || b.bottom <= a.top;

  /* أ) **المرسومُ هو المقصود** — ثلاثةُ مصادر تتطابق: المقصودُ في البيانات، وما أعلن
        المصيِّر أنه رسم، وما في DOM فعلاً. واختلافُ أيِّها عن الآخر عطب.

        **ولكلِّ صنفٍ مسطرتُه** (`data-kind`، الجلسة ٤): الكمُّ تُعَدّ عناصرُه، والرمزُ
        **يُقرأ نصُّه هنا قراءةً مستقلّة** عن `arNum` في التطبيق (جدولٌ في هذه الصفحة)،
        والخطُّ تُعَدّ علاماتُه. فرمزٌ يُكتب خطأً يُمسَك بالقراءة لا بالتصديق. */
  const readDrawn = {
    quantity: (f) => f.querySelectorAll('[data-mark]').length,
    numeral: (f) => arDigits(f.querySelector('[data-numeral]')?.textContent ?? ''),
    line: (f) => f.querySelectorAll('[data-tick]').length - 1,
    // **ولكلِّ صنفٍ جديدٍ مسطرتُه** (الجلسة ٧): الشريطُ تُعَدّ خاناتُه — وخانةُ السؤال
    // منها — والمشهدُ تُعَدّ أشياؤه، وكلاهما يُقرأ هنا **مستقلاً** عن المصيِّر.
    pattern: (f) => f.querySelectorAll('[data-cell]').length,
    scene: (f) => f.querySelectorAll('[data-item]').length,
  };
  const miscount = figures.filter((f) => {
    const want = Number(f.dataset.count);
    const said = Number(f.dataset.drawn);
    const reader = readDrawn[f.dataset.kind];
    return !reader || !(want === said && said === reader(f));
  });
  ok(miscount.length === 0,
    `والمرسومُ هو المقصود في كل شكل (المقصود = ما أعلن المصيِّر = ما في DOM)`
    + (miscount.length ? ` — اختلف في: ${miscount.slice(0, 3)
      .map((f) => `${f.dataset.display}/${f.dataset.count}`).join('، ')}` : ''));

  /* أ٢) **خطُّ الأعداد يتصاعد إلى اليسار** — والصفرُ يمنة (`METHOD.md §٣`: جهةُ ملء
        الإطار نفسُها). **ويُقاس بعد التنسيق**: `check_render.mjs` يقرأ الهندسة، وتنسيقٌ
        يقلب الشكل (`scaleX`) أو اتجاهٌ يعكسه تعمى عنه الهندسةُ ويمسكه القياسُ هنا. */
  const rails = figures.filter((f) => f.dataset.display === 'line');
  const flipped = rails.filter((f) => {
    const ticks = [...f.querySelectorAll('[data-tick]')]
      .map((t) => ({ v: Number(t.dataset.value), x: centre(rectOf(t)).x }))
      .sort((a, b) => a.v - b.v);
    return ticks.some((t, i) => i && t.x >= ticks[i - 1].x - 0.5);
  });
  ok(rails.length > 0 && flipped.length === 0,
    `وخطوطُ الأعداد كلُّها تبدأ من اليمين وتتصاعد يساراً (${rails.length} خطّاً مقيساً`
    + `، أطولُها ${rails.length ? Math.max(...rails.map((f) => Number(f.dataset.drawn))) : 0} علامةَ مدى)`
    + (flipped.length ? ` — انقلب في: ${flipped.length}` : ''));

  // ب) **لا تراكب مقيساً بعد التنسيق**: صندوقا عنصرين لا يتلامسان — والبرهانُ
  //    الهندسيّ يضمن انفصالَهما في أحد المحورين، فتلامسُ الصندوقين وحدَه كافٍ حكماً.
  let pairs = 0;
  const overlap = figures.filter((f) => {
    const boxes = [...f.querySelectorAll('[data-mark]')].map(rectOf);
    for (let i = 0; i < boxes.length; i++) {
      for (let j = i + 1; j < boxes.length; j++) {
        pairs++;
        if (!apart(boxes[i], boxes[j])) return true;
      }
    }
    return false;
  });
  ok(overlap.length === 0,
    `ولا عنصرين متراكبين في أيّ شكل (${pairs} مقابلةً مقيسة على الشاشة)`
    + (overlap.length ? ` — تراكبَ في: ${overlap.slice(0, 3)
      .map((f) => `${f.dataset.display}/${f.dataset.count}`).join('، ')}` : ''));

  // ج) **الإطاراتُ تُملأ من اليمين** — يُعاد اشتقاقُ الترتيب من المقاسات المرئية:
  //    الإطارُ الأيمنُ أولاً، ثم الصفُّ الأعلى، ثم الخانةُ اليمنى. فتنسيقٌ يقلب
  //    الاتجاه (أو `scaleX`) يسقط هنا ولو كانت الهندسةُ سليمةً في node.
  const framed = figures.filter((f) => f.querySelector('[data-cell]'));
  const wrongFill = framed.filter((f) => {
    const boxes = [...f.querySelectorAll('.fig-frame')].map(rectOf)
      .sort((a, b) => b.left - a.left);
    const rank = (c) => Math.max(0, boxes.findIndex((b) =>
      c.x >= b.left - 1 && c.x <= b.right + 1 && c.y >= b.top - 1 && c.y <= b.bottom + 1));
    const cells = [...f.querySelectorAll('[data-cell]')].map(rectOf).map(centre)
      .sort((a, b) => (rank(a) - rank(b)) || (a.y - b.y) || (b.x - a.x));
    const marks = [...f.querySelectorAll('[data-mark]')].map(rectOf).map(centre);
    const near = (a, b) => Math.abs(a.x - b.x) < 2 && Math.abs(a.y - b.y) < 2;
    return !marks.every((m, i) => cells[i] && near(cells[i], m));
  });
  ok(framed.length > 0 && wrongFill.length === 0,
    `وإطاراتُ الخمسة والعشرة تُملأ من اليمين (${framed.length} إطاراً مقيساً)`
    + (wrongFill.length ? ` — انقلب في: ${wrongFill.slice(0, 3)
      .map((f) => `${f.dataset.display}/${f.dataset.count}`).join('، ')}` : ''));

  // د) **نقاطُ النرد على شبكة ٣×٣ متساوية** بعد التنسيق (القياسيَّةُ نفسُها يُثبتها
  //    `check_render.mjs` بالجدول المستقلّ؛ وهنا يُثبَت أنّ الشبكةَ نجت من الرسم).
  const dice = figures.filter((f) => f.dataset.display === 'dice');
  const skewed = dice.filter((f) => {
    const box = rectOf(f);
    const spots = [...f.querySelectorAll('[data-mark]')].map(rectOf).map(centre);
    const lane = (v, lo, hi) => Math.round(((v - lo) / (hi - lo)) * 100) / 100;
    return !spots.every((s) => [0.22, 0.5, 0.78].some((t) =>
      Math.abs(lane(s.x, box.left, box.right) - t) < 0.03)
      && [0.22, 0.5, 0.78].some((t) => Math.abs(lane(s.y, box.top, box.bottom) - t) < 0.03));
  });
  ok(dice.length === 6 && skewed.length === 0,
    `ووجوهُ النرد الستة على شبكةٍ ٣×٣ متساوية (${dice.length} وجهاً)`);

  // هـ) **صدق الصورة**: كلُّ عنصرٍ معدودٍ صورةُ Twemoji محليةٌ **حُمِّلت فعلاً**، ولا
  //     محرفَ يُسلَّم لخطّ النظام، والكميةُ الواحدة متجانسةٌ رمزاً واحداً.
  const objectFigs = figures.filter((f) => f.dataset.display === 'objects');
  const images = objectFigs.flatMap((f) => [...f.querySelectorAll('[data-mark] img.emoji')]);
  const broken = images.filter((img) => !img.complete || img.naturalWidth === 0);
  const mixed = objectFigs.filter((f) => new Set([...f.querySelectorAll('[data-mark] img.emoji')]
    .map((img) => img.dataset.emoji)).size > 1);
  ok(images.length > 0 && broken.length === 0 && mixed.length === 0,
    `وعناصرُ عالم الطفل صورٌ محليةٌ حُمِّلت (${images.length} صورة، `
    + `${new Set(images.map((i) => i.dataset.emoji)).size} رمزاً)، والكميةُ متجانسة`
    + (broken.length ? ` — لم تُحمَّل ${broken.length}` : '')
    + (mixed.length ? ` — مختلطةٌ في ${mixed.length} شكلاً` : ''));

  // و) وعهودُ الشاشة نفسُها تسري على هذا اللوح: أرقامُ المشرق، ولا إيموجي نظام،
  //    ولا فائضَ أفقيّ — فشكلٌ يفيض عن عرض الصفحة عيبٌ ولو رسم عددَه صحيحاً.
  const gshown = gdoc.body.innerText || '';
  const glatin = [...new Set(gshown.match(/\d/g) || [])];
  const gglyphs = [...gshown].filter((ch) => EMOJI_RE.test(ch));
  ok(glatin.length === 0 && gglyphs.length === 0,
    `ولا رقمَ لاتينيّ ولا محرفَ إيموجي في نصّ اللوح${glatin.length
      ? ` — أرقام: ${glatin.join('، ')}` : ''}${gglyphs.length ? ` — رموز: ${gglyphs.join(' ')}` : ''}`);
  const gover = gdoc.documentElement.scrollWidth - gwin.innerWidth;
  ok(gover <= 0, `ولا فائضَ أفقيّ في لوح المصيِّر (${gover}px)`);

  /* ————— ١٠) شاشاتُ المحطات: المرحلتان ١–٢ (METHOD §٤ — الجلسة ٣) —————

     ثلاثةُ عهودٍ لا يُثبتها إلا متصفّح: **صفرُ رمزٍ عدديّ** على شاشة المرحلة ١،
     و**التناظرُ الفرديّ مفروضٌ بنيوياً** (لمستان على عنصرٍ واحد لا تُحتسبان مرّتين)،
     و**الخطأُ يُعَدّ أمامه ولا ينقل**. وتُساق الشاشاتُ بـ`?preview=1` — يفتح القفلَ
     ولا يكتب تقدّماً، فلا يبقى في الجهاز أثرُ اختبار. */

  const DIGITS = /[0-9٠-٩]/g;
  /* **وسمٌ يميّز كل سَوقة**: إسنادُ `src` يختلف عن سابقه بالمقطع (`#`) وحدَه **لا
     يُطلِق `load`** — ينتقل المستندُ في مكانه فينتظر الفحصُ حدثاً لا يجيء، وتنتهي
     المهلةُ صامتة. فيُزاد وسمٌ في الاستعلام: تحميلٌ كاملٌ في كل مرة. */
  let visit = 0;
  const open = async (hash) => {
    closeOpen();           // مستندٌ يُغادَر: ما كان يعمل فيه انتهى بمغادرته
    frame.src = `/?preview=1&v=${++visit}${hash}`;
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    hookAudio(frame.contentWindow);
    await new Promise((r) => setTimeout(r, 900));
    return frame.contentDocument;
  };
  const until = async (doc, test, ms = 9000) => {
    for (let waited = 0; waited < ms; waited += 120) {
      const found = test(doc);
      if (found) return found;
      await new Promise((r) => setTimeout(r, 120));
    }
    return null;
  };
  const shownIn = (el) => (el ? el.innerText || '' : '');
  const drawnOf = (el) => Number(el.querySelector('.figure')?.dataset.drawn);
  const beadNow = (doc) => [...doc.querySelectorAll('.bead')].findIndex((b) => b.classList.contains('bead--now'));

  // ————— أ) «كم ترى؟» ١–٢ — أوّلُ محطةٍ في الرحلة —————
  let sdoc = await open('#/subitize/two');
  const card1 = sdoc.querySelector('main.screen-card');
  ok(sdoc.querySelector('.station-screen') && sdoc.querySelectorAll('.step').length === 3,
    `محطةُ «كم ترى؟» تفتح بحلقتها الثلاثية (${[...sdoc.querySelectorAll('.step-name')]
      .map((s) => s.textContent).join(' ← ') || 'لا خطوات'})`);

  // **صفرُ رمزٍ عدديّ في المرحلة ١** — لا مشرقيّ ولا لاتينيّ، لا في خطوةٍ ولا عدّاد
  const digits1 = [...new Set(shownIn(card1).match(DIGITS) || [])];
  ok(digits1.length === 0,
    `ولا رمزَ عدديّ واحد على شاشتها (المرحلة ١: كمياتٌ وأصواتٌ فقط)`
    + (digits1.length ? ` — وُجد: ${digits1.join('، ')}` : ''));

  // خطوةُ «شاهِد»: تُعَدّ الكميةُ أمامه عنصراً عنصراً ثم يظهر «تابع»
  const counted = await until(sdoc, (d) => d.querySelectorAll('.q-stage .is-counted').length || null);
  ok(counted > 0, `وخطوةُ «شاهِدْ» تَعُدُّ الكميةَ أمامه (${counted || 0} عنصراً مُعلَّماً)`);
  const goOn = await until(sdoc, (d) => d.querySelector('.next'));
  goOn?.click();

  // «جرِّب معي»: بطاقاتُ **كمٍّ** لا أرقام
  const cards = await until(sdoc, (d) => (d.querySelectorAll('.qcard').length ? [...d.querySelectorAll('.qcard')] : null));
  ok(cards && cards.length >= 2 && cards.every((c) => c.querySelector('.figure [data-mark]')),
    `والجوابُ بطاقاتُ كمّ لا رمز (${cards ? cards.length : 0} بطاقة، كلٌّ فيها كميةٌ مرسومة)`);
  const digits2 = [...new Set(shownIn(sdoc.querySelector('main.screen-card')).match(DIGITS) || [])];
  ok(digits2.length === 0,
    `ولا رقمَ على بطاقةٍ ولا تحتها${digits2.length ? ` — وُجد: ${digits2.join('، ')}` : ''}`);

  /* **والغطاءُ مرفوعٌ في «جرِّب معي» — رفعاً مقيساً لا معلَناً** (عيبٌ وُجد في الجلسة
     ص): `hidden` وعدٌ من اللغة تنقضه بصمتٍ كلُّ قاعدةِ `display` من أصلِنا (قواعدُ
     المتصفّح أدنى في التتالي مهما ضعفت نوعيّتُنا). فكانت الشاشةُ ترفع الغطاءَ برمجياً
     وهو يبقى مرسوماً — ٢٤٢ بكسل فوق كميةٍ ارتفاعُها ٢٣٠ — فلا يرى الطفلُ الكميةَ التي
     يُطالَب بمطابقتها، لا هنا ولا في العدّ أمامه بعد الخطأ. **ولا يكشفه إلا القياسُ
     بعد التنسيق**: فحصٌ يقرأ `el.hidden` يصدّق الوعدَ ولا يقيس الرسم. */
  const guidedCover = sdoc.querySelector('.q-cover');
  const coverShown = guidedCover
    && sdoc.defaultView.getComputedStyle(guidedCover).display !== 'none';
  ok(!!guidedCover && guidedCover.hidden && !coverShown,
    `والكميةُ مكشوفةٌ في «جرِّب معي»: الغطاءُ مرفوعٌ برمجياً (${guidedCover?.hidden}) `
    + `**وغيرُ مرسومٍ على الشاشة** (${guidedCover
      ? sdoc.defaultView.getComputedStyle(guidedCover).display : 'لا غطاء'})`);

  // **الخطأ لا ينقل، وتُعَدّ الكميةُ أمامه** (METHOD §٤)
  const want = drawnOf(sdoc.querySelector('.q-stage'));
  const right = cards.find((c) => drawnOf(c) === want);
  const wrong = cards.find((c) => c !== right);
  const beadBefore = beadNow(sdoc);
  wrong?.click();
  const marked = await until(sdoc, (d) => d.querySelectorAll('.q-stage .is-counted').length >= want || null);
  ok(marked && beadNow(sdoc) === beadBefore,
    'والخيارُ الخاطئ لا ينقل — تُعَدّ الكميةُ أمامه عنصراً عنصراً ثم يحاول ثانية');

  // الصواب ينقل — وبعد جولتَي العون تبدأ «وحدك» بالخطف
  await until(sdoc, (d) => !d.querySelector('.qcard.bad'));
  right?.click();
  const cards2 = await until(sdoc, (d) => (beadNow(d) === 1 ? [...d.querySelectorAll('.qcard')] : null));
  ok(cards2 && cards2.length > 0, 'والصوابُ ينقل إلى الجولة التالية');
  const want2 = drawnOf(sdoc.querySelector('.q-stage'));
  cards2?.find((c) => drawnOf(c) === want2)?.click();

  /* **الخطفُ طبيعةُ تمرينٍ لا مؤقّتُ ضغط** (METHOD §٢.٧): تُغطّى الكميةُ بعد لحظة،
     ومعها زرُّ إعادةٍ **بلا حدٍّ ولا احتساب** — ولا عدّادَ ينزل ولا شريطَ يفرغ. */
  const cover = await until(sdoc, (d) => {
    const c = d.querySelector('.q-cover');
    return c && !c.hidden ? c : null;
  });
  const replay = [...sdoc.querySelectorAll('.station-body button')]
    .find((b) => b.textContent.includes('أَعِدِ الْعَرْض'));
  ok(!!cover && !!replay,
    'و«وحدك» تخطف الكميةَ ثم تغطّيها، ومعها زرُّ إعادةِ عرضٍ بلا حدّ');

  // وسَوقُ المحطة إلى آخرها يمرّ بحالاتٍ يُخفي فيها التطبيقُ عناصرَ أخرى — فيُجرَد
  // كلُّ مخفيٍّ بعد التنسيق، لا الغطاءُ وحدَه.
  const painted = [...sdoc.querySelectorAll('[hidden]')]
    .filter((el) => sdoc.defaultView.getComputedStyle(el).display !== 'none');
  ok(painted.length === 0,
    `وما أُخفي برمجياً لا يبقى مرسوماً على الشاشة (${sdoc.querySelectorAll('[hidden]').length} عنصراً مخفياً)`
    + (painted.length ? ` — **مرسومٌ رغم إخفائه: ${painted.slice(0, 3)
      .map((el) => `${el.className.split(' ')[0]}=${sdoc.defaultView.getComputedStyle(el).display}`).join('، ')}**` : ''));
  ok(!sdoc.querySelector('progress, .countdown, .timer'),
    'ولا عدّادَ ينزل ولا شريطَ يفرغ (لا مؤقّتَ ضغطٍ في التطبيق)');

  /* **قابليةُ الاجتياز تُثبَت بالاجتياز لا بالدعوى** (معيارُ قبول الجلسة ٣): تُساق
     المحطةُ إلى آخرها لمساً — شاهِدْ ثم جرِّبْ معي ثم وحدك — ويُقابَل الجوابُ بما رسمه
     المصيِّرُ في كل جولة، حتى يقع الاحتفالُ وتُكتب النجمة. فلو تعلّقت حلقةٌ في موضعٍ
     ما بقي الطفلُ فيه، ظهر ذلك هنا لا في جهازه. */
  for (let step = 0; step < 40 && !sdoc.querySelector('.celebrate'); step++) {
    const cardsNow = [...sdoc.querySelectorAll('.qcard')];
    const stageNow = sdoc.querySelector('.q-stage');
    const onward = sdoc.querySelector('.station-body .next');
    if (cardsNow.length && stageNow) {
      cardsNow.find((c) => drawnOf(c) === drawnOf(stageNow))?.click();
    } else if (onward) {
      onward.click();
    }
    await new Promise((r) => setTimeout(r, 520));
  }
  const stars = sdoc.querySelectorAll('.big-stars .on').length;
  ok(!!sdoc.querySelector('.celebrate') && stars > 0,
    `والمحطةُ تُجتاز كاملةً لمساً حتى الاحتفال والنجوم (${stars} نجمة)`);
  ok(sdoc.querySelector('.step--done') && !sdoc.querySelector('.step--now'),
    'وخطواتُ الحلقة الثلاث كلُّها مُنجَزة عند الختام');

  // ————— ب) «المس وعُدّ» — التناظرُ الفرديّ مفروضٌ بنيوياً —————
  sdoc = await open('#/count/three');
  const digits3 = [...new Set(shownIn(sdoc.querySelector('main.screen-card')).match(DIGITS) || [])];
  ok(digits3.length === 0,
    `ومحطةُ «المس وعُدّ» بلا رمزٍ عدديّ كذلك (المرحلة ٢ قبل الرموز)`
    + (digits3.length ? ` — وُجد: ${digits3.join('، ')}` : ''));

  await until(sdoc, (d) => d.querySelector('.next'));
  sdoc.querySelector('.next')?.click();

  const taps = await until(sdoc, (d) => (d.querySelectorAll('.fig-tap').length
    ? [...d.querySelectorAll('.fig-tap')] : null));
  const marks = sdoc.querySelectorAll('.q-touch [data-mark]').length;
  ok(taps && taps.length === marks && marks > 0,
    `ولكلِّ عنصرٍ مرسومٍ هدفُ لمسٍ واحد (${taps ? taps.length : 0} زرّاً لِـ${marks} عنصراً)`);

  const tiny = (taps || []).map((t) => t.getBoundingClientRect())
    .filter((r) => Math.min(r.width, r.height) < 40);
  ok(tiny.length === 0,
    `وكلُّ عنصرٍ يُعَدّ يبلغ هدفَ اللمس (أصغرُها ${(taps || []).length
      ? Math.round(Math.min(...taps.map((t) => t.getBoundingClientRect().width))) : 0}px)`);

  // **لمستان على عنصرٍ واحد لا تُحتسبان مرّتين** — امتناعٌ في البنية لا تحقّقٌ بعده
  taps[0].click();
  taps[0].click();
  await new Promise((r) => setTimeout(r, 200));
  const once = sdoc.querySelectorAll('.fig-tap[disabled]').length;
  ok(once === 1 && taps[0].disabled,
    `والتناظرُ الفرديّ مفروضٌ بنيوياً: لمستان على عنصرٍ واحد عَدَّتاه مرّةً (${once})`);

  // إتمامُ العدّ ← سؤالُ **العدديّة** بجوابٍ كمّيّ لا رمزيّ
  for (const tap of taps.slice(1)) tap.click();
  const answer = await until(sdoc, (d) => (d.querySelectorAll('.qcard').length
    ? [...d.querySelectorAll('.qcard')] : null));
  ok(answer && answer.length >= 2 && answer.every((c) => c.querySelector('.figure [data-mark]')),
    `وبعد العدّ يُسأل «كم صارت كلها؟» وجوابُه بطاقةُ كمّ (${answer ? answer.length : 0} بطاقة)`);

  /* ————— ١١) شاشاتُ المرحلتين ٣–٤: الرمزُ والمقارنة (الجلسة ٤) —————

     أربعةُ عهودٍ لا يُثبتها إلا متصفّح:
       • **الرمزُ لا يُكشَف إلا بعد العدّ** — ترتيبُ خطوتَي «شاهِدْ» هو الدرسُ نفسُه.
       • **طرفا المطابقة يلتقيان على عددٍ واحد** مقروءٍ من الرسم: بطاقةُ الرمز رقمُها
         من نصّها، وبطاقةُ الكمّية عددُ عناصرها من الـDOM.
       • **خانةُ الخطّ تبلغ هدفَ اللمس** بعد التنسيق (لا بالحساب وحدَه).
       • **الخطأُ لا ينقل**: على الخطّ يُعَدّ عليه من الصفر، وفي المقارنة تُكشَف
         الكميّتان صفّين متحاذيين وتُعَدّان. */

  const numOf = (el) => (el ? Number(el.querySelector('.figure')?.dataset.drawn) : NaN);
  const cardsOf = (d) => [...d.querySelectorAll(
    '.q-choices .qcard, .q-rack .qcard, .q-pair .qcard')];
  /* **ومهلةُ خطوة «شاهِدْ» أوسع**: النمذجةُ تَعُدّ كميّتين عنصراً عنصراً بصوتٍ، فهي
     ثوانٍ بحسابها لا تعلّقاً — والانتظارُ لها انتظارُ درسٍ يقع. */
  const onward = (d) => until(d, (x) => x.querySelector('.station-body .next'), 22000);
  const askOf = (d) => (d.querySelector('.station-body h2')?.textContent || '');

  /** جوابُ الجولة الجارية — **مقروءٌ من الشاشة**: السؤالُ والأرقامُ المرسومة. */
  const answerOf = (d) => {
    const ask = askOf(d);
    const subject = numOf(d.querySelector('.q-stage'));
    /* **لوحُ الجسر** (المرحلة ٥): لا جوابَ واحدٌ يُطابَق، بل **ما بقي** من الكلّ —
       يُقرأ من اللوح نفسِه (`data-need` محسوبٌ من المرسوم)، وتُملأ الخانةُ الأخيرة
       بما يُتمّه بالضبط. وبطاقةٌ معطَّلة لا تُلمَس (التجاوزُ ممتنعٌ بنيوياً). */
    /* **لوحُ العملية** (المرحلة ٦): جوابُه عددٌ **محسوبٌ من المرسوم** يعلنه اللوحُ
       نفسُه (`data-answer` — مجموعُ ما رُسِم، أو ما لم يُشطَب منه، أو فرقُ الصفّين)،
       فتُختار البطاقةُ التي **رسمت** ذلك العدد. */
    /* **ولوحُ النمط جوابُه رمزُ عالم الطفل لا عدد** (الجلسة ٧): تُعلن الشاشةُ ما
       قرأته من الشريط المرسوم (`data-answer`)، فتُلمَس البطاقةُ التي **رسمت** ذلك
       الرمز — لا التي طُلب منها رسمُه. */
    const strip = d.querySelector('.q-solve--pattern');
    if (strip) {
      const want = strip.dataset.answer;
      return cardsOf(d).find((c) => c.querySelector('img.emoji')?.dataset.emoji === want);
    }
    /* **ومشهدُ القياس يُلمَس فيه الشيءُ نفسُه**: اللوحُ يعلن **مقدارَ** المطلوب مقروءاً
       من الرسم، فيُلمَس الزرُّ الذي يسكن ذلك المقدار. */
    const scene = d.querySelector('.q-solve--measure');
    if (scene) {
      const want = scene.dataset.answer;
      return [...d.querySelectorAll('.q-pickspot')]
        .find((s) => s.dataset.size === want && !s.disabled);
    }
    const solve = d.querySelector('.q-solve');
    if (solve) {
      const want = Number(solve.dataset.answer);
      return cardsOf(d).find((c) => Number(c.querySelector('.figure')?.dataset.drawn) === want);
    }
    const bond = d.querySelector('.q-bond');
    if (bond) {
      const need = Number(bond.dataset.need);
      const left = Number(bond.dataset.slots);
      const free = cardsOf(d).filter((c) => !c.disabled);
      const worth = (c) => Number(c.querySelector('.figure')?.dataset.drawn);
      if (left <= 1) return free.find((c) => worth(c) === need) || free[0];
      /* **خانتان: يُختار جزءٌ يبقى له مكمِّلٌ في الحوض** — وإلّا وضع السائقُ جزءاً
         لا يُتمّه شيء، فانسدّت عليه الجولة. (وهو ما يفعله الطفلُ المصيب: ينظر إلى
         ما بقي قبل أن يضع.) وفي المرحلة ٧ هذا هو **بناءُ الحزمة والآحاد** بعينه. */
      const fit = free.find((a) => free.some((b) => b !== a && worth(a) + worth(b) === need));
      return fit || free.find((c) => worth(c) < need) || free[0];
    }
    const slots = [...d.querySelectorAll('.fig-slot')];
    if (slots.length) return slots.find((s) => Number(s.dataset.value) === subject);
    const cards = cardsOf(d).filter((c) => !c.disabled);
    if (!cards.length) return d.querySelector('.station-body .next');
    const value = (c) => Number(c.querySelector('.figure')?.dataset.drawn);
    // **الترتيبُ أولاً**: نصُّه يذكر «الأصغر» و«الأكبر» معاً، فلو قُدِّمت المقارنةُ
    // عليه لأُخذ الأكبرُ في سؤالِ ترتيبٍ يبدأ من الأصغر — والخطأُ في الفحص أخطرُ.
    if (ask.includes('رَتِّبْ')) return cards.reduce((a, b) => (value(a) <= value(b) ? a : b));
    if (ask.includes('أَكْبَر')) return cards.reduce((a, b) => (value(a) >= value(b) ? a : b));
    if (ask.includes('أَصْغَر')) return cards.reduce((a, b) => (value(a) <= value(b) ? a : b));
    if (ask.includes('بَعْدَهُ')) return cards.find((c) => value(c) === subject + 1);
    if (ask.includes('قَبْلَهُ')) return cards.find((c) => value(c) === subject - 1);
    return cards.find((c) => value(c) === subject);
  };

  /** سَوقُ محطةٍ إلى آخرها لمساً — والجوابُ في كل جولةٍ من المرسوم. */
  const play = async (d, steps = 60) => {
    for (let i = 0; i < steps && !d.querySelector('.celebrate'); i++) {
      (answerOf(d) || d.querySelector('.station-body .next'))?.click();
      await new Promise((r) => setTimeout(r, 480));
    }
    return d.querySelector('.celebrate');
  };

  // ————— أ) «رُمُوزُ ١ ٢ ٣»: الرمزُ بعد العدّ، والمطابقةُ ذهاباً وإياباً —————
  let ndoc = await open('#/numeral/one-three');
  ok(ndoc.querySelectorAll('.step').length === 3 && !!ndoc.querySelector('.q-reveal'),
    'محطةُ «رُمُوزُ ١ ٢ ٣» تفتح بحلقتها، وفيها موضعُ كشف الرمز');

  const revealBox = ndoc.querySelector('.q-reveal');
  const hiddenAtFirst = revealBox.hidden
    && ndoc.defaultView.getComputedStyle(revealBox).display === 'none';
  const countedFirst = await until(ndoc,
    (d) => d.querySelectorAll('.q-stage .is-counted').length || null);
  const revealed = await until(ndoc, (d) => {
    const box = d.querySelector('.q-reveal');
    return box && !box.hidden ? box : null;
  });
  ok(hiddenAtFirst && countedFirst > 0 && !!revealed,
    `و**الرمزُ لا يُكشَف إلا بعد العدّ**: مخفيٌّ ابتداءً (${hiddenAtFirst})، `
    + `ثم عُدَّت الكميةُ (${countedFirst || 0} عنصراً) ثم ظهر`);
  const revealCard = revealed?.querySelector('.figure--numeral');
  ok(revealCard && Number(revealCard.dataset.drawn) === numOf(ndoc.querySelector('.q-stage')),
    `والرمزُ المكشوف هو رقمُ الكمّية المعدودة (${revealCard ? revealCard.dataset.drawn : '؟'})`);

  (await onward(ndoc))?.click();
  const firstCards = await until(ndoc, (d) => (cardsOf(d).length ? cardsOf(d) : null));
  ok(firstCards && firstCards.every((c) => c.querySelector('.figure')),
    `وبطاقاتُ الجواب من المصيِّر كلُّها (${firstCards ? firstCards.length : 0} بطاقة)`);

  // **الخطأُ لا ينقل**: تُعَدّ الكميةُ المعنية أمامه ثم يحاول ثانية
  const rightCard = answerOf(ndoc);
  const wrongCard = firstCards.find((c) => c !== rightCard);
  const beadWas = beadNow(ndoc);
  wrongCard?.click();
  const litUp = await until(ndoc,
    (d) => d.querySelectorAll('.is-counted').length || null, 6000);
  ok(litUp > 0 && beadNow(ndoc) === beadWas,
    'والخيارُ الخاطئ لا ينقل — تُعَدّ الكميةُ المعنية أمامه ثم يحاول ثانية');

  const finished = await play(ndoc);
  const nstars = ndoc.querySelectorAll('.big-stars .on').length;
  ok(!!finished && nstars > 0,
    `ومحطةُ الرموز تُجتاز كاملةً لمساً حتى الاحتفال (${nstars} نجمة)`);

  /* **والاتجاهان كلاهما يقعان**: تُبنى الجولاتُ من الوحدة نفسِها فتُجرَد أنماطُ
     أسئلتها — «أيُّ رمزٍ لها؟» (كمّيةٌ فبطاقاتُ رموز) و«أين هذا العدد؟» (رمزٌ
     فبطاقاتُ كمّيات) — فلو حُفظ اتجاهٌ واحد لم ينفع حفظُه. */
  const asks = new Set();
  ndoc = await open('#/numeral/fix-three');
  (await onward(ndoc))?.click();
  for (let i = 0; i < 8 && !ndoc.querySelector('.celebrate'); i++) {
    asks.add(askOf(ndoc));
    (answerOf(ndoc) || ndoc.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 480));
  }
  ok(asks.size >= 2, `والمطابقةُ ذهاباً وإياباً في المحطة الواحدة (${[...asks].join(' · ')})`);

  // ————— ب) «الصِّفْر»: إطارٌ فارغ لا ساحةٌ خالية —————
  const zdoc = await open('#/numeral/zero');
  const zeroFig = await until(zdoc, (d) => d.querySelector('.q-stage .figure'));
  ok(zeroFig && Number(zeroFig.dataset.drawn) === 0
    && zeroFig.dataset.display.endsWith('-frame')
    && zeroFig.querySelectorAll('[data-cell]').length > 0,
  `ومحطةُ الصفر تعرض **إطاراً فارغاً** خاناتُه مرسومة `
    + `(${zeroFig ? zeroFig.dataset.display : '؟'}، ${zeroFig
      ? zeroFig.querySelectorAll('[data-cell]').length : 0} خانة، صفرُ عنصر)`);

  // ————— ج) «أَيْنَ يَقَع؟»: الخطُّ وخاناتُه —————
  const ldoc = await open('#/line/ten');
  (await onward(ldoc))?.click();
  const rail = await until(ldoc, (d) => d.querySelector('.q-rail .figure'), 15000);
  const ticks = [...(rail?.querySelectorAll('[data-tick]') || [])];
  const labels = [...(rail?.querySelectorAll('.fig-label') || [])].map((t) => t.textContent);
  ok(ticks.length === 11 && labels.join('،') === '٠،٥،١٠',
    `وخطُّ ٠–١٠ إحدى عشرةَ علامة، وأرقامُ المرساة وحدَها (${labels.join('، ') || 'لا شيء'})`);

  const zeroTick = ticks.find((t) => t.dataset.value === '0');
  const tenTick = ticks.find((t) => t.dataset.value === '10');
  ok(zeroTick && tenTick && centre(rectOf(zeroTick)).x > centre(rectOf(tenTick)).x,
    'و**الصفرُ في يمين الخطّ** مقيساً على الشاشة (جهةُ ملء الإطار نفسُها)');

  const spots = [...ldoc.querySelectorAll('.fig-slot')];
  const spotBox = spots.map((s) => s.getBoundingClientRect());
  ok(spots.length === 3 && spotBox.every((r) => r.width >= 40 && r.height >= 44),
    `وخياراتُ الموضع ثلاثٌ متجاورة تبلغ هدفَ اللمس `
    + `(${spotBox.map((r) => `${Math.round(r.width)}×${Math.round(r.height)}`).join('، ') || 'لا خانة'})`);

  const spotWant = numOf(ldoc.querySelector('.q-stage'));
  const badSpot = spots.find((s) => Number(s.dataset.value) !== spotWant);
  const lineBead = beadNow(ldoc);
  badSpot?.click();
  const walked = await until(ldoc,
    (d) => d.querySelectorAll('[data-tick].is-counted').length || null, 12000);
  ok(walked > 0 && beadNow(ldoc) === lineBead,
    `وخطأُ الموضع لا ينقل — **يُعَدّ على الخطّ نفسِه** من الصفر (${walked || 0} علامة)`);

  /* **ولا فائضَ أفقيّ ولا رقمَ لاتينيّ** في أوسع شاشات الرحلة — والخطُّ أوسعُها:
     يُقاس **على نافذته الحيّة** قبل أن تُغادر الشاشةُ إلى غيرها. */
  const wide = ldoc.documentElement.scrollWidth - ldoc.defaultView.innerWidth;
  const latin34 = [...new Set((shownIn(ldoc.querySelector('main.screen-card'))
    .match(/\d/g) || []))];
  ok(wide <= 0 && latin34.length === 0,
    `ولا فائضَ أفقيّ في شاشة الخطّ (${wide}px) ولا رقمَ لاتينيّ فيها`
    + (latin34.length ? ` — وُجد: ${latin34.join('، ')}` : ''));

  // ————— د) «أَيُّهُمَا أَكْبَر؟»: الرجوعُ إلى الكميتين صفّين متحاذيين —————
  const cdoc = await open('#/compare/ten');
  (await onward(cdoc))?.click();
  await until(cdoc, (d) => (cardsOf(d).length ? cardsOf(d) : null));
  const pairCards = cardsOf(cdoc);
  ok(pairCards.length === 2 && pairCards.every((c) => c.querySelector('.figure--numeral')),
    `و«أيُّهما أكبر» بالرمزين لا بالكميتين (${pairCards.length} بطاقةَ رمز)`);

  const rightPick = answerOf(cdoc);
  const wrongPick = pairCards.find((c) => c !== rightPick);
  wrongPick?.click();
  const twoRows = await until(cdoc, (d) => {
    const box = d.querySelector('.q-check');
    return box && !box.hidden ? [...box.querySelectorAll('.figure')] : null;
  }, 6000);
  const aligned = twoRows && twoRows.length === 2
    && Math.abs(rectOf(twoRows[0]).left - rectOf(twoRows[1]).left) < 2
    && rectOf(twoRows[0]).bottom <= rectOf(twoRows[1]).top + 1;
  ok(aligned,
    'وعند الخطأ تُكشَف الكميتان **صفّين متحاذيين** (إطاران متطابقان، أحدهما تحت الآخر)');

  // ————— هـ) «رَتِّبْ» و«السَّابِقُ وَالتَّالِي» —————
  const odoc = await open('#/order/ten');
  (await onward(odoc))?.click();
  const rack = await until(odoc, (d) => (cardsOf(d).length ? cardsOf(d) : null), 15000);
  const rackValues = (rack || []).map((c) => Number(c.querySelector('.figure').dataset.drawn));
  answerOf(odoc)?.click();
  await new Promise((r) => setTimeout(r, 500));
  const tray = [...odoc.querySelectorAll('.q-tray .q-slot')].map((s) => arDigits(s.textContent));
  ok(rack.length >= 3 && tray.length === 1 && tray[0] === Math.min(...rackValues),
    `و«رتِّب» تنقل الأصغرَ أولاً إلى صفّه (بطاقاتٌ: ${rackValues.length}، `
    + `والمنقولُ ${tray[0] ?? '؟'} وأصغرُها ${Math.min(...rackValues)})`);

  const gdoc2 = await open('#/neighbor/ten');
  (await onward(gdoc2))?.click();
  await until(gdoc2, (d) => (cardsOf(d).length ? cardsOf(d) : null));
  const modes = new Set();
  for (let i = 0; i < 6 && !gdoc2.querySelector('.celebrate'); i++) {
    modes.add(askOf(gdoc2));
    (answerOf(gdoc2) || gdoc2.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 480));
  }
  ok(modes.size >= 2,
    `و«السابقُ والتالي» تدور على أوجهها (${[...modes].join(' · ')})`);

  /* ————— ١١ب) المرحلة ٥: ركِّبْ وفكِّكْ — والبوابةُ الأولى (الجلسة ٥) —————

     خمسةُ عهودٍ لا يُثبتها إلا متصفّح:
       • **لا رمزَ عمليةٍ واحد** على شاشات المرحلة كلِّها (`METHOD.md §٣`) — يُجرَد
         النصُّ المعروضُ نفسُه، لا نيّةُ الشيفرة.
       • **الكمّيةُ تنشقّ شقّين بصرياً**: النمذجةُ تَعُدّ كلّاً مقسوماً، ثم تُكشَف
         قسمتُه شكلين مجموعُهما هو الكلّ.
       • **التجاوزُ امتناعٌ في البنية**: بطاقةٌ تزيد على ما بقي لا تُلمَس أصلاً.
       • **الجزءُ يُرَدّ بالإصبع**، والخطأُ يُعَدّ أمامه ولا ينقل.
       • **خاناتُ الإطار الفارغة هي السؤال** في «أصدقاء العشرة». */

  const bdoc = await open('#/bond/four');
  ok(bdoc.querySelectorAll('.step').length === 3,
    `محطةُ «جُسُورُ ٣ وَ٤» تفتح بحلقتها (${[...bdoc.querySelectorAll('.step-name')]
      .map((s) => s.textContent).join(' ← ') || 'لا خطوات'})`);

  // **الشقّان في النمذجة**: الكلُّ مرسومٌ شقّين، ومجموعُهما هو ما رُسِم
  const whole = await until(bdoc, (d) => d.querySelector('.q-stage .figure[data-split]'), 12000);
  const partA = whole ? whole.querySelectorAll('[data-part="a"]').length : 0;
  const partB = whole ? whole.querySelectorAll('[data-part="b"]').length : 0;
  ok(whole && partA > 0 && partB > 0 && partA + partB === Number(whole.dataset.drawn),
    `و**الكمّيةُ تنشقّ شقّين بصرياً**: ${partA} و${partB} من ${whole
      ? whole.dataset.drawn : '؟'} مرسومة (وشقُّها مقروءٌ من الرسم: ${whole
      ? whole.dataset.split : '؟'})`);

  // والشقّان يُكشَفان **بعد** العدّ — كحلقة تقديم الرمز سواءً بسواء
  const splitBox = bdoc.querySelector('.q-reveal');
  const hiddenFirst = splitBox && splitBox.hidden;
  const shownSplit = await until(bdoc, (d) => {
    const box = d.querySelector('.q-reveal');
    return box && !box.hidden ? [...box.querySelectorAll('.figure')] : null;
  }, 22000);
  const bothParts = (shownSplit || []).reduce((n, f) => n + Number(f.dataset.drawn), 0);
  ok(hiddenFirst && shownSplit && shownSplit.length === 2
    && bothParts === Number(whole.dataset.drawn),
  `ويُكشَف الجزآن **بعد العدّ** ومجموعُهما هو الكلّ (${(shownSplit || [])
    .map((f) => f.dataset.drawn).join(' و')} من ${whole ? whole.dataset.drawn : '؟'})`);

  (await onward(bdoc))?.click();
  const bondBoard = await until(bdoc, (d) => d.querySelector('.q-bond'), 12000);
  const bondCards = cardsOf(bdoc);
  const slotEls = [...bdoc.querySelectorAll('.q-slot')];
  ok(!!bondBoard && slotEls.length === 2
    && !!bdoc.querySelector('.q-bond-whole .figure--numeral')
    && bondCards.length >= 2 && bondCards.every((c) => c.querySelector('.figure [data-mark]')),
  `ولوحُ الجسر: الكلُّ بطاقةُ رمزٍ وخانتان و${bondCards.length} بطاقةَ **كمٍّ تُعَدّ** `
    + '(الجسرُ يُبنى بصرياً — `METHOD.md §٢.٥`)');

  // **لا رمزَ عمليةٍ واحد** على الشاشة — لا في سؤالٍ ولا في لوحٍ ولا بين البطاقتين
  const SIGNS = /[+\-−×÷=]/g;
  const bondText = shownIn(bdoc.querySelector('main.screen-card'));
  const signs = [...new Set(bondText.match(SIGNS) || [])];
  ok(signs.length === 0,
    'و**لا رمزَ عمليةٍ واحد على شاشتها** (المرحلة ٥ كلُّها قبل + و−)'
    + (signs.length ? ` — وُجد: ${signs.join('، ')}` : ''));

  // **التجاوزُ امتناعٌ في البنية**: بعد وضع جزءٍ، ما يزيد على ما بقي لا يُلمَس
  const needBefore = Number(bondBoard.dataset.need);
  const worth = (c) => Number(c.querySelector('.figure')?.dataset.drawn);
  const smallest = bondCards.filter((c) => !c.disabled)
    .reduce((a, b) => (worth(a) <= worth(b) ? a : b));
  smallest.click();
  await new Promise((r) => setTimeout(r, 350));
  const remains = Number(bondBoard.dataset.need);
  const spill = cardsOf(bdoc).filter((c) => worth(c) > remains && !c.disabled);
  ok(remains === needBefore - worth(smallest) && spill.length === 0,
    `وبعد وضع جزءٍ يبقى ${remains} من ${needBefore}، و**كلُّ بطاقةٍ تزيد عليه معطَّلة** `
    + `(${spill.length} بطاقةً تتجاوز ولم تُعطَّل)`);

  // **الجزءُ يُرَدّ بالإصبع** (نظيرُ «أعطني ن»): نقرةٌ على الخانة تُفرغها
  const filledSlot = slotEls.find((s) => s.classList.contains('is-full'));
  filledSlot?.click();
  await new Promise((r) => setTimeout(r, 300));
  ok(Number(bondBoard.dataset.need) === needBefore
    && !bdoc.querySelector('.q-slot.is-full'),
  'و**ما وُضع يُرَدّ بلمسةٍ على خانته** — فلا يُحبَس الطفلُ في اختيارٍ لم يقصده');

  // **الخطأُ لا ينقل**: زوجٌ لا يبلغ الكلَّ تُكشَف له كمّيةُ الكلّ فتُعَدّ أمامه
  const bondBead = beadNow(bdoc);
  const wrongPair = cardsOf(bdoc).filter((c) => !c.disabled)
    .sort((a, b) => worth(a) - worth(b));
  wrongPair[0]?.click();
  await new Promise((r) => setTimeout(r, 300));
  const mate = cardsOf(bdoc).filter((c) => !c.disabled)
    .find((c) => worth(c) !== Number(bondBoard.dataset.need));
  mate?.click();
  const lit = await until(bdoc, (d) => {
    const box = d.querySelector('.q-check');
    return box && !box.hidden && d.querySelectorAll('.q-check .is-counted').length
      ? d.querySelectorAll('.q-check .is-counted').length : null;
  }, 14000);
  ok((lit > 0 || !mate) && beadNow(bdoc) === bondBead,
    `والخطأُ لا ينقل — **تُكشَف كمّيةُ الكلّ فتُعَدّ أمامه** (${lit || 0} عنصراً مُعلَّماً)`);

  const bondDone = await play(bdoc, 90);
  const bondStars = bdoc.querySelectorAll('.big-stars .on').length;
  ok(!!bondDone && bondStars > 0,
    `ومحطةُ الجسر تُجتاز كاملةً لمساً حتى الاحتفال (${bondStars} نجمة)`);

  /* ————— ١١ج) 🚪 بوابةُ الكمّ: من أضعف ما في يده، ولا رسوب —————

     **وتُساق من داخل الجلسة نفسِها**: البوابةُ تبني من سجلّ ليتنر، والسجلُّ يمتلئ بما
     لعبه الطفل في هذه الصفحة — فلو فُتحت بصفحةٍ جديدة لَبدأت من فراغ (وضعُ المعاينة
     لا يكتب على القرص). فيُنتقَل إليها **بالمِرساة** لا بتحميلٍ جديد. */

  const bondWin = bdoc.defaultView;
  bondWin.location.hash = '#/gate/quantity';
  await new Promise((r) => setTimeout(r, 1200));
  const gateDots = bdoc.querySelectorAll('.dots .dot').length;
  ok(!!bdoc.querySelector('.gate-head'),
    'بوابةُ «عُبُورُ الكَمّ» **تُرسَم فعلاً** بجلسةٍ من سجلّ ما لعبه الطفل'
    + (bdoc.querySelector('.gate-head') ? '' : ' — لم تُرسَم (وما على الشاشة ما كان قبلها)'));
  /* **وتمارينُها ممّا في يده**: الحصيلةُ هنا محطةٌ واحدة لعبها الطفلُ في هذه الصفحة،
     فدون العشرة بحقّ — و«عشرةٌ» تُثبَت على **سجلٍّ كاملٍ مصنوع** في `tools/test_gate.mjs`
     (طفلٌ أتمّ المراحل الأربع). والمقيسُ هنا أنّها **تُبنى ممّا في يده وتُلعَب**. */
  ok(gateDots > 0 && gateDots <= 10 && !!bdoc.querySelector('.station-body .qcard'),
    `وتمارينُها مبنيّةٌ من مهاراته المسجَّلة (${gateDots} تمريناً، وأوّلُها معروضٌ ببطاقاته)`);

  for (let i = 0; i < 60 && !bdoc.querySelector('.celebrate'); i++) {
    (answerOf(bdoc) || bdoc.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 460));
  }
  const verdict = bdoc.querySelector('.celebrate');
  const opened = verdict && !verdict.classList.contains('celebrate--again');
  ok(!!verdict,
    `وتُجتاز البوابةُ لمساً إلى حكمها (${opened ? 'فُتِحَت' : 'لَيْسَ بَعْدُ'})`);
  // **ولا رسوب**: دونها لا لفظَ رسوبٍ ولا حدَّ للإعادة، ومعها نجومٌ وفتحٌ
  const verdictText = shownIn(verdict);
  ok(!/رسوب|فشل|خطأ/.test(verdictText),
    'ولا لفظَ رسوبٍ في حكمها مهما كانت النتيجة (عهدُ «لا عقاب»)');
  ok(opened
    ? bdoc.querySelectorAll('.big-stars .on').length > 0
    : Boolean([...bdoc.querySelectorAll('.celebrate button')]
      .find((b) => b.textContent.includes('أعِد'))),
  opened
    ? `وبالعبور نجومٌ تُكتب (${bdoc.querySelectorAll('.big-stars .on').length})`
    : 'ودونها إعادةٌ فورية بلا حدٍّ ولا عقاب');

  /* ————— «اِصْنَعِ الخَمْسَةَ بِطَرِيقَتَيْن» (٥·٣): الطريقتان في جولةٍ واحدة —————

     نصُّ `METHOD.md §٣`، ولا يقع بالنيّة: بعد الطريقة الأولى **تُعطَّل قيمتاها** فلا
     سبيلَ إلى إعادتها — امتناعٌ في البنية كأخيه في التجاوز. */
  const wdoc = await open('#/bond/make-five');
  (await onward(wdoc))?.click();
  await until(wdoc, (d) => d.querySelector('.q-bond'), 12000);
  const firstWay = [];
  for (let i = 0; i < 4 && wdoc.querySelectorAll('.q-slot.is-full').length < 2; i++) {
    const card = answerOf(wdoc);
    if (card) firstWay.push(Number(card.querySelector('.figure').dataset.drawn));
    card?.click();
    await new Promise((r) => setTimeout(r, 420));
  }
  const again = await until(wdoc,
    (d) => (askOf(d).includes('أُخْرَى') ? askOf(d) : null), 8000);
  const barred = cardsOf(wdoc).filter((c) => firstWay
    .includes(Number(c.querySelector('.figure').dataset.drawn)));
  ok(!!again && barred.length > 0 && barred.every((c) => c.disabled),
    `و«اِصْنَعْهُ بِطَرِيقَةٍ أُخْرَى» بعد الأولى (${firstWay.join(' و')})، `
    + `**وقيمتاها معطَّلتان** فلا تُعاد الطريقةُ نفسُها (${barred.length} بطاقة)`);

  // ————— «أَصْدِقَاءُ العَشَرَة»: الخاناتُ الفارغة هي السؤال —————
  const fdoc = await open('#/bond/ten');
  (await onward(fdoc))?.click();
  const tenFrame = await until(fdoc, (d) => d.querySelector('.q-bond--frame .figure'), 14000);
  const cellCount = tenFrame ? tenFrame.querySelectorAll('[data-cell]').length : 0;
  const inFrame = tenFrame ? Number(tenFrame.dataset.drawn) : 0;
  const askNeed = Number(fdoc.querySelector('.q-bond').dataset.need);
  ok(cellCount > inFrame && askNeed === cellCount - inFrame,
    `و«أصدقاء العشرة» إطارٌ فيه ${inFrame} من ${cellCount} خانة، **والمطلوبُ ما بقي منها** `
    + `(${askNeed}) — مقروءاً من الرسم لا من عددٍ مكتوب`);

  const restCards = cardsOf(fdoc);
  const badRest = restCards.find((c) => worth(c) !== askNeed);
  const restBead = beadNow(fdoc);
  badRest?.click();
  const litCells = await until(fdoc,
    (d) => d.querySelectorAll('.q-bond--frame [data-cell].is-counted').length || null, 14000);
  ok(litCells > 0 && beadNow(fdoc) === restBead,
    `وخطؤه يُعَدّ عليه: **تُضاء الخاناتُ الفارغةُ واحدةً واحدة** (${litCells || 0} خانة)`);


  /* ————— ١١د) المرحلة ٦: اجمعْ واطرحْ ضمن ١٠ — وبوّابةُ العمليات (الجلسة ٦) —————

     خمسةُ عهودٍ لا يُثبتها إلا متصفّح:
       • **٦·١ بلا علامةٍ البتّة** (`METHOD.md §٣`): يُجرَد النصُّ المعروض نفسُه — لا
         نيّةُ الشيفرة — فالعمليةُ **فعلٌ يُرى** قبل أن تكون سطراً يُقرأ.
       • **كلُّ حقيقةٍ تُعرَض كمّيةً ورمزاً معاً أوّلَ لقاء**: في ٦·١ تُعَدّ الحصيلةُ ثم
         يُكشَف رمزُها، وفي ٦·٢ تقف الجملةُ الرمزية **وكمّيتُها تحتها في لحظةٍ واحدة**،
         ومجموعُ ما رُسِم هو مجموعُ رمزَي الجملة.
       • **ثم بالرمز وحدَه والكمّيةُ عوناً عند النقر** في «وحدك».
       • **الإزالةُ مرئية** في الطرح (ما غادر مشطوبٌ، والباقي هو المرسوم غيرَ المشطوب).
       • **الفرقُ صفّان متحاذيان** والفائضُ في الأعلى هو الجواب. */

  // ————— أ) «آلَةُ الجَمْع» (٦·١): كميتان تلتقيان، ولا علامة —————
  const mdoc = await open('#/add/machine');
  ok(mdoc.querySelectorAll('.step').length === 3,
    `محطةُ «آلَةُ الجَمْع» تفتح بحلقتها (${[...mdoc.querySelectorAll('.step-name')]
      .map((s) => s.textContent).join(' ← ') || 'لا خطوات'})`);

  const joined = await until(mdoc, (d) => d.querySelector('.q-stage .figure[data-split]'), 14000);
  const joinA = joined ? joined.querySelectorAll('[data-part="a"]').length : 0;
  const joinB = joined ? joined.querySelectorAll('[data-part="b"]').length : 0;
  ok(joined && joinA > 0 && joinB > 0 && joinA + joinB === Number(joined.dataset.drawn),
    `و**الحصيلةُ ترى مجموعَيها**: ${joinA} و${joinB} من ${joined
      ? joined.dataset.drawn : '؟'} مرسومة — الجمعُ تركيبُ معلومٍ لا طقسٌ رمزيّ`);

  const sumNumeral = await until(mdoc, (d) => {
    const box = d.querySelector('.q-reveal');
    return box && !box.hidden ? box.querySelector('.figure--numeral') : null;
  }, 22000);
  ok(sumNumeral && Number(sumNumeral.dataset.drawn) === Number(joined.dataset.drawn),
    `و**بعد عدّ الحصيلة يُكشَف رمزُها** — الكمّيةُ والرمزُ معاً في أوّل لقاء `
    + `(${sumNumeral ? sumNumeral.dataset.drawn : '؟'})`);

  (await onward(mdoc))?.click();
  const meetBoard = await until(mdoc, (d) => d.querySelector('.q-solve'), 12000);
  ok(!!meetBoard && !mdoc.querySelector('.q-sentence') && !!mdoc.querySelector('.q-meet'),
    'ولوحُها **كميتان تلتقيان** بلا جملةٍ رمزية (`.q-meet` ولا `.q-sentence`)');

  const machineText = shownIn(mdoc.querySelector('main.screen-card'));
  const machineSigns = [...new Set(machineText.match(SIGNS) || [])];
  ok(machineSigns.length === 0,
    'و**لا رمزَ عمليةٍ واحد على شاشتها** — الرمزُ في التالية تسميةٌ لِما فُعِل هنا'
    + (machineSigns.length ? ` — وُجد: ${machineSigns.join('، ')}` : ''));

  // **الخطأُ لا ينقل**: تُكشَف الحصيلةُ فتُعَدّ تصاعدياً من الأكبر (`METHOD.md §٣` ٦·٤)
  const machineBead = beadNow(mdoc);
  const machineRight = answerOf(mdoc);
  cardsOf(mdoc).find((c) => c !== machineRight)?.click();
  const litSum = await until(mdoc,
    (d) => d.querySelectorAll('.q-fact [data-mark].is-counted').length || null, 14000);
  ok(litSum > 0 && beadNow(mdoc) === machineBead,
    `والخيارُ الخاطئ لا ينقل — **تُعَدُّ الحصيلةُ أمامه** (${litSum || 0} عنصراً مُعلَّماً)`);

  const machineDone = await play(mdoc, 90);
  const machineStars = mdoc.querySelectorAll('.big-stars .on').length;
  ok(!!machineDone && machineStars > 0,
    `ومحطةُ آلة الجمع تُجتاز كاملةً لمساً حتى الاحتفال (${machineStars} نجمة)`);

  /* ————— ب) 🚪 بوابةُ العمليات: من مدَاها المعلَن، وتُلعَب —————
     **وتُساق من داخل الجلسة نفسِها** كأختها: السجلُّ يمتلئ بما لعبه الطفلُ في هذه
     الصفحة (وضعُ المعاينة لا يكتب على القرص)، فيُنتقَل بالمِرساة لا بتحميلٍ جديد.
     و«من أضعف مهارات المرحلتين ٥–٦» يُثبَت على **سجلٍّ كاملٍ مصنوع** في
     `tools/test_gate.mjs`؛ والمقيسُ هنا أنّها **تُرسَم من حصيلته وتُلعَب إلى حكمها**. */
  mdoc.defaultView.location.hash = '#/gate/ops';
  await new Promise((r) => setTimeout(r, 1300));
  const opsDots = mdoc.querySelectorAll('.dots .dot').length;
  ok(!!mdoc.querySelector('.gate-head'),
    'بوابةُ «عُبُورُ العَمَلِيَّات» **تُرسَم فعلاً** بجلسةٍ من سجلّ ما لعبه الطفل'
    + (mdoc.querySelector('.gate-head') ? '' : ' — لم تُرسَم (وما على الشاشة ما كان قبلها)'));
  ok(opsDots > 0 && opsDots <= 10 && !!mdoc.querySelector('.station-body .qcard'),
    `وتمارينُها مبنيّةٌ من مهاراته المسجَّلة (${opsDots} تمريناً، وأوّلُها معروضٌ ببطاقاته)`);

  for (let i = 0; i < 60 && !mdoc.querySelector('.celebrate'); i++) {
    (answerOf(mdoc) || mdoc.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 460));
  }
  const opsVerdict = mdoc.querySelector('.celebrate');
  ok(!!opsVerdict && !/رسوب|فشل|خطأ/.test(shownIn(opsVerdict)),
    `وتُجتاز إلى حكمها بلا لفظ رسوب (${opsVerdict
      && !opsVerdict.classList.contains('celebrate--again') ? 'فُتِحَت' : 'لَيْسَ بَعْدُ'})`);

  // ————— ج) «رَمْزُ + وَالجَمْعُ ضِمْنَ ٥» (٦·٢): الجملةُ وكمّيتُها معاً —————
  const adoc = await open('#/add/five');
  (await onward(adoc))?.click();
  await until(adoc, (d) => d.querySelector('.q-sentence'), 12000);
  const terms = [...adoc.querySelectorAll('.q-sentence .q-term .figure')]
    .map((f) => Number(f.dataset.drawn));
  const plus = adoc.querySelector('.q-sentence .q-sign')?.textContent || '';
  const factBox = adoc.querySelector('.q-fact');
  const factFig = adoc.querySelector('.q-fact .figure');
  const factShown = factBox && !factBox.hidden
    && adoc.defaultView.getComputedStyle(factBox).display !== 'none';
  ok(terms.length === 2 && plus === '+' && !!adoc.querySelector('.q-ask'),
    `وجملةُ ٦·٢ رمزان وعلامةٌ وخانةُ سؤال (${terms.join(` ${plus} `)} ؟)`);
  ok(factShown && factFig
    && Number(factFig.dataset.drawn) === terms[0] + terms[1]
    && Number(factFig.dataset.split) === terms[0],
  `و**الكمّيةُ والرمزُ معاً في أوّل لقاء**: تحت الجملة كمّيةٌ رُسِم منها `
    + `${factFig ? factFig.dataset.split : '؟'} ثم بقيّتُها، ومجموعُها `
    + `${factFig ? factFig.dataset.drawn : '؟'} — وهو مجموعُ رمزَيها`);

  // والإصابةُ تُتمّ الجملةَ في خانتها
  answerOf(adoc)?.click();
  await new Promise((r) => setTimeout(r, 400));
  const filledAsk = adoc.querySelector('.q-ask.is-full');
  ok(!!filledAsk && arDigits(filledAsk.textContent) === terms[0] + terms[1],
    `وبالإصابة تتمّ الجملةُ في خانتها (${filledAsk ? filledAsk.textContent : '؟'})`);

  // **ثم بالرمز وحدَه والكمّيةُ عوناً عند النقر** (`METHOD.md §٣`)
  let peek = null;
  for (let i = 0; i < 16 && !peek; i++) {
    const btn = adoc.querySelector('.q-peek');
    if (btn && !btn.hidden) { peek = btn; break; }
    (answerOf(adoc) || adoc.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 500));
  }
  const soloFact = adoc.querySelector('.q-fact');
  const soloHidden = soloFact && soloFact.hidden
    && adoc.defaultView.getComputedStyle(soloFact).display === 'none';
  peek?.click();
  await new Promise((r) => setTimeout(r, 250));
  ok(!!peek && soloHidden && soloFact && !soloFact.hidden,
    'وفي «وحدك» الرمزُ وحدَه — **والكمّيةُ عونٌ عند النقر**، بلا حدٍّ ولا احتساب');

  // ————— د) «رَمْزُ − وَالطَّرْحُ ضِمْنَ ٥» (٦·٣): الإزالةُ مرئية —————
  const tdoc = await open('#/sub/five');
  (await onward(tdoc))?.click();
  const takeFig = await until(tdoc, (d) => d.querySelector('.q-fact .figure'), 12000);
  const leftGone = takeFig ? takeFig.querySelectorAll('[data-mark].is-gone').length : 0;
  const stillHere = takeFig ? Number(takeFig.dataset.split) : -1;
  const takeBoard = tdoc.querySelector('.q-solve');
  const minus = tdoc.querySelector('.q-sentence .q-sign')?.textContent || '';
  ok(minus === '−' && leftGone > 0 && takeFig
    && stillHere + leftGone === Number(takeFig.dataset.drawn)
    && Number(takeBoard.dataset.answer) === stillHere,
  `و«رَمْزُ −» إزالةٌ مرئية: ${leftGone} مشطوبٌ من ${takeFig ? takeFig.dataset.drawn : '؟'}، `
    + `**والجوابُ ما لم يُشطَب** (${stillHere}) مقروءاً من الرسم`);

  // ————— هـ) «كَمِ الفَرْقُ بَيْنَهُمَا؟» (٦·٦): صفّان متحاذيان —————
  const fdoc6 = await open('#/diff/ten');
  /* **ونمذجتُها تُرَصّ كما تُرَصّ «وحدك»** (قيدُ إصلاح مراجعة الجلسة ٦): التلميحُ يقول
     «الصَّفَّ الأَعْلَى» — فإن عُرِضت الكمّيتان جنباً إلى جنب فلا صفَّ أعلى في الصورة،
     والكلامُ لا يطابق العين. **والفحصُ يقيس الرصَّ لا يقرأ النصّ**: أعلى الأوّل فوق
     أسفل الثاني، ويسارُهما واحد. */
  const bare = (t) => String(t).replace(/[ً-ْٰ]/g, '');
  await until(fdoc6, (d) => (d.querySelectorAll('.q-stage .figure').length === 2 ? true : null), 14000);
  const modelPair = [...fdoc6.querySelectorAll('.q-stage .figure')];
  const modelStacked = modelPair.length === 2
    && Math.abs(rectOf(modelPair[0]).left - rectOf(modelPair[1]).left) < 2
    && rectOf(modelPair[0]).bottom <= rectOf(modelPair[1]).top + 1;
  const modelHint = bare(shownIn(fdoc6.querySelector('.station-body .hint')));
  ok(modelStacked && modelHint.includes('الصف الأعلى'),
    `ونمذجةُ الفرق **صفٌّ تحت صفّ** كما في «وحدك» (${modelPair.length} صفّاً`
    + `${modelPair.length === 2 ? `، فرقُ اليسار ${Math.round(Math.abs(rectOf(modelPair[0]).left
      - rectOf(modelPair[1]).left))}px` : ''}) — والكلامُ يطابق العين`);
  (await onward(fdoc6))?.click();
  await until(fdoc6, (d) => d.querySelector('.q-fact-body.q-rows .figure'), 14000);
  const diffRows = [...fdoc6.querySelectorAll('.q-fact-body.q-rows .figure')];
  const diffBoard = fdoc6.querySelector('.q-solve');
  const rowsAligned = diffRows.length === 2
    && Math.abs(rectOf(diffRows[0]).left - rectOf(diffRows[1]).left) < 2
    && rectOf(diffRows[0]).bottom <= rectOf(diffRows[1]).top + 1;
  ok(rowsAligned && Number(diffBoard.dataset.answer)
    === Number(diffRows[0].dataset.drawn) - Number(diffRows[1].dataset.drawn),
  `و«كَمِ الفَرْقُ» صفّان متحاذيان (${diffRows.map((f) => f.dataset.drawn).join(' و')})، `
    + `**والفرقُ من المرسوم** (${diffBoard ? diffBoard.dataset.answer : '؟'})`);

  /* ————— ١١هـ) المرحلة ٧: العشرةُ وما بعدها ١١–٢٠ (الجلسة ٧) —————

     أربعةُ عهودٍ لا يُثبتها إلا متصفّح:
       • **ما فوق العشرة يُبنى ولا يُعَدّ فرادى** (`METHOD.md §٢.٢` المعتمد): النمذجةُ
         **تُعلّم الحزمةَ كلَّها في لحظةٍ واحدة** ثم تَعُدّ الآحادَ فوقها — فلا مشيَ على
         أربعةَ عشرَ عنصراً واحداً واحداً.
       • **والبناءُ حزمةٌ وآحاد**: خانتان تُملآن، وإحدى البطاقات إطارٌ ممتلئ.
       • **والعبورُ صعوداً خطوتان**: كم يُكمِل العشرة، ثم كم صارت كلُّها.
       • **والعبورُ نازلاً يفرغ من حيث امتلأ**: أوّلُ ما يغادر آخرُ ما مُلئ. */

  // ————— أ) «١١–١٥ عَشَرَةٌ وَآحَاد»: الحزمةُ تُسمّى ثم تُعَدّ الآحادُ فوقها —————
  const teenDoc = await open('#/teen/fifteen');
  const teenModel = await until(teenDoc, (d) => d.querySelector('.q-stage .figure[data-split]'), 14000);
  ok(teenModel && Number(teenModel.dataset.drawn) > 10
    && teenModel.querySelectorAll('[data-part="a"]').length === 10,
  `محطةُ «١١–١٥» تُنمذِج **عشرةً وآحاداً**: ${teenModel
    ? teenModel.querySelectorAll('[data-part="a"]').length : '؟'} في الحزمة `
    + `و${teenModel ? teenModel.querySelectorAll('[data-part="b"]').length : '؟'} فوقها `
    + `من ${teenModel ? teenModel.dataset.drawn : '؟'} مرسومة`);

  /* **والحزمةُ تُعلَّم دفعةً واحدة**: يُنتظَر أوّلُ تعليمٍ في النمذجة، فيجب أن يكون
     **عشرةَ عناصرَ معاً** لا عنصراً واحداً — وهو الفرقُ بين «تُبنى» و«تُعَدّ فرادى». */
  const litAtOnce = await until(teenDoc,
    (d) => d.querySelectorAll('.q-stage [data-mark].is-counted').length || null, 16000);
  ok(litAtOnce >= 10,
    `و**الحزمةُ تُعلَّم دفعةً واحدة** (${litAtOnce || 0} عنصراً في أوّل تعليم) — `
    + 'فما فوق العشرة يُبنى ولا يُعَدّ فرادى');

  (await onward(teenDoc))?.click();
  const teenBoard = await until(teenDoc, (d) => d.querySelector('.q-bond, .q-solve--teen'), 14000);
  if (teenBoard && teenBoard.classList.contains('q-bond')) {
    const bundle = cardsOf(teenDoc).find((c) => Number(c.querySelector('.figure')?.dataset.drawn) === 10);
    ok(Number(teenBoard.dataset.slots) === 2 && !!bundle,
      `ولوحُ البناء **خانتان** وفي بطاقاته حزمةُ عشرةٍ ممتلئة `
      + `(المطلوب ${teenBoard.dataset.need})`);
  } else {
    ok(!!teenBoard, 'ولوحُها يُرسَم (بناءً أو قراءةً بحسب دور الوجه)');
  }
  const teenDone = await play(teenDoc, 90);
  ok(!!teenDone && teenDoc.querySelectorAll('.big-stars .on').length > 0,
    `ومحطةُ «١١–١٥» تُجتاز كاملةً لمساً حتى الاحتفال `
    + `(${teenDoc.querySelectorAll('.big-stars .on').length} نجمة)`);

  // ————— ب) «اِصْنَعْ عَشَرَةً أَوَّلًا» (٧·٥): سؤالان في جولةٍ واحدة —————
  const bridge = await open('#/bridge/twenty');
  (await onward(bridge))?.click();
  const brBoard = await until(bridge, (d) => d.querySelector('.q-solve--bridge'), 16000);
  const brFrames = brBoard ? [...brBoard.querySelectorAll('.q-fact-body .figure')] : [];
  const brGap = brFrames[0]
    ? brFrames[0].querySelectorAll('[data-cell]').length - Number(brFrames[0].dataset.drawn) : -1;
  const brSplit = brFrames[1] ? Number(brFrames[1].dataset.split) : -1;
  ok(brBoard && Number(brBoard.dataset.answer) === brGap && brGap === brSplit,
    `و«اِصْنَعْ عَشَرَةً أَوَّلًا» تسأل أوّلاً **ما يُكمِل العشرة** — `
    + `${brGap} خانةً فارغة، وهي شقُّ المُضاف نفسُه (${brSplit}) مقروءين من الرسم`);

  answerOf(bridge)?.click();
  const brTotal = await until(bridge,
    (d) => d.querySelector('.q-fact-body .figure[data-display="two-frames"]'), 16000);
  ok(brTotal && Number(bridge.querySelector('.q-solve--bridge').dataset.answer)
    === Number(brTotal.dataset.drawn)
    && brTotal.querySelectorAll('[data-part="a"]').length === 10,
  `ثم **تصير الحصيلةُ حزمةً وآحاداً في الإطارين** (${brTotal ? brTotal.dataset.drawn : '؟'}) `
    + '— والسؤالُ الثاني جوابُه ما رُسِم فيهما');
  const brDone = await play(bridge, 110);   // جولتُها سؤالان، فخطواتُها ضِعف
  ok(!!brDone, 'ومحطةُ العبور تُجتاز كاملةً لمساً حتى الاحتفال');

  // ————— ج) «اِطْرَحْ ضِمْنَ ٢٠» (٧·٦): يفرغ من حيث امتلأ، وينزل عبر العشرة —————
  const down = await open('#/sub/twenty');
  (await onward(down))?.click();
  await until(down, (d) => d.querySelector('.q-solve--sub .q-fact-fig .figure'), 16000);
  const downFig = down.querySelector('.q-solve--sub .q-fact-fig .figure');
  const goneMarks = downFig ? [...downFig.querySelectorAll('[data-part="b"]')] : [];
  const downRight = answerOf(down);
  cardsOf(down).find((c) => c !== downRight)?.click();
  const firstLit = await until(down,
    (d) => d.querySelector('.q-solve--sub [data-mark].is-counted'), 16000);
  ok(goneMarks.length > 0 && firstLit === goneMarks[goneMarks.length - 1],
    'و**الطرحُ يفرغ من حيث امتلأ**: أوّلُ ما يغادر آخرُ ما مُلئ '
    + `(${goneMarks.length} مغادراً، والمُضاء أوّلاً هو ${firstLit === goneMarks[goneMarks.length - 1]
      ? 'الأخير' : 'ليس الأخير'})`);

  /* **ومهلةُ السَّوق هنا أوسع**: العدُّ النازل من فوق العشرين يمشي على عشرين عنصراً
     ومعه وقفةُ العشرة — ثوانٍ بحسابها لا تعلّقاً، والسائقُ محبوسٌ فيها. */
  const seenWholes = [];
  for (let i = 0; i < 130 && !down.querySelector('.celebrate'); i++) {
    const fig = down.querySelector('.q-solve--sub .q-fact-fig .figure');
    if (fig) seenWholes.push(Number(fig.dataset.drawn));
    (answerOf(down) || down.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 480));
  }
  ok(!!down.querySelector('.celebrate') && Math.max(...seenWholes, 0) > 10,
    `و«اِطْرَحْ ضِمْنَ ٢٠» تُجتاز لمساً، **وتطرح فوق العشرة فعلاً** `
    + `(أكبرُ كلٍّ رأته: ${Math.max(...seenWholes, 0)})`);

  /* ————— ١١و) المرحلة ٨: الأنماطُ والقياسُ الوصفيّ ومحطةُ التعارف —————

     ثلاثةُ عهودٍ: **النمطُ إيقاعٌ يُرى وجوابُه من الشريط المرسوم**، و**القياسُ مقاديرُ
     تقف على خطٍّ واحد فيُقارَن الطولُ لا الموضع**، و**محطةُ التعارف عرضٌ بلا قياس**
     وهي **وحدَها** التي فيها رقمٌ مغربيّ في التطبيق كلِّه (ق١). */

  // ————— أ) «أَكْمِلِ النَّمَط»: الجوابُ ما يبعد دورةً كاملة —————
  const pdoc = await open('#/pattern/abab');
  (await onward(pdoc))?.click();
  const stripFig = await until(pdoc, (d) => d.querySelector('.q-solve--pattern .figure'), 16000);
  const cells = stripFig ? [...stripFig.querySelectorAll('[data-cell]')] : [];
  const items = cells.map((c) => c.dataset.item || null);
  const blankAt = items.indexOf(null);
  const period = 2;                          // (أ ب أ ب) — دورتُها اثنتان
  ok(cells.length === Number(stripFig?.dataset.drawn) && items.filter((x) => !x).length === 1
    && blankAt === cells.length - 1
    && stripFig.parentElement.parentElement.dataset.answer === items[blankAt - period],
  `شريطُ (أ ب أ ب) ${cells.length} خانةً وآخرُها سؤال، **وجوابُه ما يبعد دورةً كاملة** `
    + 'مقروءاً من الشريط المرسوم لا من نيّة المولّد');

  const patRight = answerOf(pdoc);
  const patCards = cardsOf(pdoc).map((c) => c.querySelector('img.emoji')?.dataset.emoji || '؟');
  ok(!!patRight,
    `وفي البطاقات ما رسم ذلك الرمز (يُقرأ من صورتها) — المطلوب «${pdoc
      .querySelector('.q-solve--pattern')?.dataset.answer}»، وفي ${patCards.length} بطاقة: `
    + patCards.join(' '));
  patRight?.click();
  const filled = await until(pdoc,
    (d) => d.querySelector('.q-solve--pattern [data-cell].is-full'), 12000);
  ok(!!filled, 'وبالإصابة **تتمّ خانةُ السؤال بما رُسِم على البطاقة** فيُرى النمطُ تامّاً');
  const patDone = await play(pdoc, 90);
  ok(!!patDone, 'ومحطةُ النمط تُجتاز كاملةً لمساً حتى الاحتفال');

  // ————— ب) «أَطْوَلُ وَأَقْصَر»: مقاديرُ على خطٍّ واحد —————
  const mdoc8 = await open('#/measure/size');
  (await onward(mdoc8))?.click();
  const sceneFig = await until(mdoc8, (d) => d.querySelector('.q-solve--measure .figure'), 16000);
  const things = sceneFig ? [...sceneFig.querySelectorAll('[data-item]')] : [];
  const boxes = things.map(rectOf);
  const grounded = boxes.length > 1
    && boxes.every((b) => Math.abs(b.bottom - boxes[0].bottom) < 2);
  const sizes = things.map((t) => Number(t.dataset.size));
  ok(things.length >= 2 && new Set(sizes).size === sizes.length && grounded,
    `ومشهدُ القياس ${things.length} أشياءَ بمقاديرَ مختلفة (${sizes.join(' و')}) `
    + '**تقف على خطٍّ واحد** — فالفرقُ طولٌ يُرى لا موضعٌ يخدع');
  const wantSize = mdoc8.querySelector('.q-solve--measure').dataset.answer;
  const askText = bare(askOf(mdoc8));
  const extreme = askText.includes('أقصر') || askText.includes('أخف')
    ? Math.min(...sizes) : Math.max(...sizes);
  ok(Number(wantSize) === extreme,
    `و**المطلوبُ من المقدار المرسوم**: «${askOf(mdoc8)}» ⇒ ${wantSize} `
    + `(والمنتظَر ${extreme})`);
  const meaDone = await play(mdoc8, 90);
  ok(!!meaDone, 'ومحطةُ «أطولُ وأقصر» تُجتاز كاملةً لمساً حتى الاحتفال');

  /* ————— ١١ز) 🚪 بوابة ٣ «ختامُ التأسيس»: من أضعف الرحلة كلِّها —————
     **وتُساق من داخل مستند القياس نفسِه** كأختيها: وضعُ المعاينة لا يكتب على القرص،
     فسجلُّ ليتنر لا يعبر من مستندٍ إلى مستند — ويُساق من الذي لعب محطةً كاملة. */
  mdoc8.defaultView.location.hash = '#/gate/final';
  await new Promise((r) => setTimeout(r, 1300));
  const finalDots = mdoc8.querySelectorAll('.dots .dot').length;
  ok(!!mdoc8.querySelector('.gate-head') && finalDots > 0 && finalDots <= 10,
    `بوابةُ «خِتَامُ التَّأْسِيس» تُرسَم بجلسةٍ من سجلّ ما لعبه الطفل (${finalDots} تمريناً)`);
  for (let i = 0; i < 60 && !mdoc8.querySelector('.celebrate'); i++) {
    (answerOf(mdoc8) || mdoc8.querySelector('.station-body .next'))?.click();
    await new Promise((r) => setTimeout(r, 460));
  }
  const finalVerdict = mdoc8.querySelector('.celebrate');
  ok(!!finalVerdict && !/رسوب|فشل|خطأ/.test(shownIn(finalVerdict)),
    `وتُجتاز إلى حكمها بلا لفظ رسوب (${finalVerdict
      && !finalVerdict.classList.contains('celebrate--again') ? 'فُتِحَت' : 'لَيْسَ بَعْدُ'})`);

  // ————— ج) «تَعَارُفٌ: أَرْقَامٌ أُخْرَى» (٨·٥): عرضٌ بلا قياس، ورقمٌ مغربيّ فيها وحدَها —————
  const idoc = await open('#/intro/latin');
  const rows = [...idoc.querySelectorAll('.intro-row')];
  const west = rows.map((r) => shownIn(r.querySelector('.intro-west')).trim());
  ok(rows.length >= 10 && west.every((t) => /^[0-9]+$/.test(t)),
    `محطةُ التعارف تعرض ${rows.length} صفّاً: مشرقيُّنا ورسمُه الآخر (${west.join('')})`);
  const introLatin = [...new Set((shownIn(idoc.querySelector('main.screen-card')).match(/\d/g) || []))];
  ok(introLatin.length > 0,
    `و**هي وحدَها** التي فيها رقمٌ مغربيّ في التطبيق كلِّه (${introLatin.length} رقماً) — `
    + 'استثناءٌ مكتوبٌ في المنهج (ق١)، وسائرُ الشاشات صفرُ رقمٍ لاتينيّ');
  idoc.querySelector('.station-body .next')?.click();
  await new Promise((r) => setTimeout(r, 700));
  ok(idoc.querySelectorAll('.big-stars .on').length === 3,
    'وتُختَم **بنجومٍ كاملة بلا محاولةٍ واحدة** — إتمامُها مشاهدةٌ لا إتقان');

  /* ————— ١١ح) الخريطةُ تعرض الرحلةَ كلَّها — والعددُ يُقابَل بالمنهج لا يُكتب بيد —————
     `test_journey.mjs` يطبع عددَ العقد من ثلاثة مصادر في node، وهذا يقابله **بما
     رُسِم على الخريطة فعلاً**: تُفرَد أقسامُها كلُّها وتُعَدّ عقدُها. */
  const mapDoc = await open('#/');
  const wanted = await (async () => {
    const m = await import('/js/curriculum.js');
    return m.sections().reduce((n, s) => n + (s.nodes || []).length, 0);
  })();
  for (const head of [...mapDoc.querySelectorAll('.station-head--fold')]) {
    if (head.getAttribute('aria-expanded') !== 'true') head.click();
  }
  await new Promise((r) => setTimeout(r, 900));
  const drawnNodes = mapDoc.querySelectorAll('.node').length;
  ok(drawnNodes === wanted,
    `والخريطةُ ترسم الرحلةَ كلَّها: **${drawnNodes} عقدة** في `
    + `${mapDoc.querySelectorAll('.station').length} قسماً — وهو ما يحسبه المنهج (${wanted})`);

  /* ————— ١٢) **تعاقبُ الصوت**: صوتٌ واحدٌ في الجوّ، والانتقالُ بعد تمامه —————

     ما بلّغ عنه الميدان (`docs/FIELD.md §١`) ثلاثةُ أعراضٍ لعلّةٍ واحدة، وهنا تُقاس
     الثلاثةُ على **أوّل محطةٍ في الرحلة** — وهي عينُ ما فتح عليه المالك:
       أ) **الجملةُ تُسمَع تامّةً** ولا تدهسها التي بعدها («انظر وا… اثنان»).
       ب) **لا لحظةَ فيها صوتان معاً** («صوتان متكرران في الصفحة التالية»).
       ج) **الخطوةُ لا تتقدّم قبل تمام آخر جملةٍ فيها** («لا ينتظر الصوت فينتقل»).

     **ومدّةُ الملفّ الوهميّ ترتفع هنا** فوق مهلتَي الشاشة (`BEAT` ٦٢٠ و`AFTER_RIGHT_MS`
     ٧٨٠): بذلك يصير العطبُ الأصليُّ **مرئياً للحارس** — ولولا ذلك لَمرَّ. */

  const SPEECH_MS = 900;
  audioMs = SPEECH_MS;
  /* **ويبدأ القياسُ قبل فتح الشاشة**: الجملةُ الأولى تُقال ساعةَ تُرسَم — فمن قاس بعد
     أن استقرّت الشاشةُ فاتته **أوّلُ ما يسمعه الطفل**، وهو موضعُ البلاغ بعينه. */
  const seqFrom = performance.now();
  const qdoc = await open('#/subitize/two');

  // أ) خطوةُ «شاهِدْ»: الدعوةُ ثم أسماءُ العدّ — كلٌّ تامّةٌ لا مقطوشة
  const nextBtn = await until(qdoc, (d) => d.querySelector('.station-body .next'), 22000);
  /* **ويُمهَل بعد ظهور «تابِعْ»**: خطوةٌ لا تنتظر صوتَها تبلغ زرَّها والكلامُ خلفها
     ما زال يتساقط — فلو قِيس عند الزرّ وحدَه لَقِيس صمتٌ لم يقع بعد. */
  await new Promise((r) => setTimeout(r, SPEECH_MS * 2));
  const watchRows = timeline.filter((r) => r.t0 >= seqFrom && Number.isFinite(r.t1));
  const cut = watchRows.filter((r) => r.t1 - r.t0 < SPEECH_MS * 0.9);
  // (عددُ الجمل من بيانات المحطة — دعوةٌ ثم اسمٌ لكل عنصرٍ مرسوم، فلا يُكتَب هنا رقمُه)
  ok(watchRows.length >= 2 && cut.length === 0,
    `خطوةُ «شاهِدْ» تُسمِع كلَّ جملةٍ **تامّة** (${watchRows.length} جملةً، `
    + `أقصرُها ${watchRows.length ? Math.round(Math.min(...watchRows.map((r) => r.t1 - r.t0))) : 0}ms `
    + `من ${SPEECH_MS})${cut.length ? ` — **مقطوشٌ: ${cut.map((r) => r.key).join('، ')}**` : ''}`);
  ok(overlaps(seqFrom).length === 0,
    `ولا لحظةَ فيها صوتان يعملان معاً${overlaps(seqFrom).length
      ? ` — **تراكب: ${overlaps(seqFrom).join('، ')}**` : ''}`);

  /* ب) الانتقالُ من خطوةٍ إلى خطوة: إعلانُ الخطوة ثم سؤالُ الشاشة — **وهذا موضعُ
        «الصوتين المتكرّرين»**: كانا يُطلَقان في اللحظة نفسِها فيعملان معاً. */
  const stepFrom = performance.now();
  nextBtn?.click();
  await until(qdoc, (d) => (d.querySelectorAll('.qcard').length ? true : null), 12000);
  await new Promise((r) => setTimeout(r, SPEECH_MS * 2.2));
  const stepRows = timeline.filter((r) => r.t0 >= stepFrom);
  ok(stepRows.length >= 2 && overlaps(stepFrom).length === 0,
    `وعند الانتقال إلى «جَرِّبْ مَعِي» يُسمَع الإعلانُ ثم السؤال **بالتتابع** `
    + `(${stepRows.length} جملةً)${overlaps(stepFrom).length
      ? ` — **معاً: ${overlaps(stepFrom).join('، ')}**` : ''}`);

  /* ج) الجولةُ لا تتقدّم وكلمةُ الصواب في الجوّ: يُنقَر الجوابُ الصحيح، فتُقاس لحظةُ
        انتقال الخرزة وتُقابَل بلحظة تمام «أَحْسَنْتْ». (بالمهلة الثابتة وحدَها كان
        الانتقالُ بعد ٧٨٠ مللي — أي **قبل** تمام جملةٍ طولُها ٩٠٠.) */
  const bead0 = beadNow(qdoc);
  const rowsBefore = timeline.length;
  const cardsNow = [...qdoc.querySelectorAll('.qcard')];
  const stageNow = qdoc.querySelector('.q-stage');
  cardsNow.find((c) => drawnOf(c) === drawnOf(stageNow))?.click();
  let moved = 0;
  for (let waited = 0; waited < 12000 && !moved; waited += 25) {
    await new Promise((r) => setTimeout(r, 25));
    if (beadNow(qdoc) !== bead0 || qdoc.querySelector('.celebrate')) moved = performance.now();
  }
  const praise = timeline.slice(rowsBefore)[0];
  /* **وتمامُها شرطان**: أن يقع الانتقالُ بعد نهايتها، **وأن تكون نهايتُها تماماً لا
     قطعاً** — فالانتقالُ نفسُه يُسكت القناة، فلو مضى مبكّراً لَقطع الكلمةَ وسجّل
     «نهايةً» في اللحظة نفسِها فمرّ الشرطُ الأول وحدَه. */
  const full = praise && Number.isFinite(praise.t1) && praise.t1 - praise.t0 >= SPEECH_MS * 0.9;
  ok(moved && full && moved >= praise.t1,
    `و**الجولةُ لا تتقدّم قبل تمام كلمة الصواب**: سُمعت ${praise
      ? Math.round(praise.t1 - praise.t0) : '؟'}ms من ${SPEECH_MS}، والانتقالُ بعد تمامها بـ`
    + `${moved && praise ? Math.round(moved - praise.t1) : '؟'}ms`);
  audioMs = 60;

  // ————— ج) الصوت في مسار الطفل: من البنك لا من نطقٍ آليّ —————
  const heard = [...new Set(played)];
  ok(heard.length > 0, `الصوتُ يُشغَّل من البنك في مسار الطفل (${played.length} تشغيلاً، `
    + `${heard.length} نصّاً مختلفاً)`);
  const unknown = heard.filter((key) => !(key in bank));
  ok(unknown.length === 0,
    `وكلُّ ما شُغِّل له ملفٌّ في الفهرس${unknown.length ? ` — بلا ملف: ${unknown.slice(0, 5).join('، ')}` : ''}`);
  /* **وعلى الرحلة كلِّها**: ما مضى من هذه الصفحة ساق ثماني محطاتٍ لمساً — بخطواتها
     وجولاتها وأخطائها وعدّها أمام الطفل. فيُقابَل التشغيلُ بالتشغيل في **كل ما وقع**:
     لا لحظةَ واحدة فيها صوتان معاً. (الحارسُ الذي يعدّ التشغيلات كان أخضرَ والعيبُ
     صارخ — وهذا يقيس ما سمعته الأذن.) */
  closeOpen();
  const clashes = overlaps(0);
  ok(clashes.length === 0,
    `ولا لحظةَ في الرحلة كلِّها يعمل فيها صوتان معاً (${timeline.length} تشغيلاً مقيساً)`
    + (clashes.length ? ` — **تراكب: ${[...new Set(clashes)].slice(0, 5).join('، ')}**` : ''));

  const stray = spoken.filter((t) => !pendingAudio.has(t));
  ok(stray.length === 0,
    `ولا لجوءَ إلى النطق الآليّ إلا لنصٍّ ينتظر التصريف (المنتظِر في القائمة: `
    + `${pendingAudio.size}، ولجوءٌ وقع: ${spoken.length}`
    + `${stray.length ? `، خارجَ القائمة: ${stray.join('، ')}` : ''})`);

  } catch (err) {
    ok(false, `عطبٌ في صفحة الفحص: ${(err && (err.stack || err.message)) || err}`);
  }

  clearTimeout(watchdog);
  await report(out);
</script>
