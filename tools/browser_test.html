    `**والخطأُ لا يُغلق الجولة**: على ${retried} شاشةِ اختيارٍ نُقِر جوابٌ خطأ ثم `
    + `**قُبِل الصوابُ بعده** (عهدُ «يُعَدُّ أمامه ثمّ يحاول ثانية»)`
    + (shut.length ? ` — **مُغلَقة: ${shut.join(' | ')}**` : ''));
  ok(bothFaces.size === 2 && faceShut.length === 0,
    `**ووجها محطة الرموز كلاهما** — وهو موضعُ البلاغ ٦: أُخطئ ثمّ أُصيب في `
    + `${[...bothFaces].join(' وفي ') || 'لا وجه'}`
    + (faceShut.length ? ` — **${faceShut.join(' | ')}**` : '')
    + (bothFaces.size < 2 ? ' — **لم يُقَس الوجهان**' : ''));

  /* ————— ١١ن) **بوابةُ اللحاق**: بابُها اللوحة، وفتحُها مُثبَت (الجلسة ل) —————

     `tools/test_placement.mjs` يجرد السلّمَ والتغطيةَ والعتبةَ في node، **وهذا يمشي
     المشهدَ كما يمشيه وليُّ الأمر**: يفتح اللوحةَ بحلّ ضربها، فيجد قسمَ اللحاق بعدد
     درجاته، ثم يبدأ الامتحانَ فيحلّ محلّ اللوحة **جلسةَ ملء شاشة** بنسق بوّابتنا،
     ويجيب من المرسوم حتى يعبر — **فيُقابَل ما كُتب في الجهاز**: عقدُ المرحلة الأولى
     بنجمةٍ واحدة، وما بعدها على حاله. ثم يُنهي جلسةً بلا محاولةٍ واحدة فيقف عند
     شرخه **ولا يُفتح شيء**.

     والمقيسُ ما لا يمسكه جردُ مصدر: أنّ الشاشةَ تُرسَم فعلاً، وأنّ الفتحَ يبلغ
     التخزين، وأنّ أزرارَها ليست حروفاً وحدَها (جردُ الصنف) وتبلغ هدفَ اللمس. */

  const PROGRESS_KEY = 'ihsib.progress.v1';
  const curric = await import('/js/curriculum.js');
  const { arNum } = await import('/js/ui.js');
  const { CAP } = await import('/js/placement.js');
  // درجاتُ سلّمِ طفلٍ جديد: أقسامُ الرحلة قبل أوّل بوّابة — **محسوبةٌ من المنهج**
  const rungCount = curric.sections().findIndex((s) => s.kind === 'gate');

  frame.contentWindow.localStorage.removeItem(PROGRESS_KEY);
  const catchDoc = await open('#/parent', '&dev=1');
  const [catchA, catchB] = (catchDoc.querySelector('.gate .giant')?.textContent || '').split('×');
  const catchGate = catchDoc.querySelector('.gate input');
  if (catchGate) {
    catchGate.value = String(arDigits(catchA) * arDigits(catchB));
    catchDoc.querySelector('.gate-go')?.click();
    await new Promise((r) => setTimeout(r, 500));
  }
  const startBtn = catchDoc.querySelector('.start-placement');
  const leftPill = [...catchDoc.querySelectorAll('.parent-tool .pill')]
    .map((el) => el.textContent.trim()).join(' ');
  ok(!!startBtn && leftPill.includes(`أمامه ${arNum(rungCount)} من ${arNum(rungCount)}`),
    `وفي اللوحة قسمُ «امتحان اللحاق» بعدد درجاته («${leftPill}» — ${rungCount} درجاتٍ`
    + ' قبل أوّل بوّابة، وهي ما يحسبه المنهج)');

  startBtn?.click();
  const examHead = await until(catchDoc, (d) => d.querySelector('.gate-head'), 12000);
  const examDots = catchDoc.querySelectorAll('.dots .dot').length;
  ok(!!examHead && shownIn(examHead).includes('امْتِحَانُ اللَّحَاق')
    && examDots > 0 && examDots <= CAP,
    `وبدؤه يحلّ محلّ اللوحة **جلسةَ ملء شاشة** بنسق البوّابة (${examDots} تمريناً، `
    + `وسقفُها ${CAP})`);
  ok(shownIn(examHead).includes(curric.STAGES[0].title),
    'وترويستُها تسمّي المرحلةَ التي يُمتحَن فيها');
  ok(!catchDoc.querySelector('.audit') && catchDoc.querySelector('.station-screen'),
    'واللوحةُ تغيب ما دام يُمتحَن — لا شاشتان في واحدة');
  const examBare = bareButtons(catchDoc);
  const examTight = undersized(catchDoc);
  ok(!examBare.length && !examTight.length,
    'وأزرارُها ليست حروفاً وحدَها وتبلغ هدفَ اللمس'
    + (examBare.length ? ` — نصٌّ وحدَه: ${bareNames(examBare)}` : '')
    + (examTight.length ? ` — ضيّقة: ${tightNames(examTight)}` : ''));

  const catchVerdict = await play(catchDoc, 40);
  ok(!!catchVerdict && !catchVerdict.classList.contains('celebrate--again'),
    `ويُجاب من المرسوم حتى يُعبَر (${catchVerdict
      ? shownIn(catchVerdict).split('\n')[1] || 'حكمٌ بلا عنوان' : 'لا حكم'})`);

  /* **والفتحُ يُقاس على اللوحة لا في المخزن**: بطاريةُ الفحص تفتح التطبيق في وضع
     المعاينة (`?preview=1`) **وهو لا يمسّ القرص عمداً** (`save` في `progress.js`) —
     فالمقياسُ ما تراه عينُ وليّ الأمر بعد الامتحان: **نجومُ الرحلة = عقدُ المرحلة
     الأولى بنجمةٍ واحدة لكلٍّ** (فلا نجمةَ زائدة تعني عقدةً فُتحت وراءها)، و«التالي»
     **أوّلُ عقدةٍ في المرحلة الثانية** (فالجبهةُ وقفت حيث وقف الامتحان بالضبط). */
  [...catchDoc.querySelectorAll('.celebrate .btn')]
    .find((b) => shownIn(b).includes('يكفي'))?.click();
  await until(catchDoc, (d) => d.querySelector('.audit'), 8000);
  const leftAfter = [...catchDoc.querySelectorAll('.parent-tool .pill')]
    .map((el) => el.textContent.trim()).join(' ');
  ok(!!catchDoc.querySelector('.audit')
    && leftAfter.includes(`أمامه ${arNum(rungCount - 1)} من ${arNum(rungCount)}`),
    `و«يكفي اليوم» يردّه إلى اللوحة وقد نقصت درجةٌ («${leftAfter}»)`);

  const firstNodes = curric.sections()[0].nodes.length;
  /** النجومُ المكسوبة كما تقرؤها اللوحة — الشقُّ الأيمن من شارة «النجوم». */
  const starsShown = (d) => ([...d.querySelectorAll('.audit-row .pill')]
    .map((el) => el.textContent.trim()).find((t) => t.startsWith('النجوم')) || '')
    .split(':')[1]?.split('/')[0].trim();
  // (وسطرُ «أين هو الآن» لا سطرُ التوصية — وذاك يبدأ بـ«التالي في رحلته».)
  const nextLine = [...catchDoc.querySelectorAll('.audit .hint')]
    .map((el) => el.textContent.trim()).find((t) => t.startsWith('التالي:'));
  ok(starsShown(catchDoc) === arNum(firstNodes),
    `**والفتحُ يبلغ اللوحة**: نجومُ الرحلة ${starsShown(catchDoc)} — عقدُ المرحلة الأولى `
    + `(${arNum(firstNodes)}) بنجمةٍ واحدة لكلٍّ ولا زيادةَ عقدةٍ وراءها`);
  ok(nextLine === `التالي: ${curric.sections()[1].nodes[0].title}.`,
    `و«التالي» أوّلُ عقدةٍ في المرحلة الثانية — فالجبهةُ وقفت حيث وقف («${nextLine}»)`);

  /* **وأوّلُ إخفاقٍ يُنهي ولا يفتح شيئاً**: تُبدأ الدرجةُ التالية ثم تُنهى الجلسةُ
     بلا محاولةٍ واحدة (زرُّ `?dev=1`) — فالحكمُ «لَيْسَ عبوراً» ولا زرَّ إعادةٍ فيه. */
  catchDoc.querySelector('.start-placement')?.click();
  await until(catchDoc, (d) => d.querySelector('.gate-head'), 12000);
  [...catchDoc.querySelectorAll('.dev-row .btn')]
    .find((b) => b.textContent.includes('إنهاء الجلسة'))?.click();
  const stopped = await until(catchDoc, (d) => d.querySelector('.celebrate'), 8000);
  ok(!!stopped && stopped.classList.contains('celebrate--again')
    && shownIn(stopped).includes('وَقَفْنَا هُنَا'),
    'وجلسةٌ بلا إصابةٍ تقف عند شرخها («وَقَفْنَا هُنَا»)');
  ok(![...catchDoc.querySelectorAll('.celebrate .btn')].some((b) => shownIn(b).includes('أعِد')),
    'ولا زرَّ إعادةٍ في شاشة الوقوف — أوّلُ إخفاقٍ يُنهي، والإعادةُ من اللوحة');

  /* **ولا تفتح عقدةً واحدة**: يُخرَج بزرّ الشاشة نفسِه (وهو الذي **يُنهي الامتحان**
     ثم يمضي إلى الخريطة — ولو بُدّل المسارُ بيدٍ لبقي الامتحانُ جارياً فرُسِمت درجتُه
     التالية مكانَ اللوحة)، ثم تُفتَح اللوحةُ (وبوابتُها مفتوحةٌ لهذه الجلسة) فتُقرأ
     نجومُها — هي هي، لم تزد بعقدةٍ من المرحلة التي وقف عندها. */
  [...catchDoc.querySelectorAll('.celebrate .btn')]
    .find((b) => shownIn(b).includes('الخريطة'))?.click();
  await until(catchDoc, (d) => d.querySelector('main.map'), 8000);
  catchDoc.defaultView.location.hash = '#/parent';
  await until(catchDoc, (d) => d.querySelector('.audit'), 8000);
  ok(starsShown(catchDoc) === arNum(firstNodes),
    `ولم تُفتح بها عقدةٌ واحدة: النجومُ ${starsShown(catchDoc)} كما كانت — «الوقوفُ عند`
    + ' الشرخ» لا يُثمر فتحاً');
  frame.contentWindow.localStorage.removeItem(PROGRESS_KEY);

  }   // ————— ختامُ نطاق `screens` (صدرُه: المصيِّر والشاشاتُ والبوابات) —————

  if (inScope('audio')) {

  /* ————— ١١ك) **تسريبُ العدّ عبر التنقل** (بلاغ الميدان ٥ · الجلسة م٥) —————

     **بلفظ المالك** (ثلاثُ تأكيدات، آخرُها من الحيّ): «قطعته عند اثنان ثم رجعت
     للصفحة الرئيسية ودخلت من جديد فيبدأ العد من ثلاثة ويعمل عدادين معاً»، ثم
     «التطبيق يتابع العدَّ بعد العودة للصفحة الرئيسية».

     وعلّتُه أنّ حياةَ الحلقة كانت **رقماً في الشاشة** (`token`) لا حياةً لها: يتبدّل
     عند رسم جولةٍ جديدة داخلها، ولا يعلم شيئاً عن مغادرتها. فصارت الحياةُ من **بقاء
     جذر الشاشة في المستند** (`onScreen` في `ui.js`).

     **والمشهدُ ثلاثةُ أحكام**: يُغادَر عند «اثنين» بزرّ الخريطة نفسِه، فيُقاس بعد
     لحظة المغادرة **صمتٌ تام**، ثم عودةٌ تسمع **عدّاً واحداً يبدأ من واحد**. */

  /* **والمحطةُ أطولُ ما يُعَدّ في الرحلة** (١–١٠) عمداً: عدٌّ يُقطَع عند «اثنين» يترك
     خلفه ثمانيَ جملٍ — فيتجاوز التسريبُ نافذةَ الصمت **ويبلغ العودةَ نفسَها**،
     فيُقاس العَرَضان معاً: «يواصل فوق الخريطة» و«عدّادان معاً» بعد الرجوع. */
  const leakDoc = await open('#/count/ten');
  // **ويُقاس المسموعُ لا مصدرُه** (`earLog`): نصٌّ بُدِّل حرفُه يمضي في الاحتياط حتى
  // تصرّفه جلسةُ الصوتيات، وعدٌّ يستأنف من ثلاثة عيبٌ سواءٌ أَمِن ملفٍّ سُمع أم من نطق.
  const leakFrom = earLog.length;
  // يُنتظَر أن يبلغ عدُّ النمذجة «اثنين» — بالحال لا بمهلةٍ ثابتة
  const reached = await until(leakDoc, () =>
    (earLog.slice(leakFrom).includes(NAME_HEARD[2]) ? true : null), 20000);
  const leaveBtn = leakDoc.querySelector('.station-screen .topbar .btn');
  const heardBefore = earLog.slice(leakFrom);
  leaveBtn?.click();
  const onMap = await until(leakDoc, (d) => d.querySelector('main.map'), 5000);
  /* **وتُقاس اللحظةُ من استقرار الخريطة**: بين النقرة ووصول الخريطة أجزاءٌ من ثانية
     قد تبدأ فيها جملةٌ صُفَّت قبل النقرة — فتُقرأ تسريباً وليست منه. وما بعد استقرارها
     لا عذرَ له: العطبُ الأصليّ يواصل العدَّ كلَّ ٦٨٠ مللي، فلا يفوته هذا القياس. */
  const leaveAt = performance.now();
  await new Promise((r) => setTimeout(r, 3000));   // أطولُ من ثلاث جملِ عدٍّ بفواصلها
  const afterLeave = timeline.filter((row) => row.t0 >= leaveAt);
  ok(!!reached && !!leaveBtn && !!onMap,
    `مشهدُ التسريب: عُدَّ حتى «${NAME_HEARD[2]}» (${heardBefore.length} جملةً) ثم `
    + `غُودِرَ إلى الخريطة بزرّها (${onMap ? 'وصلت' : '**لم تصل**'})`);
  ok(afterLeave.length === 0,
    `و**الخريطةُ صامتة**: لا جملةَ واحدة تُشغَّل بعد استقرارها `
    + `(٣ ثوانٍ مقيسة، ${afterLeave.length} جملةً)`
    + (afterLeave.length ? ` — **واصل العدُّ فوقها: ${afterLeave
      .map((r) => bank[r.key] || r.key).join('، ')}**` : ''));

  const backFrom = earLog.length;
  leakDoc.defaultView.location.hash = '#/count/ten';
  await until(leakDoc, (d) => d.querySelector('.station-body .next'), 20000);
  await new Promise((r) => setTimeout(r, 900));
  const namesBack = earLog.slice(backFrom).filter((t) => NAME_HEARD.includes(t));
  const drawnBack = Number(leakDoc.querySelector('.q-stage .figure')?.dataset.drawn);
  const cleanRun = NAME_HEARD.slice(1, drawnBack + 1);
  ok(namesBack.length === cleanRun.length && namesBack.every((t, i) => t === cleanRun[i]),
    `**والعودةُ تبدأ من صفر**: عدٌّ واحدٌ من «${NAME_HEARD[1]}» إلى ما رُسِم `
    + `(المرسومُ ${drawnBack}، وسُمع: ${namesBack.join('، ') || 'لا شيء'})`);

  }   // ————— ختامُ نطاق `audio` (صدرُه: التسريب) —————

  if (inScope('screens')) {

  /* ————— ١١ل) **إشعارُ التحديث الهادئ** (الجلسة ١٠·أ — تتمةُ أمر المالك) —————

     رؤيةُ النسخة في لوحة وليّ الأمر تجيب مَن سأل، **والإشعارُ يغني عن السؤال**: قشرةٌ
     جديدة تتفعّل والصفحةُ مفتوحة تترك الجهازَ على شيفرةٍ قديمة تعمل وجديدةٍ تنتظر
     فتحة — وهو ما أفسد شهادةَ الميدان مرّتين (م١ وم٦).

     **وحدودُه تُقاس كنصّه**: أولُ تولٍّ يُبتلَع (تثبيتٌ لا تحديث) · ولا يُرسَم على
     شاشة تمرين · ولا يُسمِع صوتاً ولا يعيد تحميلاً · ولا زرَّ فيه · وهو **في مجرى
     الصفحة** لا طبقةٌ تحجب زرّاً تحتها.

     **والحدثُ يُصطنَع لا يُنتظَر**: `controllerchange` حدثٌ من المتصفّح، فيُبعَث على
     `navigator.serviceWorker` في نافذة التطبيق نفسِها — فيُقاس ما يفعله التطبيق حين
     يقع، بلا تعليقِ الحارس على تفعيلِ قشرةٍ حقيقيّ (وذاك مصدرُ حُمرةٍ كاذبة تحت
     الحمل — بلاغُ العائلة `busy-machine-false-reds`). */

  const UPDATE_TEXT = 'وَصَلَ تَحْدِيثٌ — أَغْلِقْ وَافْتَحْ';
  const upDoc = await open('#/');
  const upWin = upDoc.defaultView;
  const noteIn = (d) => d.querySelector('.update-note');
  const claim = () => upWin.navigator.serviceWorker
    .dispatchEvent(new upWin.Event('controllerchange'));
  const settle = (ms = 500) => new Promise((r) => setTimeout(r, ms));

  ok(!noteIn(upDoc), 'لا إشعارَ تحديثٍ على خريطةٍ لم يقع فيها تحديث');

  /* **والفرعُ يُقرأ من الحال لا يُفترَض**: إن كانت الصفحةُ متولَّاةً أصلاً فقد ابتلع
     التطبيقُ تولّيها الحقيقيَّ، فأوّلُ حدثٍ نبعثه **هو التحديث**؛ وإن لم تكن، فأولُ
     ما نبعثه هو التولّي الأول ويجب أن يُبتلَع. وأيّاً كان الفرعُ يُسمّى في التقرير. */
  const wasControlled = Boolean(upWin.navigator.serviceWorker.controller);
  const playsBefore = played.length;
  claim();
  await settle();
  if (!wasControlled) {
    ok(!noteIn(upDoc), '**وأولُ تولٍّ ليس تحديثاً**: يُبتلَع فلا إشعارَ لمن فتح التطبيق أوّلَ مرّة');
    claim();
    await settle();
  } else {
    /* **ولا يُدّعى قياسٌ لم يقع**: الصفحةُ هنا متولَّاةٌ سلفاً (عاملُ الخدمة يعمل على
       خادم الفحص)، فالتولّي الأولُ ابتُلع قبل أن نصل — وهذا نفسُه يُقاس، ويُقال أين
       يقع بابُه المُجرَّب سالباً بدل ادّعاء ما لا يُرى هنا. */
    ok(wasControlled,
      'والصفحةُ متولَّاةٌ سلفاً فأوّلُ حدثٍ مبعوثٍ تحديثٌ لا تولٍّ '
      + '— وبابُ ابتلاع أوّلِ تولٍّ مُجرَّبٌ سالباً في `test_pwa.mjs`');
  }

  const note = noteIn(upDoc);
  ok(note && note.textContent.includes(UPDATE_TEXT),
    `وتفعُّلُ قشرةٍ جديدة يُعلَن سطراً هادئاً: «${UPDATE_TEXT}»`
    + (note ? '' : ' — **لم يظهر شيء**'));
  ok(played.length === playsBefore,
    `**ولا يقطع شيئاً**: صفرُ صوتٍ شُغِّل بسببه (${played.length - playsBefore})`);
  ok(note && !note.querySelector('button, a'),
    'ولا زرَّ فيه ولا رابط — خبرٌ يُقرأ ويُترَك (فلا يقع تحت حارس الصنف)');

  /* **ولا يحجب**: سطرٌ في المجرى (`position: static`) يزحزح ما تحته ولا يعلوه —
     فيُقابَل صندوقُه بصناديق الأزرار الظاهرة كلِّها: تقاطعٌ واحد يكفي حجباً. */
  const noteBox = note?.getBoundingClientRect();
  const covered = !note ? [] : [...upDoc.querySelectorAll('button')]
    .filter((el) => el.offsetParent !== null)
    .map((el) => ({ el, r: el.getBoundingClientRect() }))
    .filter(({ r }) => r.width > 0 && r.height > 0
      && r.left < noteBox.right && r.right > noteBox.left
      && r.top < noteBox.bottom && r.bottom > noteBox.top);
  ok(note && upWin.getComputedStyle(note).position === 'static' && covered.length === 0,
    `وهو في مجرى الصفحة لا يحجب زرّاً${covered.length
      ? ` — **يغطّي: ${covered.map(({ el }) => el.className.split(' ')[0]).join('، ')}**` : ''}`);
  const upOver = upDoc.documentElement.scrollWidth - upWin.innerWidth;
  ok(upOver <= 0, `ولا فائضَ أفقيّ بظهوره (${upOver}px)`);

  /* **ولا يقتحم درساً**: الدخولُ إلى محطةٍ يُسقطه، والعودةُ تردّه — فالخبرُ ينتظر
     في الهدوء ولا يزاحم شاشةً يعمل عليها طفل. */
  upWin.location.hash = '#/count/three';
  await until(upDoc, (d) => d.querySelector('.station-screen'), 12000);
  await settle(300);
  ok(upDoc.querySelector('.station-screen') && !noteIn(upDoc),
    '**ولا يُعرَض على شاشة تمرين**: يغيب بالدخول إلى المحطة (لا يقاطع درساً)');
  upWin.location.hash = '#/';
  await until(upDoc, (d) => d.querySelector('main.map'), 12000);
  await settle(300);
  ok(!!noteIn(upDoc), 'ويعود بالخروج إلى الخريطة (خبرٌ لا يضيع بدخولٍ وخروج)');

  }   // ————— ختامُ نطاق `screens` (ذيلُه: إشعارُ التحديث) —————

  if (inScope('audio')) {

  /* ————— ١٢) **تعاقبُ الصوت**: صوتٌ واحدٌ في الجوّ، والانتقالُ بعد تمامه —————

     ما بلّغ عنه الميدان (`docs/FIELD.md §١`) ثلاثةُ أعراضٍ لعلّةٍ واحدة، وهنا تُقاس
     الثلاثةُ على **أوّل محطةٍ في الرحلة** — وهي عينُ ما فتح عليه المالك:
       أ) **الجملةُ تُسمَع تامّةً** ولا تدهسها التي بعدها («انظر وا… اثنان»).
       ب) **لا لحظةَ فيها صوتان معاً** («صوتان متكرران في الصفحة التالية»).
       ج) **الخطوةُ لا تتقدّم قبل تمام آخر جملةٍ فيها** («لا ينتظر الصوت فينتقل»).

     **ومدّةُ الملفّ الوهميّ ترتفع هنا** فوق مهلتَي الشاشة (`BEAT` ٦٢٠ و`AFTER_RIGHT_MS`
     ٧٨٠): بذلك يصير العطبُ الأصليُّ **مرئياً للحارس** — ولولا ذلك لَمرَّ. */

  const SPEECH_MS = 900;
  audioMs = SPEECH_MS;
  /* **ويبدأ القياسُ قبل فتح الشاشة**: الجملةُ الأولى تُقال ساعةَ تُرسَم — فمن قاس بعد
     أن استقرّت الشاشةُ فاتته **أوّلُ ما يسمعه الطفل**، وهو موضعُ البلاغ بعينه. */
  const seqFrom = performance.now();
  const qdoc = await open('#/subitize/two');

  // أ) خطوةُ «شاهِدْ»: الدعوةُ ثم أسماءُ العدّ — كلٌّ تامّةٌ لا مقطوشة
  const nextBtn = await until(qdoc, (d) => d.querySelector('.station-body .next'), 22000);
  /* **ويُمهَل بعد ظهور «تابِعْ»**: خطوةٌ لا تنتظر صوتَها تبلغ زرَّها والكلامُ خلفها
     ما زال يتساقط — فلو قِيس عند الزرّ وحدَه لَقِيس صمتٌ لم يقع بعد. */
  await new Promise((r) => setTimeout(r, SPEECH_MS * 2));
  const watchRows = timeline.filter((r) => r.t0 >= seqFrom && Number.isFinite(r.t1));
  const cut = watchRows.filter((r) => r.t1 - r.t0 < SPEECH_MS * 0.9);
  // (عددُ الجمل من بيانات المحطة — دعوةٌ ثم اسمٌ لكل عنصرٍ مرسوم، فلا يُكتَب هنا رقمُه)
  ok(watchRows.length >= 2 && cut.length === 0,
    `خطوةُ «شاهِدْ» تُسمِع كلَّ جملةٍ **تامّة** (${watchRows.length} جملةً، `
    + `أقصرُها ${watchRows.length ? Math.round(Math.min(...watchRows.map((r) => r.t1 - r.t0))) : 0}ms `
    + `من ${SPEECH_MS})${cut.length ? ` — **مقطوشٌ: ${cut.map((r) => r.key).join('، ')}**` : ''}`);
  ok(overlaps(seqFrom).length === 0,
    `ولا لحظةَ فيها صوتان يعملان معاً${overlaps(seqFrom).length
      ? ` — **تراكب: ${overlaps(seqFrom).join('، ')}**` : ''}`);

  /* ب) الانتقالُ من خطوةٍ إلى خطوة: إعلانُ الخطوة ثم سؤالُ الشاشة — **وهذا موضعُ
        «الصوتين المتكرّرين»**: كانا يُطلَقان في اللحظة نفسِها فيعملان معاً. */
  const stepFrom = performance.now();
  nextBtn?.click();
  await until(qdoc, (d) => (d.querySelectorAll('.qcard').length ? true : null), 12000);
  await new Promise((r) => setTimeout(r, SPEECH_MS * 2.2));
  const stepRows = timeline.filter((r) => r.t0 >= stepFrom);
  ok(stepRows.length >= 2 && overlaps(stepFrom).length === 0,
    `وعند الانتقال إلى «جَرِّبْ مَعِي» يُسمَع الإعلانُ ثم السؤال **بالتتابع** `
    + `(${stepRows.length} جملةً)${overlaps(stepFrom).length
      ? ` — **معاً: ${overlaps(stepFrom).join('، ')}**` : ''}`);

  /* ج) الجولةُ لا تتقدّم وكلمةُ الصواب في الجوّ: يُنقَر الجوابُ الصحيح، فتُقاس لحظةُ
        انتقال الخرزة وتُقابَل بلحظة تمام «أَحْسَنْتْ». (بالمهلة الثابتة وحدَها كان
        الانتقالُ بعد ٧٨٠ مللي — أي **قبل** تمام جملةٍ طولُها ٩٠٠.) */
  const bead0 = beadNow(qdoc);
  const rowsBefore = timeline.length;
  const cardsNow = [...qdoc.querySelectorAll('.qcard')];
  const stageNow = qdoc.querySelector('.q-stage');
  cardsNow.find((c) => drawnOf(c) === drawnOf(stageNow))?.click();
  let moved = 0;
  for (let waited = 0; waited < 12000 && !moved; waited += 25) {
    await new Promise((r) => setTimeout(r, 25));
    if (beadNow(qdoc) !== bead0 || qdoc.querySelector('.celebrate')) moved = performance.now();
  }
  const praise = timeline.slice(rowsBefore)[0];
  /* **وتمامُها شرطان**: أن يقع الانتقالُ بعد نهايتها، **وأن تكون نهايتُها تماماً لا
     قطعاً** — فالانتقالُ نفسُه يُسكت القناة، فلو مضى مبكّراً لَقطع الكلمةَ وسجّل
     «نهايةً» في اللحظة نفسِها فمرّ الشرطُ الأول وحدَه. */
  const full = praise && Number.isFinite(praise.t1) && praise.t1 - praise.t0 >= SPEECH_MS * 0.9;
  ok(moved && full && moved >= praise.t1,
    `و**الجولةُ لا تتقدّم قبل تمام كلمة الصواب**: سُمعت ${praise
      ? Math.round(praise.t1 - praise.t0) : '؟'}ms من ${SPEECH_MS}، والانتقالُ بعد تمامها بـ`
    + `${moved && praise ? Math.round(moved - praise.t1) : '؟'}ms`);
  audioMs = 60;

  // ————— ج) الصوت في مسار الطفل: من البنك لا من نطقٍ آليّ —————
  const heard = [...new Set(played)];
  ok(heard.length > 0, `الصوتُ يُشغَّل من البنك في مسار الطفل (${played.length} تشغيلاً، `
    + `${heard.length} نصّاً مختلفاً)`);
  const unknown = heard.filter((key) => !(key in bank));
  ok(unknown.length === 0,
    `وكلُّ ما شُغِّل له ملفٌّ في الفهرس${unknown.length ? ` — بلا ملف: ${unknown.slice(0, 5).join('، ')}` : ''}`);
  /* **وعلى الرحلة كلِّها**: ما مضى من هذه الصفحة ساق ثماني محطاتٍ لمساً — بخطواتها
     وجولاتها وأخطائها وعدّها أمام الطفل. فيُقابَل التشغيلُ بالتشغيل في **كل ما وقع**:
     لا لحظةَ واحدة فيها صوتان معاً. (الحارسُ الذي يعدّ التشغيلات كان أخضرَ والعيبُ
     صارخ — وهذا يقيس ما سمعته الأذن.) */
  closeOpen();
  const clashes = overlaps(0);
  // (والعبارةُ تتبع ما سِيق فعلاً: نطاقٌ واحد لا يدّعي «الرحلةَ كلَّها» — لا سقفَ صامت.)
  ok(clashes.length === 0,
    `ولا لحظةَ ${want.size === SCOPES.length ? 'في الرحلة كلِّها' : 'فيما سِيق'} `
    + `يعمل فيها صوتان معاً (${timeline.length} تشغيلاً مقيساً)`
    + (clashes.length ? ` — **تراكب: ${[...new Set(clashes)].slice(0, 5).join('، ')}**` : ''));

  const stray = spoken.filter((t) => !pendingAudio.has(t));
  ok(stray.length === 0,
    `ولا لجوءَ إلى النطق الآليّ إلا لنصٍّ ينتظر التصريف (المنتظِر في القائمة: `
    + `${pendingAudio.size}، ولجوءٌ وقع: ${spoken.length}`
    + `${stray.length ? `، خارجَ القائمة: ${stray.join('، ')}` : ''})`);

  }   // ————— ختامُ نطاق `audio` (ذيلُه: التعاقبُ والبنك) —————

  } catch (err) {
    ok(false, `عطبٌ في صفحة الفحص: ${(err && (err.stack || err.message)) || err}`);
  }

  clearTimeout(watchdog);
  await report(out, skipped);
</script>
