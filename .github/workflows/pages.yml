# نشر «اِحْسِبْ» إلى GitHub Pages — مجلد `app/` وحده هو الموقع.
#
# لماذا `app/` لا جذر المستودع: التطبيق كله ملفات ثابتة (HTML/CSS/JS بوحدات ES،
# بلا أدوات بناء ولا npm)، فالنشر نسخٌ لا بناء. وما سواه (docs/ و tools/) عدّةُ
# عملٍ لا تُخدَم للطفل — ومنه لوحاتُ المراجعة ومرشَّحاتُ الرموز.
#
# **والنشرُ عند الدفع لا عند الالتزام**: التزامٌ محلّيّ لا يبلغ الموقعَ الحيّ حتى
# يُدفَع، وهي الفجوةُ التي لا يمسكها فحصٌ على القرص — ولذلك `tools/check_live.py`
# يفحص المنشور بجلبٍ فعليّ بعد النشر.
#
# **والنطاق `calc.mishkat.qa`**: ملفُّه مُعَدٌّ في `docs/CNAME` ولم يُنشَر بعد — يُنقَل
# إلى `app/` يومَ يُضبَط Cloudflare (خطواتُ المالك في `docs/SESSIONS.md`، الجلسة ٩).
# **وعلّةُ التأجيل**: ملفُّ النطاق يُحوِّل عنوانَ النشر إلى النطاق فورَ وصوله، فلو سبق
# ضبطَ الأسماء لصار الموقعُ لا يُفتَح من عنوانٍ ألبتّة حتى يُضبَط.

name: نشر إلى GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشرةٌ واحدة في كل لحظة، ولا تُلغى الجارية: آخر دفعةٍ تصل هي آخر ما يُنشَر.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Pages
        uses: actions/configure-pages@v5

      - name: رفع مجلد التطبيق أثراً
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
